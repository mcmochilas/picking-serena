function openReceb(n){ if(!n) return; const c=!n.received && n.conf; // conferência salva: continua de onde parou
  state.rc={ id:n.id, vols: n.received ? n.received.vols : (c ? c.vols||0 : 0), chk: c ? JSON.parse(JSON.stringify(c.chk||{})) : {} }; render(); scrollTo(0,0); }
// grava o andamento da conferência na própria nota (outra pessoa ou outro aparelho pode continuar)
function saveConf(){ const rc=state.rc; if(!rc) return; const now=Date.now(), base=NFS[rc.id] || {...rc.tmp, createdAt:now}; if(base.received) return;
  const doc={...base, conf:{vols:rc.vols, chk:rc.chk, at:now, by:ME.id||""}}; NFS[doc.id]=doc; if(nfCol) queueWrite("nf-"+doc.id, ()=>nfCol.doc(doc.id).set(JSON.parse(JSON.stringify(doc)))); }
function scanReceb(v){
  const ci=chaveInfo(v);
  if(state.rc && !state.rc.tmp && NFS[state.rc.id] && (ci ? NFS[state.rc.id].chave===ci.chave : NFS[state.rc.id].num===String(+onlyDigits(v)))){ feedback(true); state.rc.vols++; saveConf(); render(); return setMsg(`${state.rc.vols} caixa(s) contada(s)`,"good"); }
  let found=[];
  if(ci) found=Object.values(NFS).filter(n=>n.chave===ci.chave || (!n.chave && n.num===ci.num && (!n.cnpj || onlyDigits(n.cnpj)===ci.cnpj)));
  else if(/^\d{1,9}$/.test(onlyDigits(v)) && onlyDigits(v).length===String(v).replace(/\s/g,"").length) found=Object.values(NFS).filter(n=>n.num===String(+onlyDigits(v)));
  if(found.length===1){ feedback(true); openReceb(found[0]); return setMsg(`NF ${found[0].num} · conte as caixas`,"good"); }
  if(found.length>1){ feedback(false); return setMsg(`Há ${found.length} notas com o número ${found[0].num}. Toque na nota certa na lista ou bipe o código de barras.`,"bad"); }
  if(ci){ feedback(true); state.rc={ id:"NF-"+ci.chave, vols:0, chk:{}, tmp:{ id:"NF-"+ci.chave, chave:ci.chave, num:ci.num, serie:ci.serie, cnpj:ci.cnpj, forn:"", vols:0, lines:[] } }; render(); return setMsg(`NF ${ci.num} ainda não importada · registre a chegada`,"info"); }

}
function confirmReceb(){
  const rc=state.rc; if(!rc) return; const now=Date.now();
  const base = NFS[rc.id] || {...rc.tmp, createdAt:now};
  // conferência: o recebido de cada item vai primeiro para as pré-vendas (na ordem da amarração), o resto para estoque
  const lines=(base.lines||[]).map((l,k)=>({qty: rc.chk[k] ? rc.chk[k].qty : l.qty, exp:l.qty})), alloc={};
  (base.lines||[]).forEach((l,k)=>{ let left=lines[k].qty; (l.alloc||[]).forEach(a=>{ const q=Math.min(left, +a.qty||0); alloc[a.oid+":"+a.i]=q; left-=q; }); });
  const div = lines.some(x=>x.qty!==x.exp) || (base.vols && rc.vols!==base.vols);
  const doc = {...base, conf:null, received:{at:now, by:ME.id||"", vols:rc.vols, expected:base.vols||0, lines, alloc, div}};
  NFS[doc.id]=doc; if(nfCol) queueWrite("nf-"+doc.id, ()=>nfCol.doc(doc.id).set(JSON.parse(JSON.stringify(doc))));

}

/* Linha do tempo do pedido (Separados): junta as datas do fluxo com o histórico registrado */
function orderTimeline(o){
  const ev=[], add=(t,txt,by,k)=>{ if(t) ev.push({t:+t, txt, by:by||"", k:k||""}); };
  const how = x => x==="retirou" ? "Retirado pelo cliente" : x==="entregue" ? "Entregue ao cliente" : "Enviado";
  add(o.createdAt, isEco(o) ? `Pedido importado da Magazord · ${o.origem||"Site"}${isManual(o)?" · manual":""}` : (o.hiveManual ? "Pré-venda cadastrada direto na colmeia" : "Pré-venda integrada pelo Comercial"), o.createdBy, "start");
  if(o.decidedAt) add(o.decidedAt, `Compras decidiu · ${MODES[o.mode]?.t||o.mode}`, o.decidedBy);
  (o.restarts||[]).forEach(r=>add(r.at, `Separação reiniciada${r.done?` (${r.done} item(ns) já coletados voltaram a zero)`:""}`, r.by, "warn"));
  if(o.startedAt) add(o.startedAt, "Separação iniciada", o.startedBy);
  if(o.pickedAt && o.conferidoLocal) add(o.pickedAt, "Conferido no local, peça por peça (cliente na loja)", o.pickedBy, "ok");
  else if(o.pickedAt) add(o.pickedAt, `Separação concluída${o.startedAt&&o.pickedAt>o.startedAt?` · picking ${fmtDur(o.pickedAt-o.startedAt).replace(/ \d+s$/,"")}`:""}`, o.pickedBy, "ok");
  if(o.atMesaAt && o.atMesaAt!==o.pickedAt) add(o.atMesaAt, "Na mesa de expedição");
  if(o.storedAt) add(o.storedAt, `Guardado na colmeia${o.colmeia?" "+o.colmeia.slice(3):""}`);
  if(o.arrivedAt) add(o.arrivedAt, "Encomenda chegou · volta para a separação", o.arrivedBy, "ok");
  if(o.sentAt1) add(o.sentAt1, `1º envio · ${how(o.saida1)}`, o.saida1By, "ok");
  if(o.sentAt) add(o.sentAt, how(o.saida), o.saidaBy, "end");
  if(o.deletedAt) add(o.deletedAt, `Excluído${o.deleteReason?" · "+o.deleteReason:""}`, o.deletedBy, "bad");
  (o.hist||[]).forEach(h=>add(h.t, h.ev, h.by, /exclu|cancel/i.test(h.ev)?"bad":/ajust|editad|pulado|separador:|canal:/i.test(h.ev)?"edit":""));
  const seen=new Set();
  return ev.filter(e=>{ const k=e.t+"|"+e.txt; if(seen.has(k)) return false; seen.add(k); return true; }).sort((a,b)=>a.t-b.t);
}

function xpToggle(box, btn, open){

/* ================== Mapa do estoque ================== */
let animToken = 0, lastAnimKey = null;
/* Layout real do estoque (vista de cima, mesa de separação embaixo):

   ruas A e B deitadas no fundo (lado A = estante mais perto da mesa, lado B = mais ao fundo),
   o corredor da rua 4 sobe até o fundo, ao lado da estante pequena (rua 4, lado B). */
const MAP = (()=>{
  const W=320, H=484, rackW=22, aisle=40, x0=14;
  const vx = k => x0 + (k-1)*(rackW+aisle);            // estante em pé k (1..4)
  const aisleX = r => vx(r) + rackW + aisle/2;          // centro do corredor da rua r
  const vTop=180, vBot=394, front=416;
  const hW = vx(4) + rackW - x0;
  const H2 = {x:x0, y:44, w:hW, h:20}, H1 = {x:x0, y:110, w:hW, h:20};
  const ruaB = (H2.y+H2.h+H1.y)/2, ruaA = (H1.y+H1.h+vTop)/2;
  const small = {x:aisleX(4)+aisle/2-2, y:50, w:20, h:118};
  const mesa = {x:52, y:436, w:216, h:28};
  return {W,H,rackW,aisle,x0,vx,aisleX,vTop,vBot,front,H1,H2,ruaA,ruaB,small,mesa,start:{x:160,y:front}};
})();
/* Lado montado (ex.: Rua 1, lado A, encostado na parede): gaveteiros no chão e, em cima deles, colmeia e pilhas de caixas bin.

   Medidas aproximadas em metros; a coluna A começa na ponta da frente (perto da mesa de expedição). */

function sideLayout(r,l){
  const bs=Object.values(BLOCKS).filter(b=>b.r===r && b.l===l), gav=bs.find(b=>b.t==="GAV");
  if(!gav || !bs.some(b=>b.base)) return null;
  const nG=colIdx(gav.c2)-colIdx(gav.c1)+1, gTop=PHY.gPl+(gav.n2-gav.n1+1)*PHY.gH;
  const span=b=>{ const s=b.g1?Math.max(0,colIdx(b.g1)-colIdx(gav.c1)):0, e=b.g2?Math.min(nG,colIdx(b.g2)-colIdx(gav.c1)+1):nG; return [s*PHY.gW, Math.max(s+1,e)*PHY.gW]; };
  const els=[{b:gav, t:"GAV", a0:0, a1:nG*PHY.gW, y0:PHY.gPl, lh:PHY.gH, d:PHY.gD}];
  bs.filter(b=>b.base==="gav").forEach(b=>{ const [a0,a1]=span(b); els.push({b, t:b.t, a0, a1, y0:gTop, lh:b.t==="COL"?PHY.cH:PHY.bH, d:b.t==="COL"?PHY.cD:PHY.bD}); });
  const col=els.find(e=>e.t==="COL");
  bs.filter(b=>b.base==="col").forEach(b=>{ if(col) els.push({b, t:b.t, a0:col.a0, a1:col.a1, y0:col.y0+(col.b.n2-col.b.n1+1)*col.lh, lh:PHY.bH, d:PHY.bD}); });
  els.forEach(e=>{ e.nc=colIdx(e.b.c2)-colIdx(e.b.c1)+1; e.nl=e.b.n2-e.b.n1+1; e.cw=(e.a1-e.a0)/e.nc; e.top=e.y0+e.nl*e.lh; });

function locPhys(l){ if(!l) return null; const L=sideLayout(l.r,l.l); if(!L) return null; const e=L.els.find(e=>inBlock(e.b,l)); if(!e) return null;

function locSelo(l){ const ph=locPhys(l);
  if(ph){ const e=ph.e, nth=l.n-e.b.n1+1;
    if(e.t==="GAV") return {big:`Gaveta ${l.n}`, sm:`Gaveteiro ${l.c} · ${ordinal(nth)} gaveta de baixo`};
    if(e.t==="COL") return {big:`Nicho ${l.n}.${l.c}`, sm:`Colmeia · ${ordinal(nth)} linha de baixo · coluna ${l.c}`};
    return {big:`Caixa ${l.n}`, sm:`Pilha ${l.c} ${e.b.base==="col"?"em cima da colmeia":"em cima dos gaveteiros"} · ${ordinal(nth)} caixa de baixo`}; }

function mapTarget(l){
  const M=MAP, cols=Math.max(1, l.ci+1, ...Object.values(BLOCKS).filter(b=>b.r===l.r && b.l===l.l).map(b=>colIdx(b.c2)+1));
  const f=(l.ci+0.5)/cols;
  if(typeof l.r==="number" && l.r>=1 && l.r<=4){
    const ax=M.aisleX(l.r), ph=!(l.l==="B" && l.r===4) ? locPhys(l) : null;
    if(ph){ const y=M.vBot - Math.min(M.vBot-M.vTop-2, ph.along/NAV_M), seg=ph.w/NAV_M, rx = l.l==="A" ? M.vx(l.r) : M.vx(l.r+1);

function mapRoute(a, b){ // caminho pelos corredores (a = item anterior ou null = mesa)
  const M=MAP, N={S:M.start}, E=[];
  for(let k=1;k<=4;k++){ N["f"+k]={x:M.aisleX(k),y:M.front}; N["t"+k]={x:M.aisleX(k),y:M.ruaA}; E.push(["S","f"+k],["f"+k,"t"+k]); if(k<4) E.push(["f"+k,"f"+(k+1)],["t"+k,"t"+(k+1)]); }

  const att = t => t.kind==="v" ? ["f"+t.aisle,"t"+t.aisle] : t.kind==="A" ? [1,2,3,4].map(k=>"t"+k) : t.kind==="B" ? ["b4"] : ["S"];

/* Mapa em 3D (vista de cima em perspectiva): mesma planta e mesma rota, com as estantes em volume.

/* Mostra só as linhas da fila que cabem na tela e conta o resto em "+ N pedidos" */
function tvFit(){
  // números dos indicadores: diminuem só o necessário para caber no quadrinho
  document.querySelectorAll(".tvkpis b").forEach(b=>{ b.style.fontSize=""; let f=parseFloat(getComputedStyle(b).fontSize), n=0;
    while(b.scrollWidth>b.clientWidth+1 && n++<25){ f*=.94; b.style.fontSize=f+"px"; } });
  document.querySelectorAll(".tvlist.fit").forEach(l=>{
  const col=l.closest(".tvcol"), rows=[...l.querySelectorAll(".tvrow")], box=col&&col.querySelector(".tvdone"), done=box?[...box.querySelectorAll(".tvrow")]:[];
  rows.forEach(r=>r.hidden=false); done.forEach(r=>r.hidden=false); if(box) box.hidden=false; let hid=0;
  const fitN=()=>{ const lb=l.getBoundingClientRect().bottom+1; let n=0; for(const r of rows){ if(r.getBoundingClientRect().bottom<=lb) n++; else break; } return n; };
  // a fila tem prioridade: se não couberem ao menos 4 pedidos, "Últimos separados" encolhe para 1 linha (e só some se nem 2 couberem)
  for(let k=done.length-1; k>=1 && fitN()<Math.min(rows.length,4); k--) done[k].hidden=true;
  if(box && done.length && fitN()<Math.min(rows.length,2)) box.hidden=true;
  for(let k=rows.length-1; k>=0 && l.scrollHeight>l.clientHeight+1; k--){ rows[k].hidden=true; hid++; }
  const total=+l.dataset.total||0, shown=rows.length-hid, more=l.nextElementSibling;
  if(more && more.hasAttribute("data-more")) more.textContent = total>shown ? `+ ${total-shown} pedido${total-shown===1?"":"s"} na fila` : "";
}); }
window.addEventListener("resize", ()=>{ if(document.querySelector(".tvgrid")) tvFit(); });
setInterval(()=>{ const c=document.getElementById("tvClock"); if(c) c.textContent=new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}); }, 5000);

/* ================== Separação em lote (e-commerce) ==================
   O separador escolhe "por canal" ou "por transportadora" e marca quais; o sistema abre
   o pedido mais antigo do grupo e, ao concluir na mesa, oferece o próximo até acabar. */
const LOTE_KEY="ps-lote";
state.lote = (()=>{ try{ return JSON.parse(localStorage.getItem(LOTE_KEY)||"null"); }catch(e){ return null; } })();
const saveLote = () => { try{ state.lote ? localStorage.setItem(LOTE_KEY, JSON.stringify(state.lote)) : localStorage.removeItem(LOTE_KEY); }catch(e){} };
const LOTE_BY = { canal:{t:"Canal", f:"origem"}, transportadora:{t:"Transportadora", f:"transportadora"} };
const loteVal = (o, by) => o[LOTE_BY[by].f] || (by==="canal" ? "Site" : "Sem transportadora");
const loteMatch = (o, L=state.lote) => !!L && isEco(o) && L.vals.includes(loteVal(o, L.by));
function lotePending(L=state.lote){ // pedidos do lote ainda por separar (os meus em andamento primeiro)
  return ORDERS.filter(o=>loteMatch(o,L) && !isManual(o) && !(L?.skipped||[]).includes(o.id) && pickList(o).length && !o.mzCancelado && !o.mzMudou && !notMine(o) &&
      (o.status==="aguardando" || (o.status==="separando" && (!o.startedBy || o.startedBy===ME.id))))
    .sort((a,b)=>((b.status==="separando")-(a.status==="separando")) || (a.createdAt||0)-(b.createdAt||0));
}
function loteNext(){
  const nx=lotePending()[0];
  if(nx){ openOrder(nx.id); return true; }
  toast(`Lote concluído · ${state.lote?.done||0} pedido(s) separados${state.lote?.skipped?.length?` · ${state.lote.skipped.length} pulado(s), voltaram para a fila`:""}`); state.lote=null; saveLote(); state.view="orders"; render(); return false;
}
function loteBoxHTML(){
  const L=state.lote;
  if(L){ const n=lotePending().length;
    return `<div class="lotebox on"><div><div class="eyebrow">Separação em lote · ${esc(LOTE_BY[L.by].t)}</div><b>${L.vals.map(esc).join(" · ")}</b><small>${L.done||0} separado(s) · ${n} restante(s)</small></div>
      <div class="lotebtns"><button class="btn primary sm" id="loteGo" ${n?"":"disabled"}>${n?"Continuar":"Sem pedidos"}</button><button class="btn ghost sm" id="loteEnd">Encerrar</button></div></div>`; }
  return `<div class="lotebox"><div><b>Separação em lote</b><small>Escolha por canal ou por transportadora e separe um pedido atrás do outro. Pedidos manuais ficam fora do lote.</small></div>
    <button class="btn primary playbtn" id="loteNew" aria-label="Iniciar separação em lote" title="Iniciar separação em lote"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg></button></div>`;
}
function bindLote(){
  const nw=document.getElementById("loteNew"); if(nw) nw.onclick=openLoteModal;
  const go=document.getElementById("loteGo"); if(go) go.onclick=()=>loteNext();

function openLoteModal(){
  const avail = ORDERS.filter(o=>isEco(o) && !isManual(o) && ecoOk(o) && pickList(o).length && !o.mzCancelado && !o.mzMudou && !notMine(o) && (o.status==="aguardando" || (o.status==="separando" && o.startedBy===ME.id)));
  let by="transportadora", sel=new Set();
  const ov=document.createElement("div"); ov.className="modal"; document.body.appendChild(ov); scanbar.hidden=true;
  const close=()=>{ ov.remove(); render(); };
  const draw=()=>{
    const groups={}; avail.forEach(o=>{ const v=loteVal(o,by); groups[v]=(groups[v]||0)+1; });
    const list=Object.entries(groups).sort((a,b)=>b[1]-a[1]);
    ov.innerHTML=`<div class="mbox lotem" role="dialog" aria-modal="true" aria-label="Separação em lote"><h2>Separação em lote</h2>
      <p>Separar por:</p>
      <div class="seg lotetype">${Object.entries(LOTE_BY).map(([k,v])=>`<button data-by="${k}" aria-pressed="${by===k}">${v.t}</button>`).join("")}</div>
      <p style="margin-top:12px">Marque ${by==="canal"?"os canais":"as transportadoras"}:</p>
      <div class="lotelist">${list.map(([v,n])=>`<label class="loteopt"><input type="checkbox" value="${esc(v)}" ${sel.has(v)?"checked":""}><span>${by==="transportadora"&&TRANSP[v]?.logo?`<img class="tlogo" src="${TRANSP[v].logo}" alt="${esc(v)}" title="${esc(v)}">`:esc(v)}</span><b class="tnum">${n}</b></label>`).join("") || `<div class="empty">Nenhum pedido do e-commerce para separar.</div>`}</div>
      <div class="mact"><button class="btn ghost" id="lmNo">Cancelar</button><button class="btn primary" id="lmGo" ${sel.size?"":"disabled"}>Iniciar ${sel.size?`· ${list.filter(([v])=>sel.has(v)).reduce((a,[,n])=>a+n,0)} pedido(s)`:""}</button></div></div>`;
    ov.querySelectorAll("[data-by]").forEach(b=>b.onclick=()=>{ if(by!==b.dataset.by){ by=b.dataset.by; sel=new Set(); draw(); } });
    ov.querySelectorAll(".loteopt input").forEach(c=>c.onchange=()=>{ c.checked?sel.add(c.value):sel.delete(c.value); draw(); });
    ov.querySelector("#lmNo").onclick=close;
    ov.querySelector("#lmGo").onclick=()=>{ state.lote={by, vals:[...sel], started:Date.now(), done:0}; saveLote(); ov.remove(); toast(`Lote iniciado · ${[...sel].join(", ")}`); loteNext(); };
  };
  ov.onclick=e=>{ if(e.target===ov) close(); };
  draw();
}

/* Botão "Atualizar" da fila: busca os pedidos de novo no servidor */
let refreshing=false;
async function refreshQueue(){
  if(refreshing) return; refreshing=true;
  const b=document.getElementById("refreshQ"); if(b){ b.classList.add("spin"); b.disabled=true; }
  try{
    if(!window.psRefresh){ location.reload(); return; }
    await Promise.race([window.psRefresh(), new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),15000))]);
    synced=true; checkNewOrders();
    const q=ORDERS.filter(o=>(o.status==="aguardando"||o.status==="separando") && pickList(o).length).length;
    render(); toast(`Fila atualizada · ${q} pedido${q===1?"":"s"} para separar`);
  }catch(e){ toast("Não foi possível atualizar. Verifique a internet."); render(); }
  finally{ refreshing=false; }
}
/* Separação em lote: pular o pedido atual (volta para a fila, sem o separador) e seguir para o próximo do lote */
async function skipLote(id){
  const o=ORDERS.find(x=>x.id===id), L=state.lote; if(!o || !L) return;
  const r=res(o), got=(o.items||[]).reduce((s,it,i)=>s+(r[i]?.got||0),0);
  const ok=await askModal({title:`Pular o pedido #${o.num}?`, okText:"Pular pedido",
    text:`O pedido volta para a fila de separação (outro separador pode pegar) e o lote segue para o próximo.${got?` <b>Devolva aos locais as ${got} pç já coletadas</b>; o que foi coletado volta a zero.`:""}${o.tray&&o.trayStatus==="separando"?` A ${esc(trayLabel(o.tray))} é liberada.`:""}`});
  if(!ok) return;
  const qa=Date.now(); if(seenOrders) seenOrders.add(o.id+":"+(o.createdAt||0)+":"+qa); // quem pulou não recebe o aviso de "pedido novo"
  patchOrder(o.id, {status:"aguardando", res:o.items.map(()=>({status:"pend",got:0})), startedAt:null, startedBy:"", queuedAt:qa,
    ...(o.tray&&o.trayStatus==="separando"?{tray:"", trayStatus:""}:{}),
    hist:[...(o.hist||[]), {t:Date.now(), by:ME.id||"", ev:"Pulado na separação em lote"+(got?` (${got} pç coletadas devolvidas)`:"")}]});
  L.skipped=[...(L.skipped||[]), o.id]; saveLote();
  toast(`Pedido #${o.num} pulado · volta para a fila`);
  loteNext();
}
async function restartOrder(id, reopen){
  const o=ORDERS.find(x=>x.id===id); if(!o) return;
  const r=res(o), pl=pickList(o), done=pl.filter(x=>r[x.i].status!=="pend").length;
  const ok=await askModal({title:`Reiniciar a separação #${o.num}?`, okText:"Reiniciar",
    text:`O que já foi coletado (${done} de ${pl.length} itens) volta a zero e o tempo de picking recomeça.${o.tray&&o.trayStatus==="separando"?` A ${esc(trayLabel(o.tray))} é liberada; bipe a bandeja de novo.`:""} Devolva as peças já coletadas aos locais.`});
  if(!ok) return;
  patchOrder(o.id, {status:"aguardando", res:o.items.map(()=>({status:"pend",got:0})), startedAt:null, startedBy:"",
    ...(o.tray&&o.trayStatus==="separando"?{tray:"", trayStatus:""}:{}),
    restarts:[...(o.restarts||[]), {at:Date.now(), by:ME.id||"", done}]});
  toast(`Separação #${o.num} reiniciada`);
  if(reopen) openOrder(o.id); else { state.view="orders"; render(); }
}
async function deleteOrder(id){
  const o=ORDERS.find(x=>x.id===id); if(!o) return;
  const reason=await askModal({title:`Excluir a separação #${o.num}?`, okText:"Excluir separação", danger:true,
    text:`O pedido de <b>${esc(o.client)}</b> sai da fila de separação. Escreva o motivo da exclusão:`,
    input:{placeholder:"Ex.: pedido cancelado pelo cliente, pré-venda duplicada…", min:5, minMsg:"Escreva o motivo (pelo menos 5 letras)."}});
  if(!reason) return;
  patchOrder(o.id, {status:"excluido", deletedAt:Date.now(), deletedBy:ME.id||"", deleteReason:reason,
    ...(o.tray&&["separando","mesa"].includes(o.trayStatus)?{trayStatus:"livre"}:{})});
  ORDERS=ORDERS.filter(x=>x.id!==o.id); DELETED=[...DELETED, o];
  toast(`Separação #${o.num} excluída`);
  state.view="orders"; render(); scrollTo(0,0);
}

/* ================== EXPEDIÇÃO: coleta ================== */
const BACK_BTN = `<button class="back" id="back" aria-label="Voltar aos pedidos"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>`;
const ICON_INFO = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>`;
/* ---- Estoque do item em separação: consulta na hora no AdSomos, via extensão do Chrome da loja ----
   Aba "Estoque": físico e reservado. Aba "Movimentações": até 3 entradas e as devoluções dos últimos 45 dias. */
async function openStock(it){
  const ov=document.createElement("div"); ov.className="modal"; document.body.appendChild(ov); scanbar.hidden=true;
  let vivo=true, aba="saldo", seq=0; const cache={};
  const close=()=>{ vivo=false; ov.remove(); render(); };
  const fmtN=v=>Number(v).toLocaleString("pt-BR",{maximumFractionDigits:3});
  const fmtH=iso=>new Date(iso).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
  const fmtD=ymd=>{ const [y,m,d]=String(ymd).split("-"); return d&&m&&y ? `${d}/${m}/${y}` : esc(ymd); };
  const FAIL=`<div class="stkfail"><svg width="56" height="56" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="var(--bad)"/><path d="M8.5 8.5l7 7M15.5 8.5l-7 7" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg><b>Não foi possível consultar o estoque</b></div>`;
  const movRows=(lst,vazio)=> lst.length ? `<div class="stkmov">${lst.map(m=>`<div class="stkmi"><div class="stkmh"><b class="tnum">${fmtD(m.data)}</b><b class="tnum">${fmtN(m.qtd)} pç</b></div><div class="stkms">${esc(m.op)}${m.nota?` · NF ${esc(m.nota)}`:""}</div>${m.parceiro?`<div class="stkms">${esc(m.parceiro)}</div>`:""}</div>`).join("")}</div>` : `<div class="stkempty">${vazio}</div>`;
  const corpo=r=>{
    if(!r) return `<div class="stkmsg">Consultando no AdSomos…</div>`;
    if(r.fail) return FAIL;
    if(aba==="saldo") return `<div class="stklist">
        <div class="stkrow"><span>Físico</span><b class="tnum">${fmtN(r.fisico)}</b></div>
        <div class="stkrow"><span>Reservado</span><b class="tnum">${fmtN(r.reservado)}</b></div>
      </div><div class="stkat">Última consulta: ${fmtH(r.respondido_em)}</div>`;
    const d=r.dados||{}, dias=d.dias||45;
    return `<div class="eyebrow">Últimas entradas · ${dias} dias</div>${movRows(d.entradas||[],"Nenhuma entrada no período.")}
      <div class="eyebrow" style="margin-top:12px">Devoluções · ${dias} dias</div>${movRows(d.devolucoes||[],"Nenhuma devolução no período.")}
      <div class="stkat">Última consulta: ${fmtH(r.respondido_em)}</div>`;
  };
  const draw=()=>{
    const r=cache[aba];
    ov.innerHTML=`<div class="mbox stkbox" role="dialog" aria-modal="true" aria-label="Estoque do produto ${esc(it.code)}"><h2>Estoque</h2>
      <p><b class="tnum">${esc(it.code)}</b> · ${esc(it.name)}</p>
      <div class="seg stkseg" role="tablist"><button type="button" role="tab" data-aba="saldo" aria-pressed="${aba==="saldo"}">Estoque</button><button type="button" role="tab" data-aba="mov" aria-pressed="${aba==="mov"}">Movimentações</button></div>
      ${corpo(r)}
      <div class="mact">${r&&r.fail?`<button class="btn ghost" id="stkRe">Tentar de novo</button>`:""}<button class="btn primary" id="stkOk">Fechar</button></div></div>`;
    ov.querySelector("#stkOk").onclick=close;
    const re=ov.querySelector("#stkRe"); if(re) re.onclick=()=>consultar(aba);
    ov.querySelectorAll("[data-aba]").forEach(b=>b.onclick=()=>{ aba=b.dataset.aba; if(!cache[aba]) consultar(aba); else draw(); });
    ov.querySelector("#stkOk").focus();
  };
  ov.onclick=e=>{ if(e.target===ov) close(); };
  ov.addEventListener("keydown",e=>{ if(e.key==="Escape"){ e.preventDefault(); close(); } else if(e.key==="Enter" && e.target.id==="stkOk"){ e.preventDefault(); close(); } e.stopPropagation(); });
  async function consultar(tipo){
    const meu=++seq; delete cache[tipo]; if(aba===tipo) draw();

async function openLiveScanner(){
  if(!navigator.mediaDevices?.getUserMedia) return false;
  let stream;
  try{ stream = await navigator.mediaDevices.getUserMedia({audio:false, video:{facingMode:{ideal:"environment"}, width:{ideal:1280}, height:{ideal:720}}}); }
  catch(e){ return false; }
  const ov=document.createElement("div"); ov.className="camov"; ov.setAttribute("role","dialog"); ov.setAttribute("aria-label","Leitor por câmera");
  ov.innerHTML=`<video playsinline muted autoplay></video><div class="camframe"><i></i></div><div class="camhint">Aponte para o código de barras</div><button class="btn" id="camClose">Fechar</button>`;
  document.body.appendChild(ov);
  const v=ov.querySelector("video"); v.srcObject=stream;
  try{ await Promise.race([v.play(), new Promise(r=>setTimeout(r,1500))]); }catch(e){}
  try{ const t=stream.getVideoTracks()[0], c=t.getCapabilities?.(); if(c?.focusMode?.includes("continuous")) await t.applyConstraints({advanced:[{focusMode:"continuous"}]}); }catch(e){}
  let stop=false, lastTxt="", lastAt=0; const hint=ov.querySelector(".camhint"), frame=ov.querySelector(".camframe");
  // tempo para posicionar o celular antes de começar a ler (ao abrir e depois de cada leitura)
  const OPEN_WAIT=1800, NEXT_WAIT=1200; let armAt=Date.now()+OPEN_WAIT, armMsg=(scanMode()==="camera" && scanMsg.textContent) || "Aponte para o código de barras";
  let opening=true;
  const waitHint=()=>{ const left=armAt-Date.now(); if(left>0){ frame.classList.add("wait"); if(opening){ hint.className="camhint"; hint.textContent=`Posicione o código no quadro… ${Math.ceil(left/1000)}`; } return true; }
    opening=false;
    if(frame.classList.contains("wait")){ frame.classList.remove("wait"); hint.textContent=armMsg; } return false; };
  waitHint();
  const close=()=>{ stop=true; stream.getTracks().forEach(t=>t.stop()); ov.remove(); focusScan(); };
  ov.querySelector("#camClose").onclick=close;
  let det=null; try{ if("BarcodeDetector" in window){ const f=await BarcodeDetector.getSupportedFormats(); if(f.includes("ean_13")) det=new BarcodeDetector({formats:["ean_13","ean_8","code_128"].filter(x=>f.includes(x))}); } }catch(e){}
  let reader=null;
  if(!det){ try{ await ensureZXing(); const h=new Map(); h.set(ZXing.DecodeHintType.TRY_HARDER,true); h.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.EAN_13,ZXing.BarcodeFormat.EAN_8,ZXing.BarcodeFormat.CODE_128]); reader=new ZXing.MultiFormatReader(); reader.setHints(h); }catch(e){ close(); return false; } }
  const cv=document.createElement("canvas"), g=cv.getContext("2d",{willReadFrequently:true});
  const tick = async ()=>{
    if(stop) return;
    if(waitHint()){ if(scanMode()==="camera" && (!SCAN_VIEWS.includes(state.view) || document.querySelector(".modal"))){ close(); return; } setTimeout(tick, 150); return; }
    let txt=null;
    try{
      if(det){ const r=await det.detect(v); if(r[0]) txt=r[0].rawValue; }
      else if(v.videoWidth){
        const w=v.videoWidth, h=v.videoHeight, bw=w*0.9, bh=h*0.4;
        cv.width=Math.min(1280,Math.round(bw)); cv.height=Math.round(cv.width*bh/bw);
        g.drawImage(v,(w-bw)/2,(h-bh)/2,bw,bh,0,0,cv.width,cv.height);
        try{ txt=reader.decode(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.HTMLCanvasElementLuminanceSource(cv)))).getText(); }catch(e){}
      }
    }catch(e){}
    if(txt && scanMode()==="camera" && SCAN_VIEWS.includes(state.view)){ // câmera contínua: lê um código atrás do outro
      const now=Date.now();
      if(!(txt===lastTxt && now-lastAt<1300)){ lastTxt=txt; lastAt=now; handleScan(txt); try{ navigator.vibrate && navigator.vibrate(60); }catch(e){}
        armMsg = scanMsg.textContent || txt; armAt = Date.now()+NEXT_WAIT; frame.classList.add("wait");
        hint.textContent = armMsg; hint.className = "camhint "+(scanMsg.className.match(/good|bad|info/)?.[0]||"");
        setTimeout(()=>{ if(!stop && Date.now()<armAt) hint.textContent = armMsg+" · próximo código em instantes"; }, 400); }
      if(!SCAN_VIEWS.includes(state.view) || document.querySelector(".modal")){ close(); return; }
      setTimeout(tick, det ? 80 : 120); return;
    }
    if(txt){ close(); handleScan(txt); return; }
    if(scanMode()==="camera" && (!SCAN_VIEWS.includes(state.view) || document.querySelector(".modal"))){ close(); return; }
    setTimeout(tick, det ? 80 : 120);
  };
  tick();
  return true;
}

async function loadPhoto(file){

  return await new Promise((ok,ko)=>{ const u=URL.createObjectURL(file), im=new Image(); im.onload=()=>{ ok(im); setTimeout(()=>URL.revokeObjectURL(u),1000); }; im.onerror=()=>ko(new Error("imagem")); im.src=u; });
}
function cropCanvas(img, max, band, rot){
  const W=img.width||img.naturalWidth, H=img.height||img.naturalHeight;
  // recorte: imagem inteira ou faixa central (onde costuma estar o código)
  const sx = band ? W*0.05 : 0, sw = band ? W*0.9 : W, sy = band ? H*(0.5-band/2) : 0, sh = band ? H*band : H;
  const sc = Math.min(1, max/Math.max(sw,sh)), cw=Math.max(1,Math.round(sw*sc)), ch=Math.max(1,Math.round(sh*sc));
  const cv=document.createElement("canvas"); cv.width = rot? ch:cw; cv.height = rot? cw:ch;
  const g=cv.getContext("2d", {willReadFrequently:true});
  if(rot){ g.translate(ch,0); g.rotate(Math.PI/2); }
  g.drawImage(img, sx, sy, sw, sh, 0, 0, cw, ch);
  return cv;
}
async function decodePhoto(file){
  const img = await loadPhoto(file);
  if("BarcodeDetector" in window){ try{ const r = await new BarcodeDetector({formats:["ean_13","ean_8","code_128"]}).detect(img); if(r[0]) return {text:r[0].rawValue, via:"barcode"}; }catch(e){} }
  try{
    await ensureZXing();
    const hints=new Map(); hints.set(ZXing.DecodeHintType.TRY_HARDER,true);
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.EAN_13,ZXing.BarcodeFormat.EAN_8,ZXing.BarcodeFormat.CODE_128]);
    const reader=new ZXing.MultiFormatReader(); reader.setHints(hints);
    const tries=[[1800,.3,0],[2400,.25,0],[1280,0,0],[1800,.3,1],[2400,.25,1],[1280,.45,0],[900,0,0],[3000,.2,0]];
    for(const [max,band,rot] of tries){
      const cv=cropCanvas(img,max,band,rot);
      for(const Bin of [ZXing.HybridBinarizer, ZXing.GlobalHistogramBinarizer]){
        try{ const r=reader.decode(new ZXing.BinaryBitmap(new Bin(new ZXing.HTMLCanvasElementLuminanceSource(cv)))); if(r) return {text:r.getText(), via:"barcode"}; }catch(e){}
      }
      await new Promise(r=>setTimeout(r,0)); // não travar a tela
    }
  }catch(e){ console.warn(e); }
  throw new Error("não lido");
}

function mesaCard(o){

function scanMesa(v){

function locProduct(lc){ return Object.values(PRODUCTS).find(p=>p.loc===lc); }
/* Gaveta (GAV) aceita mais de um produto; BIN e COL só um */
const multiLoc = lc => parseCode(lc)?.t==="GAV";
function locProducts(lc){ return Object.values(PRODUCTS).filter(p=>p.loc===lc).sort((a,b)=>a.code.localeCompare(b.code)); }
const locBlocker = (lc, code) => { if(multiLoc(lc)) return null; const o=locProduct(lc); return o && o.code!==code ? o : null; }; // produto que impede ocupar o local
function eanState(e){ if(!e) return {t:"Sem EAN", c:"norm"}; if(/^\d{13}$/.test(e)) return validEan(e)?{t:"EAN-13 ok",c:"done"}:{t:"Dígito inválido",c:"bad"}; if(/^\d{8}$/.test(e)) return ean8ok(e)?{t:"EAN-8 ok",c:"done"}:{t:"Dígito inválido",c:"bad"}; return {t:"Formato inválido",c:"bad"}; }
function ean8ok(e){ let s=0; [...e.slice(0,7)].forEach((c,i)=>s+=(+c)*(i%2?1:3)); return (10-s%10)%10===+e[7]; }

/* ---- Localizar produto: bipe (EAN, código ou etiqueta do endereço) ou digite código/descrição; mostra o endereço no mapa 3D ou 2D ---- */
function lzMatches(q){ const Q=String(q||"").trim().toUpperCase(); if(!Q) return [];

  const rest=Object.values(PRODUCTS).filter(p=>!ex.includes(p) && (p.code.includes(Q) || (p.ean||"").includes(Q) || p.name.toUpperCase().includes(Q)));
  return [...ex, ...rest.sort((a,b)=>a.code.localeCompare(b.code))].slice(0,40); }
function lzSugHTML(q){ const ms=lzMatches(q).slice(0,8); // sugestões enquanto digita (escolhe um e some)

function lzTarget(){ const sel=state.lzSel; if(!sel) return null;

function lzResultHTML(){ // resultado do "localizar" (aba Produtos e EAN): produto, endereço, outros da gaveta e mapa 3D/2D

/* busca com sugestões (Produtos e EAN): escolher uma sugestão, bipar o EAN/código ou a etiqueta do endereço mostra onde está */
function bindLzSearch(q, sug, onType){
  const pick=c=>{ state.lzSel=c; state.prodQ=c; state.lzForce=true; resetPage("prod"); render(); requestAnimationFrame(()=>document.getElementById("lzRes")?.scrollIntoView({behavior:"smooth", block:"start"})); };
  const close=()=>{ sug.hidden=true; q.setAttribute("aria-expanded","false"); };
  const open=()=>{ const v=q.value.trim(); if(!v){ close(); return; } sug.innerHTML=lzSugHTML(v); sug.hidden=false; q.setAttribute("aria-expanded","true");
    sug.querySelectorAll("[data-lz]").forEach(b=>{ b.onmousedown=e=>e.preventDefault(); b.onclick=()=>pick(b.dataset.lz); }); };
  const move=d=>{ const os=[...sug.querySelectorAll("[data-lz]")]; if(!os.length) return; let i=os.findIndex(o=>o.classList.contains("hi")); os[i]?.classList.remove("hi"); i=(i+d+os.length)%os.length; os[i].classList.add("hi"); os[i].scrollIntoView({block:"nearest"}); };
  q.oninput=()=>onType(q.value);
  q.onblur=()=>setTimeout(close,150);
  q.onkeydown=e=>{
    if(e.key==="ArrowDown"||e.key==="ArrowUp"){ e.preventDefault(); if(sug.hidden) open(); else move(e.key==="ArrowDown"?1:-1); return; }
    if(e.key==="Escape"){ close(); return; }
    if(e.key!=="Enter") return; e.preventDefault(); const v=q.value.trim().toUpperCase(); if(!v) return;
    const lc=locFromShort(v) || (parseLoc(v) ? code(parseCode(v)) : null);
    if(lc && parseLoc(lc)){ state.prodQ=""; state.lzSel="@"+lc; state.lzForce=true; feedback(true); resetPage("prod"); render(); return; }
    const ex=Object.values(PRODUCTS).find(p=>p.code===v || (p.ean && p.ean===v)), hi=!sug.hidden && sug.querySelector(".lzopt.hi[data-lz]");
    if(ex){ feedback(true); pick(ex.code); return; }
    if(hi){ pick(hi.dataset.lz); return; }
    if(lzMatches(v).length) open(); else feedback(false); };
  return {open};
}

async function scanVinc(v){
  const V=state.vinc; if(!V) return;
  const x=parseCode(v);
  if(x){ const lc=code(x);
    if(!parseLoc(lc)){ feedback(false); return setMsg(`Endereço ${lc} não está cadastrado em Locais → Endereços.`,"bad"); }
    V.lc=lc; V.flash=null; feedback(true); if(!V.p){ render(); return; } return vincSave(); }
  const p=vincProd(v);
  if(!p){ feedback(false); return setMsg(`Código ${v} não é um produto cadastrado nem um endereço.`,"bad"); }
  if(p.loc && p.loc!==V.lc){ // produto já tem endereço: avisa em vermelho e só muda se o usuário pedir
    feedback(false); V.p=null; V.move=false; V.flash=null;
    const ok=await askModal({tone:"bad", danger:true, okText:"Mudar local", title:"Produto já tem endereço",
      text:`O produto <b>${esc(p.code)}</b> · ${esc(p.name)} já está vinculado ao endereço <b class="mono">${esc(p.loc)}</b>.<br><br>Para mudar, toque em <b>Mudar local</b> e bipe o novo endereço.`});
    if(!ok){ V.lc=null; render(); return; }
    V.p=p.code; V.move=true; if(V.lc) return vincSave(); render(); return; }
  V.p=p.code; V.move=false; V.flash=null; feedback(true); if(!V.lc){ render(); return; } return vincSave();
}
async function vincSave(){
  const V=state.vinc, p=PRODUCTS[V.p], lc=V.lc; if(!p||!lc) return render();
  if(p.loc===lc){ toast(`${p.code} já está no endereço ${lc}`); V.p=null; V.lc=null; return render(); }
  const occ=locBlocker(lc, p.code);
  if(occ){ render();
    const ok=await askModal({title:`Endereço ${lc} já tem produto`, okText:"Trocar",
      text:`O endereço <b>${esc(lc)}</b> está com o produto <b>${esc(occ.code)}</b> · ${esc(occ.name)}.<br><br>Trocar para <b>${esc(p.code)}</b> · ${esc(p.name)}? O produto ${esc(occ.code)} fica sem endereço.`});
    if(!ok){ V.lc=null; render(); return setMsg(`Produto ${p.code}: bipe outro endereço`,"info"); } }
  const from=p.loc||"";
  if(occ) saveProduct({...occ, loc:""});
  saveProduct({...p, loc:lc});
  V.log.unshift({code:p.code, lc, from, out: occ ? occ.code : "", junto: multiLoc(lc) ? locProducts(lc).length : 0}); V.log=V.log.slice(0,30);
  V.p=null; V.lc=null; V.move=false; V.flash={t:`${p.code} ${from?"mudou para":"vinculado ao"} endereço ${lc}. Bipe o próximo produto.`, k:"good", at:Date.now()}; render(); feedback(true);
  okPop(from?"Local alterado":"Produto vinculado", `${p.code} → ${lc}`);
}
/* aviso verde de sucesso no meio da tela, some sozinho em 1 segundo */
function okPop(title, sub=""){

  const el=document.createElement("div"); el.className="okpop"; el.setAttribute("role","status");
  el.innerHTML=`<div class="okpop-box"><svg class="okpop-ic" viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="24"/><path d="M15 27l7 7 15-16"/></svg><b>${esc(title)}</b>${sub?`<span>${esc(sub)}</span>`:""}</div>`;

function vincUndo(){
  const V=state.vinc, x=V?.log[0]; if(!x || x.undone) return;

function blockPreview(f){
  const b = {r:ruaKey(f.r), l:String(f.l).toUpperCase(), t:f.t, n1:+f.n1, n2:+f.n2, c1:String(f.c1||"").toUpperCase(), c2:String(f.c2||"").toUpperCase()};
  if(f.t!=="GAV" && (f.base==="gav" || (f.base==="col" && f.t==="BIN"))){ b.base=f.base; if(f.base==="gav"){ b.g1=String(f.g1||"A").toUpperCase(); b.g2=String(f.g2||f.g1||"A").toUpperCase();
    if(!/^[A-Z]{1,2}$/.test(b.g1)||!/^[A-Z]{1,2}$/.test(b.g2)||colIdx(b.g2)<colIdx(b.g1)) return {err:"Informe os gaveteiros de baixo (letras, ex.: D até E)."}; } }
  if(b.r===null) return {err:"Informe a rua: número (1 a 99) ou letra (A, B)."};
  if(!(b.n1>=1 && b.n2>=b.n1 && b.n2<=99)) return {err:"Faixa de níveis inválida."};
  if(!/^[A-Z]{1,2}$/.test(b.c1) || !/^[A-Z]{1,2}$/.test(b.c2) || colIdx(b.c2)<colIdx(b.c1)) return {err:"Faixa de colunas inválida (letras, ex.: A até M)."};
  const locs = blockLocs(b);
  if(locs.length>600) return {err:`São ${locs.length} locais de uma vez. Divida em blocos menores (até 600).`};
  const clash = allLocs().map(parseCode).find(x=>x.r===b.r && x.l===b.l && x.t===b.t && x.n>=b.n1 && x.n<=b.n2 && x.ci>=colIdx(b.c1) && x.ci<=colIdx(b.c2));
  if(clash) return {err:`Essa faixa já tem locais cadastrados (ex.: ${code(clash)}).`};
  return {b, count:locs.length, first:locs[0], last:locs[locs.length-1]};
}

  if(p.loc){ if(!parseCode(p.loc)) return `Local ${p.loc} inválido. Use Rua-Lado-Tipo-Nível.Coluna, ex.: R1-LB-BIN-8.M.`;
    if(!parseLoc(p.loc)) return `O local ${p.loc} não está cadastrado. Crie a estrutura em Locais → Endereços.`;

  return "";
}

/* ---- Importação de produtos por CSV ---- */
function parseCSV(text){
  text = text.replace(/^﻿/, "");
  const first = text.split(/\r?\n/)[0] || "";
  const sep = (first.match(/;/g)||[]).length >= (first.match(/,/g)||[]).length ? ";" : ((first.match(/\t/g)||[]).length > (first.match(/,/g)||[]).length ? "\t" : ",");
  const rows=[]; let row=[], cell="", q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else q=false; } else cell+=ch; continue; }
    if(ch==='"') q=true;
    else if(ch===sep){ row.push(cell); cell=""; }
    else if(ch==="\n"||ch==="\r"){ if(ch==="\r" && text[i+1]==="\n") i++; row.push(cell); rows.push(row); row=[]; cell=""; }
    else cell+=ch;
  }
  if(cell!=="" || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.some(c=>String(c).trim()!==""));

const normH = h => String(h||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z]/g,"");
const CSV_COLS = {
  code:["codigo","cod","codproduto","codigoproduto","sku","referencia","ref"],
  name:["descricao","produto","nome","descricaoproduto","desc"],
  ean:["ean","codigodebarras","codbarras","gtin","ean13","barras"],
  loc:["local","localizacao","endereco","posicao","locacao"],
};
async function readCsvFile(file){
  const buf = await file.arrayBuffer();
  try{ return new TextDecoder("utf-8",{fatal:true}).decode(buf); }catch(e){ return new TextDecoder("windows-1252").decode(buf); }
}
function analyzeCsv(rows, update){
  if(rows.length<2) return {err:"O arquivo está vazio ou só tem o cabeçalho."};
  const head=rows[0].map(normH), idx={};
  for(const [k,names] of Object.entries(CSV_COLS)){ const i=head.findIndex(h=>names.includes(h)); if(i>=0) idx[k]=i; }
  if(idx.code===undefined) return {err:"Não encontrei a coluna de código. Use o modelo: codigo; descricao; ean; local."};
  const seenCode=new Set(), eanInFile={}, locInFile={}, out=[];
  rows.slice(1).forEach((r,n)=>{
    const g=k=> idx[k]===undefined ? "" : String(r[idx[k]]??"").trim();
    const line=n+2, code=g("code").toUpperCase(), name=g("name").toUpperCase(), ean=g("ean").replace(/\D/g,""), locRaw=g("loc");
    const loc = locRaw ? normLoc(locRaw) : "";
    const ex = PRODUCTS[code], msgs=[]; let status = ex ? "upd" : "new";
    if(!code){ out.push({line, status:"err", msgs:["sem código"]}); return; }
    if(!/^[A-Z0-9._-]{1,40}$/.test(code)){ out.push({line, code, status:"err", msgs:["código com caracteres inválidos"]}); return; }
    if(seenCode.has(code)){ out.push({line, code, status:"err", msgs:["código repetido no arquivo"]}); return; }
    seenCode.add(code);
    if(ex && !update){ out.push({line, code, name:ex.name, status:"skip", msgs:["já cadastrado"]}); return; }
    if(!ex && !name){ out.push({line, code, status:"err", msgs:["sem descrição"]}); return; }
    const p = {code, name: name || ex?.name || "", ean: ex?.ean || "", loc: ex?.loc || ""};
    if(ean){
      const st=eanState(ean), dup=Object.values(PRODUCTS).find(x=>x.code!==code && x.ean===ean) || (eanInFile[ean] && eanInFile[ean]!==code);
      if(st.c==="bad") msgs.push(`EAN ${ean} inválido (ignorado)`);
      else if(dup) msgs.push(`EAN ${ean} já usado em outro produto (ignorado)`);
      else { p.ean=ean; eanInFile[ean]=code; }
    }
    if(loc){
      const occ = locBlocker(loc, code), occFile = multiLoc(loc) ? null : locInFile[loc];
      if(!parseCode(loc)) msgs.push(`local "${locRaw}" inválido (ignorado)`);
      else if(!parseLoc(loc)) msgs.push(`local ${loc} não cadastrado em Endereços (ignorado)`);
      else if(occ || (occFile && occFile!==code)) msgs.push(`local ${loc} já ocupado (ignorado)`);
      else { p.loc=loc; locInFile[loc]=code; }
    }
    if(ex && p.name===ex.name && p.ean===(ex.ean||"") && p.loc===(ex.loc||"")) status="same";
    out.push({line, code, name:p.name, ean:p.ean, loc:p.loc, p, status, msgs});
  });
  const c = s => out.filter(x=>x.status===s).length;
  return {rows:out, cols:Object.keys(idx), n:{new:c("new"), upd:c("upd"), same:c("same"), skip:c("skip"), err:c("err"), warn:out.filter(x=>x.msgs?.length && x.p).length}};
}

let jspdfReady=null, downloadsCap;
function loadJsPdf(){ if(jspdfReady) return jspdfReady;
  jspdfReady=new Promise((ok,ko)=>{ const s=document.createElement("script"); s.src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"; s.onload=ok; s.onerror=()=>{ jspdfReady=null; ko(new Error("lib")); }; document.head.appendChild(s); });
  return jspdfReady; }
function bcPng(l){ const c=document.createElement("canvas"); JsBarcode(c, l.value, {format:l.fmt, width:3, height:110, margin:0, displayValue:/^EAN/.test(l.fmt), fontSize:30, background:"#FFFFFF", lineColor:"#000000"}); return {url:c.toDataURL("image/png"), r:c.height/c.width}; }
async function makePdf(labels, fmt, filename){
  if(!labels.length) return;
  toast("Gerando PDF…");
  try{
    if(downloadsCap===undefined) downloadsCap = window.claude?.use ? await window.claude.use("downloads") : null;
    if(!downloadsCap){ toast("Não foi possível baixar o arquivo neste navegador."); return; }
    await Promise.all([loadJsPdf(), ensureBarcode()]); const { jsPDF } = window.jspdf;
    const fit = (doc, txt, size, maxW) => { let s=size; doc.setFontSize(s); while(s>6 && doc.getTextWidth(txt)>maxW){ s-=.5; doc.setFontSize(s); } return s; };
    let doc;
    if(fmt==="solo"){ // 4 × 14 etiquetas de 50 × 20 mm, centralizadas na A4, com linhas de corte
      doc = new jsPDF({unit:"mm", format:"a4"}); const per=SOLO.cols*SOLO.rows, x0=(210-SOLO.cols*SOLO.w)/2, y0=(297-SOLO.rows*SOLO.h)/2;
      labels.forEach((l,i)=>{ if(i && i%per===0) doc.addPage();
        const k=i%per, x=x0+(k%SOLO.cols)*SOLO.w, y=y0+Math.floor(k/SOLO.cols)*SOLO.h;
        const c=document.createElement("canvas"); JsBarcode(c, l.value, {format:"CODE128", width:3, height:110, margin:0, displayValue:false, flat:true, background:"#FFFFFF", lineColor:"#000000"});
        drawLocSolo(doc, x, y, l, c.toDataURL("image/png"));
        doc.setDrawColor(170); doc.setLineWidth(.15); doc.setLineDashPattern([1.2,1.2],0); doc.rect(x, y, SOLO.w, SOLO.h); doc.setLineDashPattern([],0); });
    } else if(fmt==="loc3" || fmt==="loca4"){
      const a4 = fmt==="loca4", per = a4 ? 10 : 3;
      doc = a4 ? new jsPDF({unit:"mm", format:"a4"}) : new jsPDF({unit:"mm", format:[100,150], orientation:"portrait"});
      labels.forEach((l,i)=>{
        if(i && i%per===0) a4 ? doc.addPage() : doc.addPage([100,150],"portrait");
        const k=i%per, x = a4 ? 5+(k%2)*100 : 0, y = a4 ? 23.5+Math.floor(k/2)*50 : k*50;
        let bc=null; if(l.value){ const c=document.createElement("canvas"); JsBarcode(c, l.value, {format:l.bcf||"CODE128", width:3, height:110, margin:0, displayValue:false, flat:true, background:"#FFFFFF", lineColor:"#000000"}); bc=c.toDataURL("image/png"); }
        drawLocLabel(doc, x, y, l, bc);
        // linhas de corte
        doc.setDrawColor(170); doc.setLineWidth(.15); doc.setLineDashPattern([1.5,1.5],0);
        if(a4) doc.rect(x, y, 100, 50); else if(k<2 && i<labels.length-1) doc.line(0, y+50, 100, y+50);
        doc.setLineDashPattern([],0);
      });
    } else if(fmt==="placa"){ // A4 deitada, uma mesa por folha
      doc=new jsPDF({unit:"mm", format:"a4", orientation:"landscape"});
      labels.forEach((l,i)=>{ if(i) doc.addPage("a4","landscape");
        doc.setDrawColor(0); doc.setLineWidth(1.2); doc.rect(8, 8, 281, 194);
        doc.setFont("helvetica","bold"); fit(doc,l.big,110,260); doc.text(l.big, 148.5, 62, {align:"center"});
        doc.setFont("helvetica","normal"); fit(doc,l.small,26,250); doc.text(l.small, 148.5, 86, {align:"center"});
        const b=bcPng(l), bw=200, bh=Math.min(70, bw*b.r); doc.addImage(b.url,"PNG",148.5-bw/2,100,bw,bh);
        doc.setFont("courier","bold"); doc.setFontSize(22); doc.text(l.value, 148.5, 100+bh+12, {align:"center"});
        doc.setFont("helvetica","normal"); doc.setFontSize(12); doc.text("Picking Serena · bipe este código na separação", 148.5, 196, {align:"center"}); });
    } else if(fmt==="a4"){
      doc=new jsPDF({unit:"mm", format:"a4"}); const W=70, H=297/8;
      labels.forEach((l,i)=>{ if(i && i%24===0) doc.addPage(); const k=i%24, x=(k%3)*W, y=Math.floor(k/3)*H;
        doc.setFont("helvetica","bold"); fit(doc,l.big,15,W-8); doc.text(l.big, x+4, y+8);
        doc.setFont("helvetica","normal"); fit(doc,l.small,7,W-8); doc.text(l.small, x+4, y+12);
        if(l.sub){ fit(doc,l.sub,6,W-8); doc.text(l.sub, x+4, y+15.5); }
        const b=bcPng(l), bw=W-8, bh=Math.min(17, bw*b.r); doc.addImage(b.url,"PNG",x+4,y+H-bh-3,bw,bh); });
    } else {
      doc=new jsPDF({unit:"mm", format:[100,50], orientation:"landscape"});
      labels.forEach((l,i)=>{ if(i) doc.addPage([100,50],"landscape");
        doc.setFont("helvetica","bold"); fit(doc,l.big,24,90); doc.text(l.big, 5, 11);
        doc.setFont("helvetica","normal"); fit(doc,l.small,9,90); doc.text(l.small, 5, 16.5);
        if(l.sub){ fit(doc,l.sub,8,90); doc.text(l.sub, 5, 21); }
        const b=bcPng(l), bh=Math.min(22, 90*b.r); doc.addImage(b.url,"PNG",5,47-bh,90,bh); });
    }
    await downloadsCap.save({filename, data:doc.output("arraybuffer")});
    toast(`PDF com ${labels.length} etiqueta(s) salvo`);
  }catch(e){
    if(e?.code==="declined") return toast("Download cancelado.");
    console.warn(e); toast(e?.message==="lib" ? "Não foi possível carregar o gerador de PDF. Verifique a conexão." : "Não foi possível gerar o PDF.");
  }
}

/* ================== Usuários e níveis de acesso ================== */
const PERMS = {
  comercial:"Integrar pré-vendas e registrar envios",
  coleta:"Separar pedidos (coleta no celular)",
  mesa:"Mesa de expedição e colmeias",
  estoque:"Endereços, EAN e etiquetas",
  compras:"Encomendas aos fornecedores",
  devolver:"Retirar peças da colmeia e devolver ao estoque",
  receber:"Recebimento de mercadoria (notas fiscais)",
  colmeia:"Cadastrar pedido na colmeia",
  usuarios:"Gerenciar usuários e acessos",
};
const ROLES = {
  admin:     {t:"Administrador", d:"Acesso total, inclusive gestão de usuários", p:["comercial","coleta","mesa","estoque","compras","devolver","receber","colmeia","usuarios"]},
  supervisor:{t:"Supervisor",    d:"Todas as operações, sem gestão de usuários", p:["comercial","coleta","mesa","estoque","compras","devolver","receber","colmeia"]},
  comercial: {t:"Comercial",     d:"Importa pré-vendas, define o tipo de envio e registra envios", p:["comercial"]},
  compras:   {t:"Compras",       d:"Encomenda aos fornecedores os itens vendidos sob encomenda e dá baixa na chegada", p:["compras","devolver","receber"]},
  financeiro:{t:"Financeiro",    d:"Cadastra pedidos na colmeia e consulta as colmeias", p:["colmeia"]},
  estoque:   {t:"Estoque",       d:"Cadastra endereços e EANs, imprime etiquetas e recebe mercadoria", p:["estoque","receber"]},
  separador: {t:"Separador",     d:"Faz a coleta dos pedidos no celular", p:["coleta"]},
  painel:    {t:"Painel TV",     d:"Só exibe o painel da fila de separação na TV", p:[]},
  conferente:{t:"Conferente",    d:"Recebe as bandejas na mesa de expedição e guarda nas colmeias", p:["mesa"]},
};
const SECTOR_PERM = { chamados:["usuarios"], comercial:["comercial"], expedicao:["coleta","mesa"], colmeias:["coleta","mesa","compras","estoque","colmeia"], /* o Comercial vê as colmeias na lateral da própria tela */ compras:["compras"], recebimento:["receber"], estoque:["estoque"], usuarios:["usuarios"] };
let USERS = {}, usersCol = null, userCap = null, ME = {id:null, name:"", isOwner:false, avatarUrl:""}, authReady = !window.claude?.use;

/* Um usuário pode ter mais de um nível: "role" é o principal (o mais alto) e "roles" traz todos */
const ROLE_ORDER = ["admin","supervisor","compras","financeiro","comercial","estoque","conferente","separador","painel"];
const sortRoles = l => [...new Set(l)].filter(r=>ROLES[r]).sort((a,b)=>ROLE_ORDER.indexOf(a)-ROLE_ORDER.indexOf(b));
const userRoles = u => u ? sortRoles([u.role, ...(Array.isArray(u.roles)?u.roles:[])].filter(Boolean)) : [];
const rolesTxt = l => l.map(r=>ROLES[r]?.t||r).join(" + ");
function myRoles(){
  if(state.viewAs) return [state.viewAs];
  if(!db) return ["admin"];                // modo local (sem conta): demonstração completa
  if(ME.isOwner) return ["admin"];          // o proprietário da página é sempre administrador
  const u = ME.id && USERS[ME.id];
  return u && u.active!==false ? userRoles(u) : [];
}
function myRole(){ return myRoles()[0] || null; }
const hasRole = (...l) => myRoles().some(r=>l.includes(r));
const can = p => myRoles().some(r=>ROLES[r]?.p.includes(p));
const canSector = s => (SECTOR_PERM[s]||[]).some(can);
/* E-commerce: Administrador sempre; demais só com a opção "E-commerce" ligada em Usuários */
function canEco(){ if(!db) return true; if(state.viewAs) return false; if(myRole()==="admin") return true; return !!(ME.id && USERS[ME.id]?.ecommerce); }
/* Venda Consultiva: idem, com a opção "Venda Consultiva" em Usuários */
function canCons(){ if(!db) return true; if(state.viewAs) return true; if(myRole()==="admin") return true; return !!(ME.id && USERS[ME.id]?.consultiva); }
const isEco = o => o.canal==="ecommerce";
const isManual = o => isEco(o) && Number(o.mzOrigem)===3; // Magazord: origem 1 = site, 2 = marketplace, 3 = pedido manual (painel)
const manualTag = o => isManual(o) ? `<span class="chip manualc">Manual</span>` : "";
// Urgência: "Cliente está na loja" (vermelho) primeiro, depois "Retira na Loja" (verde)
const naLojaNow = o => !!o.naLoja && !o.fase2; // na 2ª etapa (encomenda chegou) o cliente já não está esperando na loja: vira "retira"
const urgKind = o => naLojaNow(o) ? "loja" : (o.retira || o.naLoja) ? "retira" : "";
const urgRank = o => naLojaNow(o) ? 2 : (o.retira || o.naLoja) ? 1 : 0;
const urgText = o => naLojaNow(o) ? "URGENTE · CLIENTE NA LOJA" : "URGENTE · RETIRA NA LOJA";
const urgBar = (o, st="") => urgKind(o) ? `<div class="retirabar ${naLojaNow(o)?"":"rb-green"}"${st?` style="${st}"`:""}>${urgText(o)}</div>` : "";
const byUrg = (a,b) => (urgRank(b) - urgRank(a)) || (a.createdAt||0)-(b.createdAt||0);
const ecoOk = o => isEco(o) ? canEco() : canCons();
/* Pedido passado pelo Administrador para um separador: só essa pessoa (e admin/supervisor) pega */
const sepOf = o => o.status==="separando" && o.startedBy ? o.startedBy : (o.assignTo||"");
const notMine = o => !!o.assignTo && o.assignTo!==ME.id && !hasRole("admin","supervisor");
// Colmeias fica ao lado de Separação; para quem não separa, vem depois do setor principal (e nunca é a tela inicial)
function allowedSectors(){ const sep=canSector("expedicao"); return (sep ? ["comercial","expedicao","colmeias","compras","recebimento","estoque","chamados","usuarios"] : ["comercial","compras","recebimento","estoque","colmeias","chamados","usuarios"]).filter(canSector); }

/* ---- Transportadora da venda consultiva: lida do campo "Observações" da pré-venda ---- */
const CARRIER_ALIAS = [["AZUL","Azul Cargo"],["DAYTONA","Daytona Express"],["DISK TENHA","Disk Tenha"],["JADLOG","Jadlog"],["CORREIOS","Correios"],["SEDEX","Correios"],
  ["BRASPRESS","Braspress"],["JAMEF","Jamef"],["RODONAVES","Rodonaves"],["PATRUS","Patrus"],["TOTAL EXPRESS","Total Express"],["TNT","TNT"],["ATUAL CARGAS","Atual Cargas"]];
const normTx = t => String(t||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase().replace(/[^A-Z0-9]+/g," ").trim();
function carrierFromObs(obs){
  const t=" "+normTx(obs)+" "; if(!t.trim()) return "";
  const known=[...new Set([...Object.keys(TRANSP), ...ORDERS.map(o=>o.transportadora).filter(Boolean)])].sort((a,b)=>b.length-a.length);
  for(const n of known){ const k=normTx(n); if(k && t.includes(" "+k+" ")) return n; }
  for(const [a,n] of CARRIER_ALIAS){ if(t.includes(" "+a+" ")) return known.find(k=>normTx(k)===normTx(n)) || n; }
  const m=String(obs).match(/^\s*([^\-–(]{3,30}?)\s+[-–]\s+(DE\s+)?\d/i);  // "TRANSPORTADORA - DE 5 À 6 DIAS"
  return m ? m[1].trim().toLowerCase().replace(/(^|\s)\S/g,c=>c.toUpperCase()) : "";
}
const transpOf = o => o.transportadora!=null ? o.transportadora : (isEco(o) ? "" : carrierFromObs(o.obs));

function imgToLogo(file){ return new Promise((ok,ko)=>{ const r=new FileReader(); r.onerror=()=>ko(new Error("arquivo"));
  r.onload=()=>{ const im=new Image(); im.onerror=()=>ko(new Error("imagem inválida")); im.onload=()=>{

    c.getContext("2d").drawImage(im,0,0,c.width,c.height); let u=c.toDataURL("image/png"); if(u.length>80000) u=c.toDataURL("image/webp",.85); ok(u); }; im.src=r.result; };
  r.readAsDataURL(file); }); }

function bindMz(){
  const f=document.getElementById("mzForm"); if(!f) return;
  const run=async(save)=>{
    // lê os campos ANTES de redesenhar a tela
    const form={ url:document.getElementById("mzUrl").value.trim(), token:document.getElementById("mzToken").value.trim(), senha:document.getElementById("mzSenha").value };
    MZ.form={url:form.url, token:form.token};
    if(save && !form.url){ MZ.err="Informe o endereço do painel Magazord."; render(); return; }
    if(save && !MZ.status?.configured && (!form.token || !form.senha)){ MZ.err="Informe o token e a senha da API."; render(); return; }
    MZ.busy=true; MZ.err=""; MZ.result=null; render();
    try{
      if(save){ await window.psMagazord({action:"config", ...form}); MZ.form=null; }
      MZ.status=await window.psMagazord({action:"status"});
      const r=await window.psMagazord({action:"test"}); if(r.ok) MZ.result=r; else MZ.err=r.error||"Falha no teste";
    }catch(e){ MZ.err=e.message||String(e); }
    MZ.busy=false; render(); };
  f.onsubmit=e=>{ e.preventDefault(); run(true); };
  const t=document.getElementById("mzTest"); if(t) t.onclick=()=>run(false);
  const rs=document.getElementById("mzReset"); if(rs) rs.onclick=async()=>{
    const ok=await askModal({title:"Apagar e reimportar?", okText:"Apagar e reimportar", danger:true,
      text:"Todos os pedidos do e-commerce no Picking Serena são apagados, inclusive os em separação, e entram de novo só os pedidos feitos nas <b>últimas 24 horas</b>. Daí em diante a importação automática nunca busca nada anterior a esse ponto. Nada muda na Magazord."});
    if(!ok) return; MZ.busy=true; MZ.err=""; render();
    try{ const r=await window.psMagazord({action:"reset", horas:24}); MZSYNC=r; toast(`${r.removed} apagado(s) · ${r.imported} pedido(s) das últimas 24 h importado(s)`); }catch(e){ MZ.err=e.message||String(e); }

   Supabase (bucket público "tts", pasta tv/): "Atenção! Pedido" + um arquivo por dígito + "Cliente aguarda na loja para retirada."
   Toca pelo Web Audio, então funciona mesmo em TV sem voz do navegador. Se não carregar, usa a voz do navegador (tvSay). */
const TV_TTS = ((window.PS_CONFIG||{}).SUPABASE_URL || "https://dtrfujxhfcyefbipkcwz.supabase.co").replace(/\/$/,"") + "/storage/v1/object/public/tts/tv/";

function tvTrim(b){ // tira o silêncio do começo e do fim de cada trecho
  const d=b.getChannelData(0), n=d.length; let pk=0; for(let i=0;i<n;i++){ const v=Math.abs(d[i]); if(v>pk) pk=v; }
  const th=Math.max(.008, pk*.035); let s=0, e=n-1; while(s<n && Math.abs(d[s])<th) s++; while(e>s && Math.abs(d[e])<th) e--;
  const pad=Math.round(b.sampleRate*.03); s=Math.max(0,s-pad); e=Math.min(n-1,e+pad*2);
  if(e-s<b.sampleRate*.05) return b;
  const out=audioCtx.createBuffer(b.numberOfChannels, e-s+1, b.sampleRate);
  for(let c=0;c<b.numberOfChannels;c++) out.getChannelData(c).set(b.getChannelData(c).subarray(s,e+1));
  return out;
}
function tvVoiceLoad(){
  if(TVV.buf) return Promise.resolve(true);
  if(TVV.p) return TVV.p;
  try{ audioCtx ||= new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return Promise.resolve(false); }
  const names=["atencao","aguarda","ligado","d0","d1","d2","d3","d4","d5","d6","d7","d8","d9"];
  TVV.p = Promise.all(names.map(n=>fetch(TV_TTS+n+".mp3").then(r=>{ if(!r.ok) throw new Error(n); return r.arrayBuffer(); })
      .then(a=>new Promise((ok,ko)=>audioCtx.decodeAudioData(a,ok,ko))).then(b=>[n,tvTrim(b)])))
    .then(l=>{ TVV.buf=Object.fromEntries(l); return true; })

  parts.forEach(([n,gap])=>{ const b=TVV.buf&&TVV.buf[n]; if(!b) return; const s=c.createBufferSource(); s.buffer=b; s.connect(c.destination); s.start(t); t+=b.duration+(gap||0); });

  if(!canSector(state.sector) && !(state.view==="hvout" && state.hvOut && canHvOut())){ const al=allowedSectors(); state.sector = al.includes("expedicao") && innerWidth<900 ? "expedicao" : (al.find(x=>x!=="colmeias")||al[0]); state.view="orders"; }

    if(["pick","tray","done","tomesa","adjust"].includes(state.view) && !can("coleta")) state.view="orders";
    if(state.view==="store" && !can("mesa") && !can("coleta")) state.view="orders";
    if(state.view==="mesa" && !can("mesa")) state.view="orders";
    if(state.view==="orders" && !can("coleta") && can("mesa") && !state.mesaListOk) state.view="mesa";

  if(state.hvLocPending && ORDERS.length){ const o=ORDERS.find(x=>x.id===state.hvLocPending); state.hvLocPending=null; try{ history.replaceState(null,"",location.pathname+"#colmeias"); }catch(e){}

    else if(o) toast(o.colmeia ? `Pedido #${o.num} já está na colmeia ${o.colmeia.slice(3)}` : `Pedido #${o.num} não está aguardando colmeia`); }
  if(state.view==="hvloc" && (!state.hvLoc || !canHiveStore())) state.view="orders";
  if(state.view==="hvmove" && (!state.hvMove || !canHiveMove())) state.view="orders";
  if(state.view==="unstore" && (state.sector!=="compras" || !can("devolver") || !state.us)) state.view="orders";
  if(state.view==="vinc" && state.sector!=="estoque") state.view="orders";
  const scanning = ((state.sector==="expedicao" || ["unstore","hvout","hvloc","hvmove","vinc"].includes(state.view)) && SCAN_VIEWS.includes(state.view)) || (state.sector==="recebimento" && state.view==="orders") || (onHiveTab() && !isDesk());
  scanbar.hidden = !scanning;
  app.classList.toggle("picking", scanning);
  if(scanning && onHiveTab() && !document.querySelector(".modal")) setMsg("Bipe uma colmeia para ver o pedido que está nela","info");
  // Administrador: Separação e Separados na largura do computador
  const adminWide = myRole()==="admin" && state.sector==="expedicao" && state.view==="orders" && ["fila","historico"].includes(state.sepTab||"fila");
  app.classList.toggle("wide", (state.sector!=="expedicao" && !(state.sector==="colmeias" && state.view==="hvout")) || state.view==="labels" || adminWide);
  app.classList.toggle("sepwide", adminWide);

  if(state.sector==="estoque") return state.view==="vinc" ? renderVinc() : renderEstoque();
  if(state.usPending && can("devolver")){ const o=ORDERS.find(x=>x.id===state.usPending);
    if(o){ state.usPending=null; try{ history.replaceState(null,"",location.pathname+"#compras"); }catch(e){}
      if(o.status==="na_colmeia"){ state.sector="compras"; state.us=newUs(o.id); state.view="unstore"; }

  if(state.sector==="compras") return state.view==="unstore" ? renderUnstore() : renderCompras();
  if(state.sector==="recebimento") return renderReceb();
  if(state.sector==="usuarios") return renderUsuarios();
  if(state.sector==="chamados") return window.psLucas ? renderChamados() : (state.sector="usuarios", renderUsuarios());
  if(state.view==="hvout") return renderHvOut();
  if(state.view==="hvloc" || state.view==="hvmove") return renderHvPlace();
  if(state.view==="adjust") return renderAdjust();
  if(state.view==="tray") return renderTray();
  if(state.view==="mesa") return renderMesa();
  if(state.view==="pick") return renderPick();
  if(state.view==="store") return renderStore();
  if(state.view==="done") return renderDone();
  if(state.view==="tomesa") return renderToMesa();
  if(state.view==="trays") return renderTrays();

/* ================== Ajuste de pré-venda ==================
   O Comercial importa de novo uma pré-venda que já está no sistema (mudou quantidade, modelo, item novo ou removido).
   O sistema compara as versões. Se nada foi separado ainda, só atualiza. Se já houve separação, cria uma tarefa de
   ajuste para o separador (no topo da fila): achar o pedido, retirar peças (devolvendo ao endereço do estoque) e
   coletar peças novas. Se mexer em item de encomenda, Compras é avisado. Pedido que já saiu não pode ser ajustado. */
const sumBy = (list, f) => { const m={}; list.forEach(x=>{ m[x.code]=(m[x.code]||0)+f(x); }); return m; };
// pedido que já saiu (enviado, retirado, entregue na loja ou 1º envio feito): não aceita ajuste
function adjBlocked(o){
  if(!o) return "";
  const quando = t => t ? " em "+new Date(t).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}) : "";
  if(o.status==="enviado") return `O pedido #${o.num} já saiu (${o.saida==="retirou"?"retirado pelo cliente":"enviado"}${quando(o.sentAt)}). Não dá para ajustar pelo sistema: combine o ajuste direto com a expedição.`;
  if(o.status==="enc_pendente") return `O 1º envio do pedido #${o.num} já saiu${quando(o.sentAt1)}. Não dá para ajustar pelo sistema: combine com a expedição e avise Compras sobre a encomenda.`;
  if(o.status==="pronto_envio" && o.naLoja && !o.colmeia) return `O pedido #${o.num} já foi entregue ao cliente na loja. Não dá para ajustar pelo sistema.`;

const adjPicked = o => !!o && (["separando","na_mesa","na_colmeia","pronto_envio","lavagem"].includes(o.status) || (o.res||[]).some(r=>r && r.got>0));
// diferenças entre a versão anterior e a nova (por código do produto)
function adjChanges(oldItems, newItems){
  const a=sumBy(oldItems, x=>x.qty), b=sumBy(newItems, x=>x.qty), names={};
  [...oldItems, ...newItems].forEach(x=>names[x.code] ||= x.name);
  const ch=[];
  [...new Set([...Object.keys(a), ...Object.keys(b)])].forEach(c=>{ const f=a[c]||0, t=b[c]||0; if(f===t) return;
    ch.push({code:c, name:names[c]||c, from:f, to:t, type: !f ? "novo" : !t ? "removido" : "qtd"}); });
  // troca de modelo: saiu um item e entrou outro
  const rem=ch.filter(x=>x.type==="removido"), add=ch.filter(x=>x.type==="novo");
  if(rem.length && add.length) rem.forEach((r,k)=>{ const n=add[k]; if(n){ r.troca=n.code; n.troca=r.code; } });
  return ch;
}
const adjChangeTxt = x => x.type==="qtd" ? `${x.code} · ${x.name}: ${x.from} → ${x.to} pç (${x.to>x.from?"+":""}${x.to-x.from})`
  : x.type==="novo" ? `${x.troca?"Troca de modelo · entra":"Item novo"}: ${x.code} · ${x.name} (${x.to} pç)` : `${x.troca?"Troca de modelo · sai":"Item removido"}: ${x.code} · ${x.name} (${x.from} pç)`;
// mudanças em itens sob encomenda (para avisar Compras)
function adjEncChanges(prev, items){
  const a=sumBy(prev.items||[], x=>x.qtyEnc||0), b=sumBy(items, x=>x.qtyEnc||0), qa=sumBy(prev.items||[], x=>x.qty), qb=sumBy(items, x=>x.qty), names={};

  const out=[]; [...new Set([...Object.keys(a), ...Object.keys(b)])].forEach(c=>{ if(!(a[c]>0) && !(b[c]>0)) return; if(a[c]===b[c] && qa[c]===qb[c]) return;
    out.push({code:c, name:names[c]||c, from:a[c]||0, to:b[c]||0, qtyFrom:qa[c]||0, qtyTo:qb[c]||0}); });

// onde o pedido está agora (para o separador achar)

// prévia no Comercial: o que muda e o que o separador vai fazer
function adjPreviewHTML(d){

      : Math.min(it.qty, it.qtyEnc||0);

  const now=Date.now(), ch=adjChanges(prev.items||[], items), encCh=adjEncChanges(prev, items);
  const head={ date:d.date, time:d.time, clientCode:d.clientCode, client:d.client, city:d.city, seller:d.seller, obs:d.obs, total:d.total, mode, modeCom: toDec ? "temenc" : keepMode ? (prev.modeCom||prev.mode) : d.mode,
    retira: !!(d.retira||d.naLoja), naLoja: !!d.naLoja, transportadora: (d.transportadora ?? carrierFromObs(d.obs)) || "" };
  const ev = "Pré-venda ajustada pelo Comercial" + (ch.length ? " · " + ch.map(adjChangeTxt).join(" · ") : " (sem mudança de itens)");
  const hist=[...(prev.hist||[]), {t:now, by:ME.id||"", ev}];
  const anyDec = toDec && items.some(it=>it.qtyDec>0);
  if(anyDec) head.decAdj = {at:now, by:ME.id||"", changes:ch};
  const adjCompras = anyDec ? (prev.adjCompras||null) : encCh.length || (hasEnc(prev) && ch.length) ? {at:now, by:ME.id||"", changes: encCh.length ? encCh : ch.map(x=>({code:x.code, name:x.name, from:0, to:0, qtyFrom:x.from, qtyTo:x.to})), ok:false} : (prev.adjCompras||null);
  let o;
  if(!picked){
    // ainda não separado: só atualiza (mantém a posição na fila)
    const toCompras = d.mode==="temenc" && !keepMode;
    o = {...prev, ...head, items, res:null, status: toCompras ? "analise_compras" : prev.status, hist, adjustedAt:now, ...(adjCompras?{adjCompras}:{})};
    res(o);
  } else {
    // já separado (ou em separação): recalcula o que foi coletado e cria as tarefas de ajuste
    const old=prev.items||[], oldRes=prev.res||[], sep = prev.status==="separando";
    const gotOld={}, needOld={}, pend={};
    old.forEach((it,i)=>{ const r=oldRes[i]||{status:"pend",got:0}; const need=Math.max(0,it.qty-(it.qtyEnc||0));
      needOld[it.code]=(needOld[it.code]||0)+need;
      if(sep && r.status==="pend") pend[it.code]=true; else gotOld[it.code]=(gotOld[it.code]||0)+(r.got||0); });
    const tasks=[], left={...gotOld};
    const newRes = items.map(it=>{ const need=Math.max(0,it.qty-it.qtyEnc);
      if(sep && (pend[it.code] || !(it.code in gotOld))) return {status:"pend", got:0}; // ainda vai ser coletado no picking normal
      const g=Math.min(left[it.code]||0, need); left[it.code]=(left[it.code]||0)-g;
      return {status: g>=need ? "ok" : g>0 ? "part" : "miss", got:g}; });
    const codes=[...new Set([...Object.keys(gotOld), ...items.map(x=>x.code)])];
    codes.forEach(c=>{ const it=items.find(x=>x.code===c) || old.find(x=>x.code===c);
      const needNew=items.filter(x=>x.code===c).reduce((s,x)=>s+Math.max(0,x.qty-x.qtyEnc),0), got=gotOld[c]||0, before=needOld[c]||0;
      if(sep && !(c in gotOld)) return;
      const rem=Math.max(0, got-needNew), add = rem ? 0 : Math.max(0, needNew-Math.max(before, got));
      if(rem) tasks.push({code:c, name:it.name, ean:it.ean||PRODUCTS[c]?.ean||"", kind:"remove", qty:rem});
      if(add) tasks.push({code:c, name:it.name, ean:it.ean||PRODUCTS[c]?.ean||"", kind:"add", qty:add}); });
    tasks.sort((a,b)=>(a.kind==="remove"?0:1)-(b.kind==="remove"?0:1));
    tasks.filter(t=>t.kind==="add").forEach(t=>items.forEach((it,i)=>{ if(it.code===t.code && newRes[i].got < Math.max(0,it.qty-it.qtyEnc)) newRes[i].status="pend"; })); // aguardando o ajuste
    const adj = tasks.length ? {at:now, by:ME.id||"", status:"pendente", tasks, changes:ch, ver:(prev.adj?.ver||0)+1} : null;
    o = {...prev, ...head, items, res:newRes, hist, adjustedAt:now, adj: adj || (prev.adj && prev.adj.status==="pendente" ? {...prev.adj, status:"cancelado"} : prev.adj||null), ...(adjCompras?{adjCompras}:{})};
  }
  state.draft=null; state.draftErr="";
  saveOrder(o);
  toast((anyDec ? `Ajuste da pré-venda ${o.num} enviado para Compras decidir os itens novos` + (o.adj && o.adj.status==="pendente" ? ` · o separador vai ${adjSummary(o.adj)}` : "")
    : o.adj && o.adj.status==="pendente" ? `Ajuste da pré-venda ${o.num} enviado · o separador vai ${adjSummary(o.adj)}` : `Pré-venda ${o.num} atualizada${adjCompras&&!adjCompras.ok?" · Compras foi avisado":""}`));
}

/* ---- tela do separador: executar o ajuste ---- */
function startAdjust(oid){
  const o=ORDERS.find(x=>x.id===oid); if(!o || !adjReady(o) || !can("coleta")) return;
  const w=adjW(o);
  state.aj={oid, phase: w.code && (w.k==="tray"||w.k==="colmeia") ? "find" : "findBtn", idx:0, step:"prod", cnt:0, done:{}};
  patchOrder(o.id, {adj:{...o.adj, startedAt:Date.now(), startedBy:ME.id||""}});
  state.view="adjust"; render(); scrollTo(0,0);
}
function ajCur(){ const a=state.aj, o=a && ORDERS.find(x=>x.id===a.oid); if(!o || !o.adj) return null; return {a, o, tasks:o.adj.tasks, t:o.adj.tasks[a.idx]}; }
function ajNext(){ const c=ajCur(); if(!c) return; const {a, tasks}=c; const n=tasks.findIndex((t,k)=>!a.done[k]);
  if(n<0){ a.phase="back"; } else { a.idx=n; a.step="prod"; a.cnt=0; a.phase="tasks"; }
  render(); scrollTo({top:0,behavior:"smooth"}); }
function finishAdjust(){
  const c=ajCur(); if(!c) return; const {o}=c, now=Date.now();
  // as peças coletadas no ajuste entram no resultado da separação
  const r=JSON.parse(JSON.stringify(o.res||[]));
  o.adj.tasks.filter(t=>t.kind==="add").forEach(t=>{ let q=t.qty; (o.items||[]).forEach((it,i)=>{ if(it.code!==t.code || !q) return; const need=Math.max(0,it.qty-(it.qtyEnc||0)), cur=r[i]||{status:"pend",got:0}, put=Math.min(q, need-(cur.got||0));
    if(put>0){ cur.got=(cur.got||0)+put; q-=put; } cur.status = cur.got>=need ? "ok" : cur.got>0 ? "part" : "miss"; r[i]=cur; }); });
  const mv = o.adj.moveTo ? {colmeia:o.adj.moveTo, mode:"aguarda", status:"na_colmeia", storedAt:now, tray:"", trayStatus:""} : {};
  patchOrder(o.id, {res:r, ...mv, adj:{...o.adj, status:"ok", doneAt:now, doneBy:ME.id||""}, hist:[...(o.hist||[]), {t:now, by:ME.id||"", ev:"Ajuste da pré-venda concluído pela separação · "+adjSummary(o.adj)+(o.adj.moveTo?` · guardado na colmeia ${o.adj.moveTo.slice(3)}`:"")}]});
  toast(`Ajuste do pedido #${o.num} concluído`); state.aj=null; state.view="orders"; render(); scrollTo(0,0);
}
function renderAdjust(){
  const c=ajCur(); if(!c){ state.aj=null; state.view="orders"; return render(); }

      ${a.phase==="find" ? `<div class="instr">${ICON_SCAN}<div>Bipe a etiqueta da ${w.k==="colmeia"?"colmeia":"bandeja"} <b>${esc(w.k==="colmeia"?w.code.slice(3):w.code)}</b> para começar.</div></div>

      ${L ? `<div class="loc"><div class="grow"><div class="eyebrow">Local no estoque</div><div class="loc-code">${esc(code(L))}</div></div></div><div class="map-card">${mapSVG({loc:L}, null)}</div>`
        : `<div class="noloc"><div class="eyebrow">Local no estoque</div><div class="loc-code">Sem local cadastrado</div><div class="noloc-t">Procure pelo código <b>${esc(t.code)}</b>.</div></div>`}
      <div class="uscount"><button class="mini" id="ajMinus" aria-label="Menos uma">−</button><b class="tnum">${a.cnt}</b><span>de ${t.qty} pç coletadas</span><button class="mini" id="ajPlus" aria-label="Mais uma">+</button></div>
      <div class="instr">${ICON_SCAN}<div>Pegue as peças, bipe cada uma e coloque junto do pedido (${esc(w.t.replace(/^Na /,"na ").replace(/^Este pedido.*$/,"onde ele está"))}).</div></div>
      <button class="btn primary" id="ajOk" ${a.cnt>=t.qty?"":"disabled"}>Confirmar ${t.qty} pç coletadas</button>
      <button class="demo" id="sim">Simular leitura da peça (demo)</button></div>`;
  else main=`<div class="product">
      <div class="eyebrow">Tudo feito</div><h2 style="margin:0">${o.adj.moveTo?"Guarde o pedido na colmeia":"Devolva o pedido ao lugar"}</h2>
      <div class="adjwhere">${o.adj.moveTo ? `Agora o pedido tem encomenda: guarde todas as peças na colmeia ${esc(o.adj.moveTo.slice(3))} até a encomenda chegar.` : esc(w.k==="envio" ? "Deixe o pedido de volta na área de envio, aguardando a transportadora." : w.t)}</div>
      <button class="btn primary" id="ajDone">Ajuste concluído</button></div>`;
  app.innerHTML = `

      <div class="grow"><h1>#${esc(o.num)} · ajuste</h1><div class="sub">${esc(o.client)}</div></div><span class="badge tnum">${doneN}/${tasks.length}</span></header>
    <div class="adjbar">AJUSTE DE PRÉ-VENDA · o Comercial refez a pré-venda</div>
    <div class="phases ph3">${ph("find",1,"Achar o pedido")}${ph("tasks",2,"Retirar / coletar")}${ph("back",3,"Devolver")}</div>
    ${main}
    ${a.phase==="tasks"?`<div class="eyebrow" style="margin-top:14px">Tarefas · ${doneN} de ${tasks.length}</div>
    <div class="list" style="margin-top:6px">${tasks.map((x,k)=>`<div class="li ${k===a.idx?"cur":""}" style="cursor:default"><span class="lc tnum">${x.kind==="remove"?"−":"+"}${x.qty}</span><span class="ln">${esc(x.code)} · ${esc(x.name)}<small>${x.kind==="remove"?"retirar e devolver ao estoque":"coletar e juntar ao pedido"}</small></span>${a.done[k]?`<span class="chip done">Feito</span>`:""}</div>`).join("")}</div>`:""}`;
  document.getElementById("back").onclick=()=>{ state.view="orders"; render(); };

function scanAdjust(v){
  const c=ajCur(); if(!c) return; const {a, o, t}=c, w=adjW(o);
  if(a.phase==="find"){
    const ok = w.k==="colmeia" ? hiveCode(v)===w.code : normSpot(v)===w.code;
    if(ok){ feedback(true); ajNext(); return setMsg("Pedido encontrado","good"); }
    feedback(false); return setMsg(`Este não é o pedido certo. Procure a ${w.k==="colmeia"?"colmeia "+w.code.slice(3):"bandeja "+w.code}.`,"bad"); }
  if(a.phase!=="tasks" || !t) return;
  if(a.step==="prod"){
    if(!((!!t.ean && v===t.ean) || v===t.code)){ feedback(false); return setMsg(`Código ${v} não é ${t.name}.`,"bad"); }
    if(a.cnt>=t.qty){ feedback(false); return setMsg(`Já foram bipadas as ${t.qty} pç. Confirme.`,"info"); }
    feedback(true); a.cnt++; render(); return setMsg(a.cnt>=t.qty ? `${a.cnt} de ${t.qty} pç · confirme` : `${a.cnt} de ${t.qty} pç`,"good"); }
  const L=usLoc(t); if(!L) return;
  if(v===code(L)){ feedback(true); a.done[a.idx]=true; toast(`${t.code} devolvido em ${code(L)}`); return ajNext(); }
  feedback(false); setMsg(LOC_RE.test(v) ? `Endereço errado: ${v}. Guarde em ${code(L)}.` : `Bipe a etiqueta do endereço ${code(L)}.`,"bad");
}
