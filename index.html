/* ---- Administrador: editar os itens de um pedido que está na colmeia ----
   Adicionar ou excluir itens, mudar quantidades e dividir cada item entre "na colmeia" (já separado) e "encomenda". */
function openHiveItems(id){
  const o=ORDERS.find(x=>x.id===id); if(!o || !hasRole("admin")) return;
  let rows=(o.items||[]).map(it=>({code:it.code, name:it.name, ean:it.ean||"", un:it.un||"UN", price:it.price||0, qty:it.qty, enc:it.qtyEnc||0, old:true}));
  let err="";
  const ov=document.createElement("div"); ov.className="modal"; document.body.appendChild(ov); scanbar.hidden=true;
  const close=()=>{ ov.remove(); render(); };
  const prodList=Object.values(PRODUCTS).slice(0,4000);
  const draw=()=>{
    const tot=rows.reduce((s,r)=>s+r.qty,0), enc=rows.reduce((s,r)=>s+r.enc,0);
    ov.innerHTML=`<div class="mbox wide hied" role="dialog" aria-modal="true" aria-label="Editar itens do pedido ${esc(o.num)}"><h2>Editar itens · #${esc(o.num)}</h2>
      <p>${esc(o.client)} · colmeia <b>${esc((o.colmeia||"—").replace(/^CM-/,""))}</b>. Ajuste os itens como estão de verdade: o que já está separado na colmeia e o que é encomenda.</p>
      <div class="hiedt"><div class="hiedh"><span>Item</span><span class="r">Qtd. total</span><span class="r">Encomenda</span><span class="r">Na colmeia</span><span></span></div>
      ${rows.map((r,i)=>`<div class="hiedr ${r.qty-r.enc>0?"":"allenc"}"><span><b class="mono">${esc(r.code)}</b> ${esc(r.name)}${r.old?"":` <span class="chip done">novo</span>`}</span>
        <input class="tin r" type="number" min="1" step="1" value="${r.qty}" data-hq="${i}" aria-label="Quantidade de ${esc(r.code)}">
        <input class="tin r" type="number" min="0" max="${r.qty}" step="1" value="${r.enc}" data-he="${i}" aria-label="Encomenda de ${esc(r.code)}">
        <b class="r tnum">${r.qty-r.enc}</b>
        <button type="button" class="icbtn sm" data-hdel="${i}" title="Excluir item" aria-label="Excluir ${esc(r.code)}">×</button></div>`).join("") || `<div class="empty">Nenhum item.</div>`}</div>
      <div class="hieadd"><input class="tin" id="hiCode" list="hiProd" placeholder="Adicionar item: SKU ou descrição" autocomplete="off"><datalist id="hiProd">${prodList.map(p=>`<option value="${esc(p.code)}">${esc(p.name)}</option>`).join("")}</datalist>
        <input class="tin r" id="hiQty" type="number" min="1" step="1" value="1" aria-label="Quantidade"><label class="chk"><input type="checkbox" id="hiEnc"> encomenda</label><button type="button" class="mini" id="hiAdd">Adicionar</button></div>
      <small class="muted-s">Total ${tot} pç · ${tot-enc} na colmeia · ${enc} encomenda. Mudanças em itens de encomenda são avisadas para Compras.</small>
      <div class="merr">${esc(err)}</div>
      <div class="mact"><button class="btn ghost" id="mNo">Cancelar</button><button class="btn primary" id="mOk">Salvar itens</button></div></div>`;
    const g=k=>ov.querySelector("#"+k);
    ov.querySelectorAll("[data-hq]").forEach(inp=>inp.onchange=()=>{ const r=rows[+inp.dataset.hq]; r.qty=Math.max(1,Math.round(+inp.value||1)); r.enc=Math.min(r.enc,r.qty); setTimeout(draw); });
    ov.querySelectorAll("[data-he]").forEach(inp=>inp.onchange=()=>{ const r=rows[+inp.dataset.he]; r.enc=Math.max(0,Math.min(r.qty,Math.round(+inp.value||0))); setTimeout(draw); });
    ov.querySelectorAll("[data-hdel]").forEach(b=>b.onclick=()=>{ rows.splice(+b.dataset.hdel,1); draw(); });
    g("hiAdd").onclick=()=>{ const v=g("hiCode").value.trim(), q=Math.max(1,Math.round(+g("hiQty").value||1));
      const p=PRODUCTS[v] || prodList.find(x=>hvNorm(x.name)===hvNorm(v)) || prodList.find(x=>hvNorm(x.name).includes(hvNorm(v)));
      if(!v){ err="Informe o SKU do item."; return draw(); }
      if(!p){ err=`Produto ${v} não encontrado. Cadastre em Locais → Produtos e EAN.`; return draw(); }
      const ex=rows.find(r=>r.code===p.code); if(ex){ ex.qty+=q; if(g("hiEnc").checked) ex.enc+=q; }
      else rows.push({code:p.code, name:p.name, ean:p.ean||"", un:"UN", price:0, qty:q, enc:g("hiEnc").checked?q:0, old:false});
      err=""; draw(); };
    g("hiCode").onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); g("hiAdd").click(); } };
    g("mNo").onclick=close;
    g("mOk").onclick=()=>{
      if(!rows.length){ err="O pedido precisa ter pelo menos um item."; return draw(); }
      const items=rows.map(r=>{ const old=(o.items||[]).find(x=>x.code===r.code);
        return {...(old||{}), code:r.code, name:r.name, ean:r.ean||old?.ean||"", un:r.un, price:old?.price ?? r.price, qty:r.qty, qtyEnc:r.enc, eta: r.enc ? (old?.eta||"") : "", loc: old?.loc||PRODUCTS[r.code]?.loc||""}; });
      const ch=adjChanges(o.items||[], items), encCh=adjEncChanges(o, items), now=Date.now();
      const encMoved = items.some(it=>{ const old=(o.items||[]).find(x=>x.code===it.code); return (old?.qtyEnc||0)!==it.qtyEnc; });
      if(!ch.length && !encMoved){ close(); return; }
      // o que está na colmeia já está separado
      const r=items.map(it=>{ const need=Math.max(0,it.qty-it.qtyEnc); return {status: need ? "ok" : "pend", got:need}; });
      const anyEnc=items.some(it=>it.qtyEnc>0);
      const patch={items, res:r, hist:[...(o.hist||[]), {t:now, by:ME.id||"", ev:"Itens editados pelo administrador na colmeia · "+[...ch.map(adjChangeTxt), ...items.filter(it=>{ const old=(o.items||[]).find(x=>x.code===it.code); return old && (old.qtyEnc||0)!==it.qtyEnc && old.qty===it.qty; }).map(it=>`${it.code}: encomenda ${(o.items.find(x=>x.code===it.code).qtyEnc||0)} → ${it.qtyEnc} pç`)].join(" · ")}]};
      if(anyEnc && o.status==="pronto_envio" && !o.fase2){ patch.status="na_colmeia"; patch.mode="aguarda"; }       // voltou a ter encomenda: aguarda na colmeia
      if(!anyEnc && o.status==="na_colmeia"){ patch.status="pronto_envio"; }                                         // nada mais a encomendar: pronto
      if(encCh.length) patch.adjCompras={at:now, by:ME.id||"", changes:encCh, ok:false};
      patchOrder(o.id, patch); toast(`Itens do pedido #${o.num} atualizados${encCh.length?" · Compras foi avisado":""}`); close();
    };
  };
  ov.onclick=e=>{ if(e.target===ov) close(); };
  draw();
}

// pedaço mínimo de markdown: **negrito**, listas e quebras de linha (o texto é escapado antes)
function lucasMd(t){
  const lines=esc(t||"").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/`([^`]+)`/g,"<code>$1</code>").split(/\n/);
  let out="", list=null;
  const close=()=>{ if(list){ out+=`</${list}>`; list=null; } };
  lines.forEach(l=>{ let m;
    if((m=l.match(/^\s*(\d+)[.)]\s+(.*)$/))){ if(list!=="ol"){ close(); out+="<ol>"; list="ol"; } out+=`<li>${m[2]}</li>`; }
    else if((m=l.match(/^\s*[-•*]\s+(.*)$/))){ if(list!=="ul"){ close(); out+="<ul>"; list="ul"; } out+=`<li>${m[1]}</li>`; }
    else if((m=l.match(/^\s*#{1,4}\s+(.*)$/))){ close(); out+=`<p><b>${m[1]}</b></p>`; }
    else if(l.trim()){ close(); out+=`<p>${l}</p>`; }
    else close(); });
  close(); return out;
}

// reduz o print (máx. 1600 px, JPEG) para enviar rápido
function lucasImg(file){ return new Promise((ok,ko)=>{ const r=new FileReader(); r.onerror=ko; r.onload=()=>{ const img=new Image(); img.onerror=ko; img.onload=()=>{
  const k=Math.min(1, 1600/Math.max(img.width,img.height)), c=document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
  const g=c.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,c.width,c.height); g.drawImage(img,0,0,c.width,c.height);
  ok({media_type:"image/jpeg", data:c.toDataURL("image/jpeg",0.85).split(",")[1]}); }; img.src=r.result; }; r.readAsDataURL(file); }); }
async function lucasAttach(files){

async function lucasSend(){

// áudio: ditado do próprio aparelho (português), a fala vira texto na caixa de mensagem

    const hd=d?.colmeias; if(hd && hd.cols>0 && hd.rows>0){ HIVE_DIM={cols:Math.min(26,+hd.cols), rows:Math.min(30,+hd.rows)}; buildHive(); } rerender(); }, ()=>{ mesasDoc=null; });
  usersCol = db.collection("users");
  usersCol.onSnapshot(snap=>{ USERS = Object.fromEntries(snap.docs.map(d=>[d.id, JSON.parse(JSON.stringify(d.data()))])); authReady=true; rerender(); }, e=>{ usersCol=null; authReady=true; rerender(); });
  blockCol = db.collection("blocks");
  blockCol.onSnapshot(snap=>{ BLOCKS = Object.fromEntries(snap.docs.map(d=>[d.id, JSON.parse(JSON.stringify(d.data()))])); rerender(); }, e=>{ blockCol=null; });
  prodCol = db.collection("products");
  prodCol.onSnapshot(snap=>{ PRODUCTS = Object.fromEntries(snap.docs.map(d=>[d.id, JSON.parse(JSON.stringify(d.data()))])); rerender(); }, e=>{ prodCol=null; });
  nfCol = db.collection("invoices");
  nfCol.onSnapshot(snap=>{ NFS = Object.fromEntries(snap.docs.map(d=>[d.id, JSON.parse(JSON.stringify(d.data()))])); if(["compras","recebimento"].includes(state.sector)) rerender(); }, e=>{ nfCol=null; });
  purchCol = db.collection("purchases");
  purchCol.onSnapshot(snap=>{ PURCHASES = Object.fromEntries(snap.docs.map(d=>[d.id, JSON.parse(JSON.stringify(d.data()))])); if(state.sector==="compras") rerender(); }, e=>{ purchCol=null; });
  col = db.collection("orders");
  col.onSnapshot(snap=>{
    const allOrders = snap.docs.map(d=>normalize(JSON.parse(JSON.stringify(d.data()))));
    ORDERS = allOrders.filter(o=>o.status!=="excluido"); DELETED = allOrders.filter(o=>o.status==="excluido");
    if(authReady) checkNewOrders(); else seenOrders = null;
    synced = true; rerender();
  }, e=>{ col=null; synced=false; rerender(); });
})();
</script>

</html>
