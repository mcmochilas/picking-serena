<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
/* Login */
#lgOverlay{position:fixed;inset:0;z-index:50;background:var(--bg,#EDF0F3);display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));overflow:auto}
.lg-card{width:100%;max-width:380px;background:var(--surface,#fff);border:1px solid var(--line,#D4DBE3);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:14px;color:var(--ink,#15202B)}
.lg-brand{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:18px;letter-spacing:.04em;text-transform:uppercase}
.lg-brand span{color:var(--muted,#5A6978)}
.lg-card h1{margin:0;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:30px}
#lgForm{display:flex;flex-direction:column;gap:12px}
#lgForm label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted,#5A6978)}
#lgForm input{height:46px;border:1px solid var(--line,#D4DBE3);border-radius:10px;padding:0 12px;font:16px system-ui,sans-serif;background:var(--bg,#EDF0F3);color:var(--ink,#15202B);text-transform:none;letter-spacing:0}
#lgForm input:focus{outline:2px solid var(--route,#2A5BC8);outline-offset:0}
.lg-btn{height:50px;border:0;border-radius:12px;background:var(--accent,#F2A900);color:#1A1405;font:600 16px system-ui,sans-serif;cursor:pointer}
.lg-btn:disabled{opacity:.6}
.lg-links{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.lg-links button{border:0;background:none;color:var(--route,#2A5BC8);font:600 14px system-ui,sans-serif;cursor:pointer;padding:4px 0;text-decoration:underline;text-underline-offset:3px}
.lg-err{background:var(--bad-soft,#FBE3E0);color:var(--bad,#C0392B);border-radius:10px;padding:10px 12px;font-weight:600;font-size:14px}
.lg-ok{background:var(--ok-soft,#DDF2E8);color:var(--ok,#1D845A);border-radius:10px;padding:10px 12px;font-weight:600;font-size:14px}
.lg-hint{margin:0;font-size:13px;color:var(--muted,#5A6978)}
.me .logout{color:var(--route,#2A5BC8)}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>

<style>
/* Layout: single phone-width column; sticky task bar; map card is the hero of the picking screen. */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --ink:#15202B; --muted:#5A6978; --line:#D4DBE3;
  --accent:#F2A900; --accent-soft:#FFF1C7; --accent-ink:#7A5300;
  --floor:#E2E7ED; --rack:#B6C2CE; --route:#2A5BC8; --ok:#1D845A; --ok-soft:#DDF2E8; --bad:#C0392B; --bad-soft:#FBE3E0;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F151C; --surface:#18212B; --ink:#E6ECF2; --muted:#93A2B2; --line:#2A3542;
  --accent:#F5B71A; --accent-soft:#3A2F12; --accent-ink:#F5C449;
  --floor:#1B2530; --rack:#3A4858; --route:#6F9BFF; --ok:#3CC488; --ok-soft:#163327; --bad:#F06A5B; --bad-soft:#3A1D1A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F151C; --surface:#18212B; --ink:#E6ECF2; --muted:#93A2B2; --line:#2A3542;
  --accent:#F5B71A; --accent-soft:#3A2F12; --accent-ink:#F5C449;
  --floor:#1B2530; --rack:#3A4858; --route:#6F9BFF; --ok:#3CC488; --ok-soft:#163327; --bad:#F06A5B; --bad-soft:#3A1D1A; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.app{max-width:520px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--route);outline-offset:2px}
.tnum{font-variant-numeric:tabular-nums}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.bar h1{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.01em;margin:0;line-height:1.1;text-wrap:balance}
.bar .sub{color:var(--muted);font-size:13px}
.back{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.grow{flex:1;min-width:0}
.badge{font-family:var(--mono);font-size:12px;font-weight:700;padding:4px 8px;border-radius:6px;background:var(--surface);border:1px solid var(--line);white-space:nowrap}

.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.section{display:flex;flex-direction:column;gap:10px;margin-top:18px}

/* Orders */
.shift{display:flex;gap:10px;margin-top:16px}
.shift > div{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.shift b{display:block;font-family:var(--display);font-size:26px;line-height:1}
.order{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;position:relative;overflow:hidden}
.order:focus-visible{outline:3px solid var(--route);outline-offset:2px}
.order.urgent{border-left:5px solid var(--accent)}
.order .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.order .num{font-family:var(--mono);font-weight:700;font-size:15px}
.order .client{font-weight:600;font-size:16px}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:13px}
.chip{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:99px;white-space:nowrap}
.chip.urg{background:var(--accent-soft);color:var(--accent-ink)}
.chip.norm{background:var(--floor);color:var(--muted)}
.chip.done{background:var(--ok-soft);color:var(--ok)}
.chip.prog{background:var(--floor);color:var(--route)}
.prog-bar{height:5px;border-radius:3px;background:var(--floor);overflow:hidden}
.prog-bar i{display:block;height:100%;background:var(--ok);border-radius:3px;transition:width .4s}

/* Picking */
.steps{display:flex;gap:4px;margin-top:12px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.steps i.ok{background:var(--ok)} .steps i.miss{background:var(--bad)} .steps i.cur{background:var(--accent)}

.loc{display:flex;align-items:center;gap:14px;margin-top:14px}
.loc-code{font-family:var(--mono);font-weight:700;font-size:clamp(22px,7vw,36px);letter-spacing:.02em;line-height:1}
.loc-code span{color:var(--muted);font-weight:500}
.noloc .loc-code{font-family:var(--display);font-size:clamp(20px,6vw,28px);color:var(--warn,#C27C0E)}
.spotbtn{width:100%;margin-top:8px}
.tlogo-w{display:inline-flex;align-items:center;background:#fff;border-radius:6px;padding:2px 6px;height:24px;box-sizing:border-box}
.tlogo{display:block;max-height:20px;max-width:110px;object-fit:contain}
.loteopt .tlogo{max-height:24px;max-width:140px;background:#fff;border-radius:4px;padding:2px 4px}
.trow{align-items:center}.trow b{flex:1;font-size:14px}.tprev{width:120px;height:32px;display:flex;align-items:center;background:#fff;border-radius:6px;padding:0 6px;box-sizing:border-box}
.tprev .tlogo{max-height:26px;max-width:108px}.tup{cursor:pointer}.muted-s{color:var(--muted);font-size:12px}
.lotebox{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.lotebox b{display:block;font-size:15px}.lotebox small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.lotebox.on{border-color:var(--accent);background:var(--accent-soft)}
.lotebtns{display:flex;gap:6px;flex:none}
.playbtn{width:52px;height:52px;min-height:52px;padding:0;border-radius:50%;display:grid;place-items:center;flex:none}
.lotem .lotetype{display:flex}.lotem .lotetype button{flex:1}
.lotelist{display:flex;flex-direction:column;gap:6px;max-height:46vh;overflow:auto}
.loteopt{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;font-weight:600}
.loteopt span{flex:1}.loteopt b{color:var(--muted)}.loteopt input{width:20px;height:20px;accent-color:var(--accent)}
.lotebadge{background:var(--accent-soft);color:var(--ink);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:700;margin:8px 0 0}
.canalseg{display:flex;margin:12px 0 8px}.canalseg button{flex:1}.canalseg b{margin-left:4px;opacity:.75}
.ecofil{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.ecofil .chips{display:flex;gap:6px;overflow-x:auto;align-items:center;padding-bottom:2px;scrollbar-width:none}
.ecofil .eyebrow{flex:none;margin-right:2px}
.fchip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.fchip b{opacity:.6;margin-left:2px}.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.eco{background:var(--route-soft,rgba(111,155,255,.16));color:var(--route,#2A5BC8)}
.transp{font-weight:600;color:var(--ink)}
.mzcancel{background:var(--bad);color:#fff;font-weight:700;border-radius:8px;padding:6px 10px;font-size:13px;letter-spacing:.02em}
.retira{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px;cursor:pointer}
.retira input{width:22px;height:22px;accent-color:var(--bad);flex:none;margin-top:1px}.retira b{display:block}.retira small{color:var(--muted);font-size:13px}
.retira.on{border-color:var(--ok);background:var(--ok-soft)}
.retira.green input{accent-color:var(--ok)}
.retira.naloja.on{border-color:var(--bad);background:var(--bad-soft)}
.flagrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}.flagrow .retira{margin-top:10px}
@media (max-width:560px){.flagrow{grid-template-columns:1fr}}
.order.urg-loja{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad) inset}
.order.urg-retira{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok) inset;border-left-color:var(--ok)}
.retirabar{background:var(--bad);color:#fff;font-weight:800;font-size:12px;letter-spacing:.08em;border-radius:6px;padding:4px 8px;align-self:flex-start}
.retirabar.rb-green{background:var(--ok)}
.tvrow.tvurg{border-left-color:var(--bad);background:var(--bad-soft)}
.tvrow.tvurg.green{border-left-color:var(--ok);background:var(--ok-soft)}
.tvurgtag.green{background:var(--ok)}
.tvurgtag{font-style:normal;font-family:var(--display);font-size:.72em;background:var(--bad);color:#fff;border-radius:.3em;padding:.1em .4em;margin-left:.4em;animation:tvblink 1s ease-in-out infinite}
.mzcancel.warn{background:var(--accent);color:#111}
.mzcancel.big{margin:10px 0;font-size:15px;padding:10px 12px}
.ecoinfo{display:flex;align-items:center;gap:8px;margin:8px 0 2px;font-size:14px;font-weight:600}
.mzsync{margin-top:12px}
.nuchk{grid-column:1/-1;display:flex;gap:14px;align-items:center;flex-wrap:wrap}.danger-t{color:var(--bad)}.mzlast{font-size:13px;margin:6px 0 10px}
.mzbox{margin-top:16px;border-top:1px solid var(--line);padding-top:6px}
.mzform{display:grid;gap:8px;margin:8px 0}.mzform .tin{width:100%;box-sizing:border-box}
.mzbtns{display:flex;gap:8px;flex-wrap:wrap}
.mzdist div{display:grid;gap:2px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.mzdist small{color:var(--muted)}
a.refbtn{text-decoration:none}
@media (max-width:600px){ .refbtn.tvlink{display:none} }
/* ---- Painel TV ---- */
html.tvmode{--bg:#0B1117; --surface:#151E28; --ink:#EEF3F8; --muted:#93A2B2; --line:#26323F; --accent:#F5B71A; --accent-soft:#3A2F12; --ok:#3CC488; --ok-soft:#163327; --bad:#F06A5B; --bad-soft:#3A1D1A; color-scheme:dark; background:var(--bg)}
html.tvmode body{background:var(--bg);color:var(--ink);overflow:hidden}
.app.tv{max-width:none;height:100vh;display:flex;flex-direction:column;padding:1.4vw 1.8vw;box-sizing:border-box;gap:1.2vw;font-size:clamp(9px,min(1.05vw,1.95vh),34px)}
.tvhead{display:flex;align-items:center;justify-content:space-between;gap:2vw}
.tvhead .brand{font-family:var(--display);font-weight:700;font-size:2.1em;letter-spacing:.04em;text-transform:uppercase;line-height:1}
.tvhead .brand small{display:block;font-family:inherit;font-size:.45em;letter-spacing:.14em;color:var(--muted);font-weight:600;margin-top:.3em}
.tvclock{text-align:center}.tvclock b{font-family:var(--display);font-size:3.2em;line-height:1}.tvclock small{display:block;color:var(--muted);text-transform:capitalize}
.tvtools{display:flex;align-items:center;gap:.8em}.tvtools .sync{font-size:1em}
.tvgrid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:1.6vw}
.tvcol{background:var(--surface);border:1px solid var(--line);border-radius:1.2em;padding:1.2em 1.4em;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.tvcol h2{margin:0 0 .5em;font-family:var(--display);font-size:2em;letter-spacing:.02em}
.tvcol h3{margin:1em 0 .45em;font-size:.85em;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tvkpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:.6em}
.tvkpis div{min-width:0;overflow:hidden;background:var(--bg);border:1px solid var(--line);border-radius:.8em;padding:.55em .7em}
.tvkpis b{display:block;font-family:var(--display);font-size:2.1em;line-height:1.05;white-space:nowrap;overflow:hidden}
.tvkpis small{display:block;font-size:.68em;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);line-height:1.2;overflow-wrap:anywhere}
.app.tv .tvtools .refbtn{font-size:.85em;padding:.45em .9em;min-height:0;height:auto}
.tvkpis .tvwarn b{color:var(--accent)}.tvkpis .tvbad b{color:var(--bad)}
.tvlist{display:flex;flex-direction:column;gap:.4em}
.tvrow{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:.9em;background:var(--bg);border:1px solid var(--line);border-left:.35em solid var(--line);border-radius:.6em;padding:.5em .8em}
.tvrow:has(.tvpos){grid-template-columns:1.6em auto 1fr auto}
.tvrow.doing{grid-template-columns:auto 1fr 9em auto;border-left-color:var(--route,#6F9BFF)}
.tvrow.tvwarn{border-left-color:var(--accent)}.tvrow.tvbad{border-left-color:var(--bad)}
.tvrow.tvwarn .tvtime{color:var(--accent)}.tvrow.tvbad .tvtime{color:var(--bad)}
.tvlist.fit{flex:1;min-height:0;overflow:hidden}
.tvrow[hidden],.tvdone[hidden]{display:none}
.tvrow.fin{border-left-color:var(--ok);padding:.35em .8em}
.tvpos{color:var(--muted);font-weight:700}
.tvnum{font-family:var(--mono);font-weight:700;font-size:1.15em;white-space:nowrap}
.tvcli{font-weight:600;font-size:1.1em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tvcli small{display:block;font-weight:500;font-size:.78em;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.tvtime{font-family:var(--mono);font-weight:700;font-size:1.15em;white-space:nowrap}
.tvlist.small .tvcli{font-size:.95em}.tvlist.small .tvtime,.tvlist.small .tvnum{font-size:.95em}
.tvprog{position:relative;height:1.6em;background:var(--line);border-radius:.4em;overflow:hidden}
.tvprog i{position:absolute;inset:0 auto 0 0;background:var(--route,#6F9BFF)}
.tvprog small{position:relative;display:block;text-align:center;line-height:1.6em;font-size:.8em;font-weight:700}
.tvnew{font-style:normal;font-family:var(--display);font-size:.75em;background:var(--accent);color:#111;border-radius:.3em;padding:.05em .35em;margin-left:.3em;animation:tvblink 1.2s ease-in-out infinite}
@keyframes tvblink{50%{opacity:.35}}
.tvsound{font-size:.9em;color:var(--ok);font-weight:600}
.tvcanais{color:var(--ink);letter-spacing:.04em;margin-left:.3em}
.tvnone{color:var(--muted);padding:.6em .2em}.tvnone.ok{color:var(--ok);font-weight:600}
.tvmore{color:var(--muted);font-size:.9em;padding:.2em .3em}
.tvsoon{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6em;color:var(--muted);text-align:center;border:2px dashed var(--line);border-radius:1em;margin-top:1em}
.tvsoon b{color:var(--ink);font-size:1.4em}
@media (max-width:900px){ .app.tv{height:auto;font-size:14px} html.tvmode body{overflow:auto} .tvgrid{grid-template-columns:1fr} .tvkpis{grid-template-columns:repeat(3,1fr)} }
.refbtn{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;font-size:14px;cursor:pointer;flex:none}
.refbtn svg{width:18px;height:18px}
.refbtn.spin svg{animation:refspin .8s linear infinite}
.refbtn[disabled]{opacity:.7}
@keyframes refspin{to{transform:rotate(360deg)}}
@media (max-width:380px){ .refbtn span{display:none} .refbtn{width:40px;padding:0;justify-content:center} }
.mesas .mrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.mesas .mrow b{min-width:78px}
.ordwrap{position:relative;display:flex;flex-direction:column}
.ordwrap.acts1 .order .meta{padding-right:48px}
.ordwrap.acts2 .order .meta{padding-right:96px}
.ord-acts{position:absolute;right:12px;bottom:12px;display:flex;gap:8px;z-index:1}
.icbtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg,var(--surface));color:var(--muted);display:grid;place-items:center;cursor:pointer;padding:0}
.icbtn:active{transform:scale(.95)}
.icbtn.del{color:var(--bad)}
.icbtn svg{width:18px;height:18px}
.back.del{color:var(--bad)}
.modal{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:16px}
.mbox{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:18px;width:min(440px,100%);box-shadow:0 12px 40px rgba(0,0,0,.4)}
.mbox h2{margin:0 0 8px;font-size:20px}
.mbox p{margin:0 0 10px;font-size:14px;color:var(--muted);line-height:1.45}
.mbox textarea{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:10px;background:var(--bg,transparent);color:var(--ink);padding:10px;font:inherit;font-size:15px;resize:vertical}

.qlist{display:flex;flex-direction:column;gap:8px}

.qcard{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}

.qcard .pvn{font-family:var(--mono);font-weight:700;font-size:13px}
.qcard .cl{font-weight:600;font-size:14px;line-height:1.25}
.qcard details{font-size:13px;color:var(--muted)}
.qcard summary{cursor:pointer;font-weight:600}
.qcard ul{margin:6px 0 0;padding-left:18px}
.mini{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;font-size:12px;font-weight:600}
.hive{display:grid;grid-template-columns:18px repeat(6,minmax(0,1fr));gap:5px}
.hive .hh{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--muted);font-family:var(--mono)}

.slot.pickable:hover{border-color:var(--accent)}

.slot.envio{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}

.slot.target{background:var(--accent);border-color:var(--ink);color:#1A1405;animation:blink 1.4s ease-in-out infinite}

.legend2{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--muted)}

.chip.enc{background:var(--accent-soft);color:var(--accent-ink)}
.chip.sent{background:var(--floor);color:var(--muted)}
.empty{color:var(--muted);font-size:14px;padding:8px 0}
.banner{margin-top:12px;background:var(--accent-soft);color:var(--accent-ink);border-radius:10px;padding:10px 12px;font-size:13px;font-weight:600}
.hivebig{margin-top:14px}
.store-code{font-family:var(--mono);font-weight:700;font-size:48px;line-height:1}

@media (prefers-reduced-motion: reduce){
  .arrived .m-ring,.arrived .m-cell.target{animation:none}
  .arrived .m-ring{opacity:.6;transform:scale(1.6)}
}

<body>
<div class="app" id="app"></div>
<div class="toast" id="toast" hidden></div>
<div class="alertbar" id="alertbar" role="alert" hidden></div>
<div class="scanbar" id="scanbar" hidden>
  <div class="scanmsg info" id="scanmsg" aria-live="polite"></div>
  <div class="in">
    <button class="cam" id="cam" aria-label="Ler código com a câmera"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h3l2-2.5h6L17 7h3v12H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Câmera</button>
    <div class="scanfield">
      <input id="scan" inputmode="none" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Leitor pronto: bipe o código" aria-label="Código lido">
      <button class="kbd" id="kbd" aria-label="Digitar código manualmente"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h.01M11 10h.01M15 10h.01M7 14h10"/></svg></button>
    </div>
  </div>
</div>
<input type="file" id="camfile" accept="image/*" capture="environment" hidden>

<script>
function brNum(s){ return parseFloat(String(s).replace(/[^\d,.-]/g,"").replace(/\./g,"").replace(",", ".")) || 0; }
function parsePresale(raw){
  const cells = raw.filter(c=>c.s && c.s.trim()).map(c=>({s:c.s.trim(), x:c.x, y:c.y, w:c.w, cx:c.x+c.w/2}));
  const lines=[];
  [...cells].sort((a,b)=>b.y-a.y||a.x-b.x).forEach(c=>{ let L=lines.find(l=>Math.abs(l.y-c.y)<2.5); if(!L){ L={y:c.y,cells:[]}; lines.push(L); } L.cells.push(c); });
  const all = lines.map(l=>l.cells.sort((a,b)=>a.x-b.x).map(c=>c.s).join(" ")).join("\n");
  const m = re => { const r=all.match(re); return r ? r.slice(1).map(x=>x && x.trim()) : null; };
  // número: "Pré-venda - 123" ou "Orçamento - 123" (também aceita "Orçamento nº 123", "ORÇAMENTO: 123")
  const num = m(/(?:Pr[ée]\s*-?\s*venda|Or[çc]amento)\s*(?:n[º°o.]*\s*)?[-–:#]?\s*(\d+)/i)?.[0];
  const dt = m(/Data:\s*([\d/]+)\s*Hora:\s*([\d:]+)/) || [];
  const cli = m(/Cliente:\s*(\d+)\s*-\s*(.+?)(?:\s+CPF\/CNPJ:.*)?$/m) || [];
  const end = m(/Endere[çc]o:\s*(.+)$/m)?.[0] || "";
  const cm = end.match(/([^,]+?)\s+-\s+([A-Z]{2})\s*(?:,\s*[\d.-]+)?\s*$/);
  const seller = m(/Vendedor:\s*(.+?)(?:\s+Tabela:.*)?$/m)?.[0] || "";
  const obs = m(/Observa[çc][õo]es:\s*(.+)$/m)?.[0] || "";
  const total = brNum(m(/VALOR TOTAL:\s*R\$\s*([\d.,]+)/)?.[0] || 0);

  const hCod = cells.find(c=>/^C[óo]d/.test(c.s));
  if(!num || !hCod) throw new Error("formato");
  // Cabeçalho da tabela: pode vir em uma linha ("Valor Bruto") ou quebrado em várias ("Valor" / "Bruto").
  // Junta as palavras que ficam na mesma coluna (mesmo centro) dentro da faixa do cabeçalho.
  const band = cells.filter(c=>Math.abs(c.y-hCod.y)<=14 && !/\d{3}|,\d|%\d/.test(c.s) && c.s.length<=24);
  const yH = Math.min(...band.map(c=>c.y));
  const hcols = [];
  [...band].sort((a,b)=>b.y-a.y||a.x-b.x).forEach(c=>{
    const col = hcols.find(h=>Math.abs(h.cx-c.cx)<16 && !h.ys.includes(Math.round(c.y)));
    if(col){ col.s += " "+c.s; col.ys.push(Math.round(c.y)); col.x=Math.min(col.x,c.x); col.w=Math.max(col.x+col.w,c.x+c.w)-col.x; }
    else hcols.push({s:c.s, cx:c.cx, x:c.x, w:c.w, ys:[Math.round(c.y)]});
  });
  const H = re => hcols.find(h=>re.test(h.s));
  const cols = [["code",H(/^C[óo]d/)||hCod],["desc",H(/^Descri/)],["un",H(/^UN$/)],["qty",H(/^Quant/)],["vb",H(/^Valor Bruto/)],["dp",H(/^Desconto/)],["vl",H(/^Valor L/)],["vt",H(/^Valor Total/)]].filter(c=>c[1]);
  const ends = cells.filter(c=>/^(SUBTOTAL|QTD\. TOTAL|REFER)/.test(c.s)).map(c=>c.y);
  const yE = ends.length ? Math.max(...ends) : -Infinity;
  const region = cells.filter(c=>c.y<yH-2 && c.y>yE+2).map(c=>{
    let best=null,d=1e9; for(const [k,h] of cols){ const dd=Math.abs(c.cx-(h.x+h.w/2)); if(dd<d){d=dd;best=k;} } return {...c,col:best};
  });
  const rows = region.filter(c=>c.col==="code" && /^\d{2,12}$/.test(c.s)).sort((a,b)=>b.y-a.y).map(c=>({y:c.y, code:c.s, cells:[]}));
  if(!rows.length) throw new Error("sem itens");
  region.filter(c=>!(c.col==="code" && rows.some(r=>r.code===c.s && r.y===c.y))).forEach(c=>{
    let best=rows[0]; for(const r of rows) if(Math.abs(r.y-c.y)<Math.abs(best.y-c.y)) best=r; best.cells.push(c);
  });
  const items = rows.map(r=>{
    const desc = r.cells.filter(c=>c.col==="desc").sort((a,b)=>b.y-a.y||a.x-b.x);
    const ean = desc.find(c=>/^\d{8,14}$/.test(c.s))?.s || "";
    const name = desc.filter(c=>c.s!==ean).map(c=>c.s).join(" ");
    const g = k => r.cells.find(c=>c.col===k)?.s;
    return {code:r.code, name, ean, un:g("un")||"UN", qty:Math.round(brNum(g("qty"))), price:brNum(g("vl")||g("vb")), lineTotal:brNum(g("vt"))};
  });
  return { num, date:dt[0]||"", time:dt[1]||"", clientCode:cli[0]||"", client:cli[1]||"", city: cm ? `${cm[1].trim()} - ${cm[2]}` : "", seller, obs, total, items };
}

/* ================== Dados e utilidades ================== */
/* Colmeias: grade com colunas A, B, C… e linhas 1, 2, 3… · código da etiqueta CM-A1 */
let HIVE_DIM = {cols:6, rows:4}, HIVE = [];
const HIVE_COL = i => String.fromCharCode(65+i);
function buildHive(){ HIVE=[]; for(let r=1;r<=HIVE_DIM.rows;r++) for(let c=0;c<HIVE_DIM.cols;c++) HIVE.push("CM-"+HIVE_COL(c)+r); }
buildHive();
function hiveCode(v){ // aceita CM-A1, A1 e as etiquetas antigas CM-01…CM-24
  v=String(v||"").toUpperCase().replace(/\s+/g,"");
  let m=v.match(/^CM-?(\d{1,2})$/); if(m){ const n=+m[1]-1; return "CM-"+HIVE_COL(n%6)+(Math.floor(n/6)+1); }
  m=v.match(/^(?:CM-?)?([A-Z])0*(\d{1,2})$/); return m ? "CM-"+m[1]+(+m[2]) : v; }
const isHiveCode = v => /^CM-[A-Z]\d{1,2}$/.test(v);
const MODES = { total:{t:"Envio total", c:"norm"}, parcial:{t:"Envio parcial", c:"prog"}, aguarda:{t:"Aguarda encomenda", c:"urg"}, encomenda:{t:"Encomenda total", c:"enc"} };
function statusInfo(o){
  switch(o.status){
    case "aguardando": return {t:"Aguardando separação", c:"norm"};
    case "separando": return {t:"Em separação", c:"prog"};
    case "pronto_envio": return {t: o.mode==="encomenda" ? "Encomenda chegou · pronto para enviar" : o.mode==="aguarda" ? `Encomenda chegou · retirar da colmeia ${o.colmeia||""}` : o.remessa===2 ? "Encomenda chegou" : "Finalizado · na mesa", c:"done"};
    case "encomenda": return {t:"Encomenda total · aguardando chegada", c:"enc"};
    case "analise_compras": return {t:"Aguardando decisão de Compras", c:"urg"};
    case "enc_pendente": return {t:"1º envio feito · aguardando encomenda", c:"enc"};
    case "na_colmeia": return {t:"Na colmeia · aguardando encomenda", c:"enc"};
    case "na_mesa": return {t:`Na mesa · guardar na colmeia ${o.colmeia||""}`, c:"prog"};
    case "lavagem": return o.trayStatus==="lavagem" ? {t:`A caminho da mesa · bandeja ${o.tray||""}`, c:"prog"} : {t:"A caminho da mesa", c:"prog"};
    case "excluido": return {t:"Excluído", c:"bad"};
    default: return {t:"Finalizado", c:"sent"};
  }
}
const usesHive = o => o.mode==="aguarda" && o.status!=="enviado" && o.status!=="excluido" && !!o.colmeia;
function normalize(o){ // compatibilidade com pedidos gravados na versão anterior
  if(o.status==="aguardando_envio") o.status="pronto_envio";
  if(o.status==="aguardando_encomenda") o.status="na_colmeia";
  if(o.mode==="parcial" && o.colmeia && !o.v2) o.mode="aguarda";
  if(o.mode==="aguarda" && !o.hiveManual && (o.items||[]).length && o.items.every(i=>(i.qtyEnc||0)>=i.qty) && ["na_colmeia","aguardando"].includes(o.status)){ o.mode="encomenda"; o.status="encomenda"; delete o.colmeia; } // tudo encomenda: sem colmeia
  if(o.colmeia) o.colmeia = hiveCode(o.colmeia);
  if(o.mode!=="aguarda") delete o.colmeia;
  o.canal ||= "consultiva"; // canal de venda: consultiva (pré-venda) ou ecommerce (fluxo futuro)
  return o;
}
// Cadastro de endereços de estoque (no sistema real vem do ERP/WMS)
const TRAYS = Array.from({length:30},(_,i)=>"BJ-"+String(i+1).padStart(2,"0"));
/* Mesas (MESA-001, MESA-002…): locais compartilhados para itens grandes que não cabem na bandeja,
   ou para o pedido inteiro quando não há bandeja livre. Cadastradas em Locais → Etiquetas → Mesas. */
let MESAS = [{code:"MESA-001", desc:"Itens grandes / sem bandeja"}], mesasDoc = null;
/* Cestas (CESTA-001…): local compartilhado onde o separador junta vários pedidos (no lugar da bandeja) */
let CESTAS = [];
const isCestaCode = v => /^CESTA-\d{3}$/.test(String(v||""));
const isCesta = v => CESTAS.some(m=>m.code===v);
const isShared = v => /^(MESA|CESTA)-\d{3}$/.test(String(v||""));   // aceitam vários pedidos ao mesmo tempo
const spotName = c => isCestaCode(c) ? "Cesta-"+String(c).slice(6) : "Mesa-"+String(c||"").slice(5);
const isMesaCode = v => /^MESA-\d{3}$/.test(String(v||""));
const isMesa = v => MESAS.some(m=>m.code===v);
const defMesa = () => MESAS[0]?.code || "MESA-001";
const mesaName = c => "Mesa-"+String(c||"").slice(5);
const normSpot = v => { let m=/^MESA-?0*(\d{1,3})$/.exec(v); if(m) return "MESA-"+m[1].padStart(3,"0"); m=/^CESTA-?0*(\d{1,3})$/.exec(v); return m ? "CESTA-"+m[1].padStart(3,"0") : v; };
const isTrayCode = v => /^BJ-\d{2}$/.test(v) || isMesa(v) || isCesta(v);
const bigSpots = o => [...new Set((o.res||[]).map(x=>x&&x.spot).filter(sp=>sp && sp!==o.tray))];
const bigOnMesa = o => bigSpots(o).length>0;
const trayLabel = t => isShared(t) ? spotName(t) : "bandeja "+t;
function spotsTxt(o){ const a=[]; if(o.tray) a.push(isShared(o.tray)?spotName(o.tray):"Bandeja "+o.tray); bigSpots(o).forEach(sp=>a.push(mesaName(sp))); return a.join(" + "); }
let PRODUCTS = {}; // cadastro: código -> {code, name, ean, loc}
const LOC_TYPES = { GAV:"Gaveta", COL:"Colmeia", BIN:"Bin" };
let BLOCKS = {}, blockCol = null; // estruturas: {r, l, t, n1, n2, c1, c2} geram os locais
const colIdx = c => c.length===1 ? c.charCodeAt(0)-65 : (c.charCodeAt(0)-64)*26 + (c.charCodeAt(1)-65);
const colName = i => i<26 ? String.fromCharCode(65+i) : String.fromCharCode(64+Math.floor(i/26)) + String.fromCharCode(65+i%26);
/* Rua: número (R1…R99) ou letra (RA, RB — ruas do fundo do estoque) */
const LOC_RE = /^R(\d{1,2}|[A-Z])-L([A-Z])-(GAV|COL|BIN)-(\d{1,2})\.([A-Z]{1,2})$/;
const ruaKey = v => { const s=String(v??"").trim().toUpperCase().replace(/^R/,""); return /^\d{1,2}$/.test(s) && +s>=1 ? +s : /^[A-Z]$/.test(s) ? s : null; };
const ruaSort = (a,b) => (typeof a==="number"?0:1)-(typeof b==="number"?0:1) || (typeof a==="number" ? a-b : String(a).localeCompare(String(b)));
function parseCode(s){ const m=String(s||"").toUpperCase().match(LOC_RE); return m ? {r:ruaKey(m[1]), l:m[2], t:m[3], n:+m[4], c:m[5], ci:colIdx(m[5])} : null; }
const inBlock = (b,x) => b.r===x.r && b.l===x.l && b.t===x.t && x.n>=b.n1 && x.n<=b.n2 && x.ci>=colIdx(b.c1) && x.ci<=colIdx(b.c2);
function parseLoc(s){ const x=parseCode(s); return x && Object.values(BLOCKS).some(b=>inBlock(b,x)) ? x : null; } // válido e cadastrado
function blockLocs(b){ const out=[]; for(let n=b.n1;n<=b.n2;n++) for(let ci=colIdx(b.c1);ci<=colIdx(b.c2);ci++) out.push(`R${b.r}-L${b.l}-${b.t}-${n}.${colName(ci)}`); return out; }
function allLocs(){ return Object.values(BLOCKS).flatMap(blockLocs).sort((a,b)=>{ const x=parseCode(a), y=parseCode(b); return ruaSort(x.r,y.r) || x.l.localeCompare(y.l) || x.n-y.n || x.ci-y.ci; }); }
const ruas = () => [...new Set(Object.values(BLOCKS).map(b=>b.r))].sort(ruaSort);
const locType = lc => parseCode(lc)?.t || "";
const fullLoc = lc => lc;
function normLoc(s){ s=String(s||"").trim().toUpperCase().replace(/\s+/g,"-");
  let m=s.match(/^R?(\d{1,2})-?L?([A-Z])-?(GAV|COL|BIN)-?(\d{1,2})[.\-]?([A-Z]{1,2})$/); if(m) return `R${+m[1]}-L${m[2]}-${m[3]}-${+m[4]}.${m[5]}`;
  m=s.match(/^R([A-Z])-?L([A-Z])-?(GAV|COL|BIN)-?(\d{1,2})[.\-]?([A-Z]{1,2})$/); return m ? `R${m[1]}-L${m[2]}-${m[3]}-${+m[4]}.${m[5]}` : s; }
function locFor(c){ return parseLoc(PRODUCTS[c]?.loc); }
const liveLoc = it => locFor(it.code) || (typeof it.loc==="string" ? parseLoc(it.loc) : null);
const liveEan = it => PRODUCTS[it.code]?.ean || it.ean || "";
const ean13 = b => { const d=String(b).slice(0,12); let s=0; [...d].forEach((c,i)=>s+=(+c)*(i%2?3:1)); return d+((10-s%10)%10); };
const validEan = e => /^\d{13}$/.test(e) && ean13(e)===e;
const pad = n => String(n).padStart(2,"0");
const code = l => `R${l.r}-L${l.l}-${l.t}-${l.n}.${l.c}`;
const money = v => (v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate = iso => iso ? iso.split("-").reverse().join("/") : "";
const app = document.getElementById("app");

/* Tempos: integração → início da separação → fim da separação → mesa → envio */
function fmtDur(ms){
  if(ms==null || isNaN(ms)) return "—"; ms=Math.max(0,ms);
  const s=Math.floor(ms/1000), m=Math.floor(s/60), h=Math.floor(m/60), d=Math.floor(h/24);
  if(s<60) return s+"s"; if(m<60) return m+" min "+pad(s%60)+"s"; if(h<24) return h+"h "+pad(m%60)+"min"; return d+"d "+(h%24)+"h";
}
function fmtClock(ts){ if(!ts) return "—"; const d=new Date(ts), t=d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
  return d.toDateString()===new Date().toDateString() ? t : d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"})+" "+t; }
const since = ts => ts ? `<span class="tick tnum" data-since="${ts}">${fmtDur(Date.now()-ts)}</span>` : "—";
function stages(o){
  const mesa = o.atMesaAt || o.storedAt;
  return [
    {k:"Integrado pelo comercial", t:o.createdAt},
    {k:"Início da separação", t:o.startedAt, d:"Espera na fila", from:o.createdAt},
    ...(o.tray && o.atMesaAt && o.pickedAt && o.atMesaAt!==o.pickedAt ? [
      {k:"Fim da separação", t:o.pickedAt, d:"Separação", from:o.startedAt},
      ...(o.semPecas?[]:[{k: o.mode==="aguarda"?"Guardado na colmeia":"Mesa de expedição", t:mesa, d:"Até a mesa", from:o.pickedAt}]) ]
    : [ {k:"Chegada na mesa · fim do picking", t:o.pickedAt, d:"Tempo de picking", from:o.startedAt},
      ...(o.mode==="aguarda" && !o.semPecas ? [{k:"Guardado na colmeia", t:o.storedAt, d:"Mesa até a colmeia", from:o.pickedAt}] : []) ]),
    ...(hasEnc(o) ? [{k:"Encomenda chegou", t:o.arrivedAt, d:"Espera da encomenda", from:o.pickedAt}] : []),
    ...(o.mode==="aguarda" ? [{k:"Retirado da colmeia", t:o.sentAt, d:"Total desde a integração", from:o.createdAt}] : []),
  ];
}
const hasEnc = o => (o.items||[]).some(i=>i.qtyEnc>0);
function timelineHTML(o){
  const st=stages(o); let nowMarked=false;
  const end = o.atMesaAt || o.pickedAt; // o picking termina na mesa
  const total = end && o.createdAt && o.mode!=="aguarda" ? `<div class="tl-total">Total do picking (integração → mesa): <b class="tnum">${fmtDur(end-o.createdAt)}</b></div>` : "";

    <button class="mini" data-pg="${key}:${p+1}" ${p===pages?"disabled":""} aria-label="Próxima página">Próxima ›</button></div>`;

let pdfReady=null;
function loadPdfJs(){
  if(pdfReady) return pdfReady;
  const add = src => new Promise((ok,ko)=>{ const s=document.createElement("script"); s.src=src; s.onload=ok; s.onerror=ko; document.head.appendChild(s); });
  const base="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
  pdfReady = add(base+"pdf.min.js").then(()=>add(base+"pdf.worker.min.js")).catch(e=>{ pdfReady=null; throw e; });
  return pdfReady;
}
async function readPresalePdf(file){
  await loadPdfJs();
  const pdf = await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
  const pg = await pdf.getPage(1); const tc = await pg.getTextContent();
  return parsePresale(tc.items.map(i=>({s:i.str, x:i.transform[4], y:i.transform[5], w:i.width})));
}
async function importPdf(file){

  state.parsing=true; state.draftErr=""; render();
  try{
    const p = await readPresalePdf(file);
    state.parsing=false; startDraft(p);

function sendDraft(){
  const d = state.draft, enc = d.mode!=="total"; let m = d.mode;
  const items = d.items.map(it=>({code:it.code, name:it.name, ean:it.ean, un:it.un, qty:it.qty, price:it.price, loc:it.loc?code(it.loc):"", qtyEnc: enc?(it.qtyEnc||0):0, eta: enc&&it.qtyEnc?it.eta:""}));
  const zeroQ = items.filter(it=>!(it.qty>0));
  if(zeroQ.length){ state.draftErr=`Quantidade zerada em: ${zeroQ.map(x=>x.code).join(", ")}. O PDF não foi lido corretamente; não dá para enviar assim.`; return render(); }
  const hasEnc = items.some(it=>it.qtyEnc>0), hasPick = items.some(it=>it.qty-it.qtyEnc>0);
  if(enc && !hasEnc){ state.draftErr="Informe pelo menos um item sob encomenda, ou escolha Envio total."; return render(); }
  if(m==="encomenda" && hasPick){ state.draftErr="Na encomenda total todos os itens são encomenda. Se há peças em estoque, use Envio parcial ou Aguarda encomenda."; return render(); }
  if(m==="parcial" && hasEnc && !hasPick) m = "encomenda"; // tudo encomenda: não separa e não usa colmeia
  const toCompras = m==="aguarda" || m==="encomenda"; // Compras decide se encomenda tudo ou separa o que tem na loja
  const missing = items.map((it,i)=>it.qtyEnc>0 && !it.eta ? i : -1).filter(i=>i>=0);
  if(missing.length){ missing.forEach(i=>document.getElementById("eta-"+i)?.classList.add("invalid")); state.draftErr=""; toast("Informe a previsão de chegada dos itens sob encomenda."); return; }
  const noLoc = items.filter(it=>it.qty-it.qtyEnc>0 && !it.loc);
  items.forEach(it=>{ const p=PRODUCTS[it.code]; if(!p) saveProduct({code:it.code, name:it.name, ean:it.ean, loc:it.loc?code(it.loc):""}); else if(!p.ean && it.ean && !validateProduct({...p, ean:it.ean})) saveProduct({...p, ean:it.ean}); });
  const prev = ORDERS.find(o=>o.id===d.id);
  const slot = null; // a colmeia é escolhida quando Compras encaminha para a separação
  const o = { id:d.id, num:d.num, date:d.date, time:d.time, clientCode:d.clientCode, client:d.client, city:d.city, seller:d.seller, obs:d.obs, total:d.total,
    mode:m, v2:true, items, remessa:1, status: toCompras ? "analise_compras" : "aguardando", modeCom: m, createdAt: Date.now(), createdBy: ME.id||"", canal:"consultiva", retira: !!(d.retira||d.naLoja), naLoja: !!d.naLoja, transportadora: (d.transportadora ?? carrierFromObs(d.obs)) || "" };
  if(slot) o.colmeia = slot;
  res(o);
  state.draft=null; state.draftErr="";
  saveOrder(o);
  toast(toCompras ? `Pré-venda ${o.num} enviada para Compras decidir a encomenda` : (noLoc.length ? `${noLoc.length} item(ns) sem local · o separador procura no estoque · ` : "") + `Pré-venda ${o.num} enviada para separação · ${MODES[m].t.toLowerCase()}`);
}

function openHiveDim(){

      HIVE_DIM={cols, rows}; buildHive();

function hiveHTML(target, pick){
  const by = {}; ORDERS.filter(usesHive).forEach(o=>by[o.colmeia]=o);
  const cell = s => { const o=by[s];
    const cls = s===target ? "target" : !o ? (pick?"pickable":"") : o.status==="pronto_envio" ? "envio" : o.status==="na_colmeia" ? "enc" : "res";
    return pick && !o ? `<button type="button" class="slot ${cls}" data-hpick="${s}" title="Livre">${s.slice(3)}</button>`
      : `<div class="slot ${cls}" title="${o?esc("#"+o.num+" · "+o.client):"Livre"}">${s.slice(3)}${o?`<b>${esc(o.num)}</b>`:""}</div>`; };
  let g=`<span class="hh"></span>`; for(let c=0;c<HIVE_DIM.cols;c++) g+=`<span class="hh">${HIVE_COL(c)}</span>`;
  for(let r=1;r<=HIVE_DIM.rows;r++){ g+=`<span class="hh">${r}</span>`; for(let c=0;c<HIVE_DIM.cols;c++) g+=cell("CM-"+HIVE_COL(c)+r); }
  return `<div class="hive" style="grid-template-columns:18px repeat(${HIVE_DIM.cols},minmax(0,1fr))">${g}</div>
    <div class="legend2"><span><i></i>Livre</span><span><i style="background:var(--floor)"></i>Reservada</span><span><i style="background:var(--accent-soft)"></i>Aguarda encomenda</span><span><i style="background:var(--ok-soft)"></i>Encomenda chegou</span></div>`;
}

/* ================== COMPRAS: encomendas aos fornecedores ==================
   Lista as pré-vendas com itens sob encomenda (encomenda total, envio parcial e aguarda encomenda),
   mostra onde estão as peças do estoque (colmeia) e deixa o setor de compras:
   1) importar o PDF do pedido feito ao fornecedor e relacionar cada linha às pré-vendas (manual);
   2) marcar a chegada dos itens e liberar o pedido para o envio/retirada. */
let PURCHASES = {}, purchCol = null;
const encItems = o => (o.items||[]).map((it,i)=>({...it, i})).filter(x=>x.qtyEnc>0);
const encArrived = o => !!o.arrivedAt || (o.mode==="parcial" && o.remessa===2);
const encOpen = o => !isEco(o) && !["enviado","excluido","analise_compras"].includes(o.status) && hasEnc(o) && !encArrived(o);
const toDecide = o => o.status==="analise_compras";
const canRelease = o => o.status==="na_colmeia" || o.status==="encomenda" || o.status==="enc_pendente" || (o.status==="pronto_envio" && o.mode==="parcial" && o.remessa!==2);
const compraSt = it => it.compra?.st==="chegou" ? "chegou" : (it.compra?.links||[]).reduce((s,l)=>s+(+l.qty||0),0) >= it.qtyEnc ? "pedido" : (it.compra?.links||[]).length ? "parcial" : "falta";
const compraQty = it => (it.compra?.links||[]).reduce((s,l)=>s+(+l.qty||0),0);
function encKind(o){
  const pick = (o.items||[]).some(it=>it.qty-(it.qtyEnc||0)>0), cm = o.colmeia ? o.colmeia.slice(3) : "";
  if(!pick || o.mode==="encomenda") return {t:"Encomenda total", c:"enc", d:"Todos os itens são encomenda · não passa pela separação nem usa colmeia · enviar quando chegar"};
  if(o.mode==="parcial"){
    const sent = o.status==="pronto_envio" || o.status==="enviado" || !!o.pickedAt;
    return {t:"Envio parcial", c:"prog", d: sent ? "1º envio já feito com as peças do estoque (sem colmeia) · a encomenda segue no 2º envio" : "1º envio (peças do estoque) ainda na separação · a encomenda segue no 2º envio"};
  }
  return {t:"Aguarda encomenda", c:"res", d: o.status==="na_colmeia" ? `Peças do estoque guardadas na colmeia ${cm}` : o.status==="na_mesa" ? `Peças do estoque na mesa, indo para a colmeia ${cm}` : `Peças do estoque na separação · vão para a colmeia ${cm}`};
}
// Prazo do fornecedor: previsão de chegada informada na importação do pedido (a mais tardia dos vínculos)
const isoOf = d => !d ? "" : /^\d{4}-\d{2}-\d{2}$/.test(d) ? d : /^\d{2}\/\d{2}\/\d{4}$/.test(d) ? d.split("/").reverse().join("-") : "";
const prevOf = it => (it.compra?.links||[]).map(l=>isoOf(l.prev||l.entrega)).filter(Boolean).sort().pop() || "";
const todayISO = () => { const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
const daysTo = iso => Math.round((Date.parse(iso+"T12:00:00")-Date.parse(todayISO()+"T12:00:00"))/864e5);
function prazoInfo(it){ const p=prevOf(it); if(!p || compraSt(it)==="chegou") return null; const d=daysTo(p);
  return d<0 ? {c:"bad", t:`Atrasado ${-d} dia${d===-1?"":"s"}`, d, p} : d<=2 ? {c:"warn", t: d===0?"Chega hoje":`Chega em ${d} dia${d===1?"":"s"}`, d, p} : {c:"done", t:"No prazo", d, p}; }
const COMPRA_LABEL = { falta:["A encomendar","bad"], parcial:["Encomendado em parte","prog"], pedido:["Encomendado","enc"], chegou:["Chegou","done"] };

function renderCompras(){
  const decide = ORDERS.filter(o=>toDecide(o) && !isEco(o)).sort((a,b)=>(urgRank(b)-urgRank(a)) || (a.createdAt||0)-(b.createdAt||0));
  const tab = state.cTab || (decide.length ? "decidir" : "abertas");
  const open = ORDERS.filter(encOpen).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
  const done = ORDERS.filter(o=>!isEco(o) && hasEnc(o) && encArrived(o) && o.status!=="excluido").sort((a,b)=>(b.arrivedAt||0)-(a.arrivedAt||0)).slice(0,60);
  const allIt = open.flatMap(o=>encItems(o).map(x=>({...x, o}))), falta = allIt.filter(x=>compraSt(x)==="falta"||compraSt(x)==="parcial"), aguard = allIt.filter(x=>compraSt(x)==="pedido"||compraSt(x)==="parcial"), late = aguard.filter(x=>prazoInfo(x)?.c==="bad");
  const q = (state.cQ||"").trim().toLowerCase();
  const match = o => !q || [o.num,o.client,o.seller,...(o.items||[]).map(i=>i.code+" "+i.name)].join(" ").toLowerCase().includes(q);
  const purch = Object.values(PURCHASES).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  let body;
  if(tab==="decidir"){
    const list = decide.filter(match), pgd = pageOf(list, "cpdec", 10);
    body = list.length ? `${pgd.top}<div class="cplist">${pgd.items.map(decideCard).join("")}</div>${pgd.pager}`
      : `<div class="empty">${q?"Nada encontrado para essa busca.":"Nenhuma pré-venda aguardando decisão."}</div>`;
  } else if(tab==="chegada"){
    const rows = aguard.filter(x=>match(x.o)).sort((a,b)=>(prevOf(a)||"9999").localeCompare(prevOf(b)||"9999"));
    const pgw = pageOf(rows, "cpwait", 20);
    body = rows.length ? `${pgw.top}<div class="cpcard"><div class="cptwrap"><table class="cptab cpwait"><thead><tr><th>Previsão</th><th>Prazo</th><th>Pré-venda</th><th>Item</th><th class="r">Qtd</th><th>Fornecedor · pedido</th><th></th></tr></thead><tbody>
      ${pgw.items.map(x=>{ const pz=prazoInfo(x), links=x.compra?.links||[];
        return `<tr class="${pz?.c==="bad"?"late":""}"><td class="tnum">${prevOf(x)?fmtDate(prevOf(x)):"—"}</td><td>${pz?`<span class="chip ${pz.c}">${pz.t}</span>`:`<span class="muted-s">sem previsão</span>`}</td>
          <td><b class="mono">#${esc(x.o.num)}</b><div class="muted-s">${esc(x.o.client)}</div></td><td><span class="mono">${esc(x.code)}</span> ${esc(x.name)}</td><td class="r tnum">${compraQty(x)}${compraQty(x)<x.qtyEnc?`/${x.qtyEnc}`:""} pç</td>
          <td>${links.map(l=>{ const p=PURCHASES[l.pid]; return `<div>${esc(p?.forn||"Fornecedor")}${(l.ped||p?.num)?" · ped. "+esc(l.ped||p.num):""}</div>`; }).join("")}</td>

/* ---- Decisão de Compras: encomendar tudo ou separar o que tem na loja (colmeia) ---- */
function decidePlan(o, qs){
  const items=o.items.map((it,i)=>({...it, qtyEnc: Math.max(0, Math.min(it.qty, qs[i] ?? it.qtyEnc ?? 0))}));
  const enc=items.reduce((s,it)=>s+it.qtyEnc,0), pick=items.reduce((s,it)=>s+it.qty-it.qtyEnc,0);
  const kind = !enc ? "total" : !pick ? "encomenda" : "aguarda";
  return { items, enc, pick, kind, refsPick: items.filter(it=>it.qty-it.qtyEnc>0).length, refsEnc: items.filter(it=>it.qtyEnc>0).length };
}

/* ---- Leitura do PDF do fornecedor ----
   Os fornecedores mandam formatos diferentes (relatório de pedidos em aberto, pedido de venda,
   orçamento). A leitura acha a linha de cabeçalho da tabela (Código/Item · Descrição · Quantidade)
   e lê cada linha abaixo dela: código do fornecedor, descrição, quantidade e, quando houver,
   nº do pedido e data de entrega da própria linha. Recebe as páginas como listas de
   pedaços de texto com posição ({s, x, y, w}) e devolve {forn, num, entrega, lines}. */
function parseSupplierPages(pages){
  const norm = t => String(t||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
  const brNum = t => { t=String(t).trim(); if(!/^\d{1,3}(\.\d{3})*(,\d+)?$|^\d+(,\d+)?$|^\d+\.\d+$/.test(t)) return NaN;
    if(t.includes(",")) return +t.replace(/\./g,"").replace(",","."); if(/^\d{1,3}(\.\d{3})+$/.test(t)) return +t.replace(/\./g,""); return +t; };
  const DATE = /^\d{2}\/\d{2}\/\d{4}$/;
  // palavras com posição: um pedaço de texto pode conter várias palavras e até colunas inteiras
  const lines = [];
  pages.forEach((items, pi) => {
    const words = [];
    items.forEach(it => { const s = it.s || ""; if(!s.trim()) return; const cw = (it.w || s.length*5) / Math.max(1, s.length);
      s.replace(/\S+/g, (m, idx) => { words.push({ t:m, x: it.x + idx*cw, x2: it.x + (idx+m.length)*cw, y: it.y }); return m; }); });
    words.sort((a,b) => b.y - a.y || a.x - b.x);
    let cur = null;
    words.forEach(w => { if(!cur || Math.abs(cur.y - w.y) > 3){ cur = { y:w.y, page:pi, w:[] }; lines.push(cur); } cur.w.push(w); });
    lines.filter(l=>l.page===pi).forEach(l => l.w.sort((a,b) => a.x - b.x));
  });
  const text = l => l.w.map(w=>w.t).join(" ");
  // segmentos separados por espaços grandes (nomes de empresas no cabeçalho)
  const segs = l => { const out=[]; let s=null; l.w.forEach(w=>{ if(!s || w.x - s.x2 > 14){ s={t:w.t, x2:w.x2}; out.push(s); } else { s.t+=" "+w.t; s.x2=w.x2; } }); return out.map(x=>x.t); };

  // fornecedor: primeiro nome de empresa do topo que não seja a Serena
  let forn = "";
  for(const l of lines.slice(0, 14)){ for(const sg of segs(l)){ const n = norm(sg);
    if(/serena/.test(n) || /:/.test(sg) || /pedido|cliente|endereco|cnpj|data|rua |r \d/.test(n)) continue;
    if(/\b(ltda|ind\b|ind\.|industria|s\/?a\b|eireli|comercio|com\.|metais|acessorios)/.test(n) && sg.length > 6){ forn = sg.replace(/\s+-\s+base nova$/i,"").trim();
      const fw = forn.split(" ")[0], k = forn.lastIndexOf(" "+fw+" "); if(k>0) forn = forn.slice(k+1); break; } }
    if(forn) break; }
  const all = lines.map(text).join("\n");
  // sem razão social no topo: tenta "ASSIST.: 329 - ITALY VENDAS 4" / "Representada: X"
  if(!forn){ const m = all.match(/ASSIST\.?\s*:\s*\d*\s*-?\s*([A-Z][A-Z0-9&. ]{2,30}?)\s+VENDAS\b/) || all.match(/-\s*((?!FOR[CÇ]A\b)[A-Z][A-Z0-9&. ]{2,30}?)\s+VENDAS\b/) || all.match(/(?:fornecedor|representada|fabricante)\s*:\s*([^\n]{3,40})/i); if(m) forn = m[1].trim(); }
  // assinatura do modelo (1ª linha sem números): para lembrar o fornecedor digitado nas próximas importações
  const sig = lines.length ? norm(text(lines[0])).replace(/[\d:/.,-]+/g," ").replace(/\s+/g," ").trim().slice(0,60) : "";
  const numM = all.match(/(?:Num\.?\s*Pedido|N[º°o]\.?\s*Pedido|Pedido(?!\s*(?:RCA|Cliente|de\s+Venda))|Or[çc]amento\s*N[º°o]?)\s*:?\s*(\d[\d.]*\d|\d)/i);
  const num = numM ? numM[1].replace(/\./g,"") : "";
  const entM = all.match(/Data\s+de\s+entrega\s*:?\s*(\d{2}\/\d{2}\/\d{4})/i);
  const entrega = entM ? entM[1] : "";

  // cabeçalho da tabela
  const isHeader = l => { const n = l.w.map(w=>norm(w.t)); return n.some(t=>/^descri/.test(t)) && n.some(t=>/^(qtde|quantidade|qt|qtd)$/.test(t)) && n.some(t=>/^(codigo|item|produto|cod\.?)$/.test(t)); };
  const out = []; let H = null, last = null;
  const colX = (l, re) => { const w = l.w.find(w => re.test(norm(w.t))); return w ? w.x : null; };
  for(const l of lines){
    if(isHeader(l)){
      H = { code: colX(l,/^(codigo|cod\.?)$/) ?? colX(l,/^item$/) ?? colX(l,/^produto$/), desc: colX(l,/^descri/), qty: colX(l,/^(qtde|quantidade|qt|qtd)$/), ped: colX(l,/^pedido$/) };
      last = null; continue;
    }
    if(!H) continue;
    const t = norm(text(l));
    if(/^(total|nº itens|n itens|n. itens)|total geral|^\s*emitido por|^vl\.? pedido/.test(t)){ H = null; last = null; continue; }
    const ws = l.w.filter(w => w.t !== "(*)" && w.t !== "*");
    if(!ws.length) continue;
    // quantidade: primeiro número a partir da coluna de quantidade (alinhado à direita, pode começar um pouco antes)
    const qi = ws.findIndex(w => w.x2 >= H.qty - 4 && !isNaN(brNum(w.t)) && w.x >= H.desc);
    const ci = ws.findIndex(w => w.x >= H.code - 12 && w.x < H.desc - 2 && (H.ped == null || w.x > H.ped + 20) && !DATE.test(w.t));
    const codeW = ci >= 0 && ci < (qi < 0 ? ws.length : qi) ? [ws[ci]] : [];
    if(qi < 0 || !codeW.length){
      // continuação da descrição na linha de baixo
      if(last && !codeW.length){ const d = ws.filter(w => w.x >= H.desc - 4 && w.x < H.qty - 4 && isNaN(brNum(w.t)) && !DATE.test(w.t)).map(w=>w.t).join(" ");
        if(d && !/^\d{4}\.\d{2}/.test(d)) last.name = (last.name + " " + d).trim(); }
      continue;
    }
    const qty = brNum(ws[qi].t);
    const code = codeW.map(w=>w.t).join(" ");
    const name = ws.slice(ci+1, qi).map(w=>w.t).join(" ").replace(/^[-–·\s]+/,"").trim();
    const ped = H.ped != null ? (ws.find(w => Math.abs(w.x - H.ped) < 30 && /^\d+$/.test(w.t))?.t || "") : "";
    const dt = ws.find(w => DATE.test(w.t))?.t || "";
    if(!(qty > 0) || !/[a-z0-9]/i.test(code)) continue;
    last = { code, name, qty, ped, entrega: dt || entrega };
    out.push(last);
  }
  return { forn, num, entrega, sig, lines: out };
}

async function readSupplierPdf(file){
  await loadPdfJs();
  const pdf = await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise, pages=[];
  for(let n=1;n<=pdf.numPages;n++){ const tc = await (await pdf.getPage(n)).getTextContent(); pages.push(tc.items.map(i=>({s:i.str, x:i.transform[4], y:i.transform[5], w:i.width}))); }
  return parseSupplierPages(pages);
}
// semelhança entre a descrição do fornecedor e o nome do item da pré-venda (ajuda a achar na lista)
const simWords = t => new Set(String(t||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toUpperCase().replace(/^PUX(ADOR)?\b\.?/,"").split(/[^A-Z0-9]+/).filter(w=>w.length>=3 && !["PUX","PUXADOR","COM","MM"].includes(w)));
const simScore = (a, b) => { const A=simWords(a), B=simWords(b); let n=0; A.forEach(w=>{ if(B.has(w)) n++; }); return n; };
const fmtBR = d => d ? (/^\d{4}-/.test(d) ? fmtDate(d) : d) : "";
// SKU da Serena para o código do fornecedor (aprendido nas importações anteriores)
const fornKey = (forn, code) => (String(forn||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase().match(/[A-Z0-9]+/)||[""])[0] + "|" + String(code||"").trim().toUpperCase();
function skuFor(forn, code){ const k=fornKey(forn, code); const p=Object.values(PRODUCTS).find(p=>(p.forn||[]).includes(k)); return p ? p.code : ""; }

    // busca do item da Serena por SKU ou descrição (todas as palavras digitadas)

    const findProd = (q, l) => { const ws=nrm(q).split(/\s+/).filter(Boolean), all=Object.values(PRODUCTS);
      if(!ws.length) return all.map(p=>({p, sc:simScore(l.name, p.name)})).filter(x=>x.sc>0).sort((a,b)=>b.sc-a.sc).slice(0,8).map(x=>x.p);

          : `<div class="skuhint">${isSkuLike(inp.value.trim())?`Nenhum item encontrado. Ao sair do campo, <b>${esc(inp.value.trim().toUpperCase())}</b> será cadastrado como produto novo.`:"Nenhum item encontrado com essa descrição."}</div>`;
        dd.hidden=false; inp.setAttribute("aria-expanded","true");
        dd.querySelectorAll("[data-pick]").forEach(b=>b.onmousedown=e=>{ e.preventDefault(); inp.value=b.dataset.pick; dd.hidden=true; setSku(b.dataset.pick); }); };
      const setSku = v => { l.sku=v; if(l.sku && !PRODUCTS[l.sku] && !l.newName) l.newName=l.name;
        S.lines.forEach(o=>{ if(o!==l && !o.sku && o.code && o.code===l.code){ o.sku=l.sku; o.newName=l.newName; } }); // mesmo código do fornecedor em outras linhas
        setTimeout(draw); };
      inp.onfocus = show; inp.oninput = show;
      inp.onkeydown = e => { if(e.key==="Enter"){ e.preventDefault(); const f=dd.querySelector("[data-pick]"); if(f && !dd.hidden){ inp.value=f.dataset.pick; dd.hidden=true; setSku(f.dataset.pick); } else inp.blur(); } if(e.key==="Escape"){ dd.hidden=true; } };
      inp.onblur = () => { dd.hidden=true; inp.setAttribute("aria-expanded","false"); };
      inp.onchange = () => { const v=inp.value.trim().toUpperCase();

        if(v===l.sku) return;
        const exact=PRODUCTS[v] || Object.values(PRODUCTS).find(p=>nrm(p.code)===nrm(v));
        if(exact) return setSku(exact.code);
        if(isSkuLike(v)) return setSku(v); // SKU novo: será cadastrado

        if(!S.prev){ const ds=[r.entrega, ...r.lines.map(l=>l.entrega)].map(isoOf).filter(d=>d && d>=todayISO()).sort(); S.prev=ds.pop()||""; } // sugestão: a entrega mais tardia do PDF
        S.forn = S.forn || r.forn || (Object.values(PURCHASES).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).find(p=>p.sig && p.sig===r.sig)?.forn) || ""; S.lines=r.lines.map(l=>({...l, sku: skuFor(S.forn, l.code), links:[]}));
        if(!r.lines.length) S.err="Não encontrei a tabela de itens neste PDF. Adicione os itens à mão ou me mande este modelo para eu ensinar o sistema a ler."; }

    ov.querySelectorAll("[data-pf]").forEach(inp=>inp.onchange=()=>{ const l=S.lines[+inp.dataset.j], f=inp.dataset.pf; l[f]= f==="qty" ? Math.max(0,+inp.value||0) : inp.value.trim(); if(f!=="name") setTimeout(draw); });

    ov.querySelectorAll("[data-ladd]").forEach(b=>b.onclick=()=>{ const l=S.lines[+b.dataset.ladd]; (l.links||=[]).push({oid:"", i:-1, qty:""}); draw(); });
    ov.querySelectorAll("[data-lk]").forEach(s=>s.onchange=()=>{ const [j,m]=s.dataset.lk.split(":").map(Number), k=S.lines[j].links[m], [oid,i]=s.value.split(":"); k.oid=oid||""; k.i=oid?+i:-1;

    ov.querySelectorAll("[data-lq]").forEach(s=>s.onchange=()=>{ const [j,m]=s.dataset.lq.split(":").map(Number); S.lines[j].links[m].qty=Math.max(0,+s.value||0); setTimeout(draw); });
    ov.querySelectorAll("[data-lrm]").forEach(b=>b.onclick=()=>{ const [j,m]=b.dataset.lrm.split(":").map(Number); S.lines[j].links.splice(m,1); draw(); });

    g("mNo").onclick=close;
    g("mOk").onclick=()=>{
      const lines=S.lines.filter(l=>l.code||l.name).map(l=>({code:l.code, name:l.name, qty:+l.qty||0, ped:l.ped||"", entrega:l.entrega||"", sku:l.sku||"", links:(l.links||[]).filter(k=>k.oid&&k.i>=0&&+k.qty>0).map(k=>({oid:k.oid, i:k.i, qty:+k.qty}))}));
      if(!S.forn.trim()){ S.err="Informe o fornecedor."; return draw(); }
      if(!S.prev){ S.err="Informe a previsão de chegada do pedido."; g("ppPrev").focus(); return draw(); }
      if(!lines.length){ S.err="Adicione pelo menos um item."; return draw(); }
      const over=lines.find(l=>l.qty && l.links.reduce((s,k)=>s+k.qty,0)>l.qty); if(over){ S.err=`O item ${over.code} tem mais peças vinculadas do que no pedido.`; return draw(); }
      const noName=S.lines.find(l=>l.sku && !PRODUCTS[l.sku] && !String(l.newName??l.name).trim()); if(noName){ S.err=`Informe o nome do novo produto ${noName.sku}.`; return draw(); }
      // cadastra os produtos novos e guarda o código do fornecedor no produto (próximas importações já reconhecem)
      let nNew=0, nMap=0;
      S.lines.filter(l=>l.sku && l.code).forEach(l=>{ const k=fornKey(S.forn,l.code), cur=PRODUCTS[l.sku];
        if(!cur){ saveProduct({code:l.sku, name:String(l.newName??l.name).trim().toUpperCase(), ean:"", loc:"", forn:[k]}); nNew++; }
        else if(!(cur.forn||[]).includes(k)){ saveProduct({...cur, forn:[...(cur.forn||[]), k]}); nMap++; }
        Object.values(PRODUCTS).filter(p=>p.code!==l.sku && (p.forn||[]).includes(k)).forEach(p=>saveProduct({...p, forn:p.forn.filter(x=>x!==k)})); }); // um código do fornecedor aponta para um só item
      const id="PC-"+Date.now().toString(36), doc={id, forn:S.forn.trim(), num:S.num.trim(), prev:S.prev, file:S.file, sig:S.sig||"", lines, createdAt:Date.now(), createdBy:ME.id||""};
      PURCHASES[id]=doc; if(purchCol) queueWrite("pc-"+id, ()=>purchCol.doc(id).set(JSON.parse(JSON.stringify(doc))));
      // grava o vínculo em cada item da pré-venda (com o nº do pedido e a entrega do fornecedor)
      const byOrder={}; lines.forEach(l=>l.links.forEach(k=>(byOrder[k.oid] ||= []).push({...k, ped:l.ped||doc.num, entrega:l.entrega, prev:S.prev, fcode:l.code})));
      Object.entries(byOrder).forEach(([oid,ks])=>patchItems(oid, items=>ks.forEach(k=>{ const it=items[k.i]; if(!it) return; it.compra={...(it.compra||{}), links:[...((it.compra||{}).links||[]), {pid:id, qty:k.qty, ped:k.ped, entrega:k.entrega, prev:k.prev, fcode:k.fcode}]}; })));
      const nl=lines.reduce((s,l)=>s+l.links.length,0);
      toast(`Pedido do fornecedor salvo · ${nl} vínculo${nl===1?"":"s"} com pré-vendas${nMap?` · ${nMap} item(ns) relacionado(s)`:""}${nNew?` · ${nNew} produto(s) cadastrado(s)`:""}`); close();
    };
  };
  ov.onclick=e=>{ if(e.target===ov) close(); };
  document.body.appendChild(ov); scanbar.hidden=true; draw();
}

/* ================== Compras: retirar peças da colmeia e devolver ao estoque ==================
   Para editar um pedido que já foi separado e está guardado na colmeia aguardando encomenda:
   1) bipa a etiqueta da colmeia; 2) para cada item, bipa o produto e confere a quantidade;
   3) leva ao endereço do estoque e bipa a etiqueta do endereço. No fim, o pedido volta para
   "Para decidir" em Compras e a colmeia fica livre. */
const usItems = o => { const r=o.res||[]; return (o.items||[]).map((it,i)=>({...it, i, back: r[i] ? (r[i].got||0) : Math.max(0, it.qty-(it.qtyEnc||0))})).filter(x=>x.back>0); };
const APP_URL = /vercel\.app$|picking-serena/.test(location.hostname) ? location.origin + "/" : "https://picking-serena.vercel.app/";

    <div class="qr" id="usQR" aria-label="QR code do link"><span class="muted-s">Gerando código…</span></div>
    <div class="qrurl"><input class="tinput mono" id="usUrl" value="${esc(url)}" readonly aria-label="Link"><button class="mini" id="usCopy">Copiar</button></div>

function scanUnstore(v){
  const c=usCur(); if(!c) return; const {u, o, its, it}=c;
  if(u.phase==="hive"){ const hv=hiveCode(v);
    if(hv===o.colmeia){ feedback(true); u.phase="check"; render(); return setMsg(`Colmeia ${hv.slice(3)} confirmada. Bipe as peças que estão nela.`,"good"); }
    feedback(false); return setMsg(isHiveCode(hv) ? `Colmeia errada: ${hv.slice(3)}. As peças estão na ${o.colmeia.slice(3)}.` : `Bipe a etiqueta da colmeia ${o.colmeia.slice(3)}.`,"bad"); }
  if(u.phase==="check"){
    const x=its.find(x=>((!!x.ean && v===x.ean) || v===x.code) && (u.cnt[x.i]||0)<x.back) || its.find(x=>(!!x.ean && v===x.ean) || v===x.code);
    if(!x){ feedback(false); return setMsg(`Código ${v} não é de nenhuma peça deste pedido.`,"bad"); }
    if((u.cnt[x.i]||0)>=x.back){ feedback(false); return setMsg(`${x.code}: já foram bipadas as ${x.back} pç.`,"info"); }
    feedback(true); u.cnt[x.i]=(u.cnt[x.i]||0)+1; render();
    const left=its.reduce((s,y)=>s+Math.max(0,y.back-(u.cnt[y.i]||0)),0);
    return setMsg(left ? `${x.code}: ${u.cnt[x.i]}/${x.back} · faltam ${left} pç` : "Todas as peças conferidas. Toque para devolver ao estoque.", "good");
  }
  const L=usLoc(it); if(!L) return;
  if(v===code(L)){ feedback(true); u.done[it.i]=true; toast(`${it.code} devolvido em ${code(L)}`); return usNext(); }
  feedback(false); setMsg(LOC_RE.test(v) ? `Endereço errado: ${v}. Guarde em ${code(L)}.` : `Bipe a etiqueta do endereço ${code(L)}.`,"bad");
}

/* ================== Mapa do estoque ================== */
let animToken = 0, lastAnimKey = null;
/* Layout real do estoque (vista de cima, mesa de separação embaixo):
   ruas 1–4 em pé (corredor à direita de cada estante: lado A = estante da esquerda, lado B = da direita),
   ruas A e B deitadas no fundo (lado A = estante mais perto da mesa, lado B = mais ao fundo),
   o corredor da rua 4 sobe até o fundo, ao lado da estante pequena (rua 4, lado B). */
const MAP = (()=>{
  const W=320, H=484, rackW=22, aisle=40, x0=14;
  const vx = k => x0 + (k-1)*(rackW+aisle);            // estante em pé k (1..4)
  const aisleX = r => vx(r) + rackW + aisle/2;          // centro do corredor da rua r
  const vTop=180, vBot=394, front=416;
  const hW = vx(4) + rackW - x0;
  const H2 = {x:x0, y:44, w:hW, h:20}, H1 = {x:x0, y:110, w:hW, h:20};
  const ruaB = (H2.y+H2.h+H1.y)/2, ruaA = (H1.y+H1.h+vTop)/2;
  const small = {x:aisleX(4)+aisle/2-2, y:50, w:20, h:118};
  const mesa = {x:52, y:436, w:216, h:28};
  return {W,H,rackW,aisle,x0,vx,aisleX,vTop,vBot,front,H1,H2,ruaA,ruaB,small,mesa,start:{x:160,y:front}};
})();
function mapTarget(l){
  const M=MAP, cols=Math.max(1, l.ci+1, ...Object.values(BLOCKS).filter(b=>b.r===l.r && b.l===l.l).map(b=>colIdx(b.c2)+1));
  const f=(l.ci+0.5)/cols;
  if(typeof l.r==="number" && l.r>=1 && l.r<=4){
    const ax=M.aisleX(l.r);
    if(l.l==="B" && l.r===4){ const seg=M.small.h/cols, y=M.small.y+M.small.h-(l.ci+1)*seg; return {kind:"v", aisle:4, x:ax, y:y+seg/2, cell:{x:M.small.x, y:y+1, w:M.small.w, h:Math.max(3,seg-2)}}; }
    const L=M.vBot-M.vTop, seg=L/cols, y=M.vBot-(l.ci+1)*seg, rx = l.l==="A" ? M.vx(l.r) : M.vx(l.r+1);
    return {kind:"v", aisle:l.r, x:ax, y:y+seg/2, cell:{x:rx, y:y+1, w:M.rackW, h:Math.max(3,seg-2)}};
  }
  if(l.r==="A" || l.r==="B"){
    const seg=M.H1.w/cols, x=M.H1.x+l.ci*seg;
    const y = l.r==="A" ? M.ruaA : M.ruaB;
    const face = l.r==="A" ? (l.l==="B" ? M.H1 : {y:M.vTop-6, h:6}) : (l.l==="A" ? M.H1 : M.H2);
    return {kind:l.r, x:x+seg/2, y, cell:{x:x+1, y:face.y, w:Math.max(3,seg-2), h:face.h}};
  }
  return {kind:"x", x:M.start.x, y:M.start.y, cell:null};
}
function mapRoute(a, b){ // caminho pelos corredores (a = item anterior ou null = mesa)
  const M=MAP, N={S:M.start}, E=[];
  for(let k=1;k<=4;k++){ N["f"+k]={x:M.aisleX(k),y:M.front}; N["t"+k]={x:M.aisleX(k),y:M.ruaA}; E.push(["S","f"+k],["f"+k,"t"+k]); if(k<4) E.push(["f"+k,"f"+(k+1)],["t"+k,"t"+(k+1)]); }
  N.b4={x:M.aisleX(4),y:M.ruaB}; E.push(["t4","b4"]);
  if(a && ((a.kind==="v" && b.kind==="v" && a.aisle===b.aisle) || (a.kind===b.kind && (b.kind==="A"||b.kind==="B")))) return [a,b];
  const att = t => t.kind==="v" ? ["f"+t.aisle,"t"+t.aisle] : t.kind==="A" ? [1,2,3,4].map(k=>"t"+k) : t.kind==="B" ? ["b4"] : ["S"];
  N.src = a ? {x:a.x,y:a.y} : M.start; N.dst = {x:b.x,y:b.y};
  const adj={}, add=(u,v)=>{ (adj[u]||=[]).push(v); (adj[v]||=[]).push(u); };
  E.forEach(([u,v])=>add(u,v)); (a?att(a):["S"]).forEach(n=>add("src",n)); att(b).forEach(n=>add("dst",n));
  const d=(p,q)=>Math.abs(p.x-q.x)+Math.abs(p.y-q.y), dist={src:0}, prev={}, Q=new Set(Object.keys(N));
  while(Q.size){ let u=null; for(const q of Q) if(dist[q]!=null && (u===null || dist[q]<dist[u])) u=q; if(u===null || u==="dst") break; Q.delete(u);
    for(const v of adj[u]||[]){ const nd=dist[u]+d(N[u],N[v]); if(dist[v]==null || nd<dist[v]){ dist[v]=nd; prev[v]=u; } } }
  const path=[]; for(let u="dst"; u; u=prev[u]) path.unshift(N[u]);
  return path.filter((p,i)=>!i || p.x!==path[i-1].x || p.y!==path[i-1].y);
}
function mapSVG(item, prevItem){
  const M=MAP, l=item.loc, t=mapTarget(l), pv=prevItem?.loc ? mapTarget(prevItem.loc) : null;
  const pts=mapRoute(pv, t), d="M"+pts.map(p=>`${p.x} ${p.y}`).join(" L"), from=pts[0];
  const R=(r,cls)=>`<rect class="${cls}" x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" rx="2"/>`;
  let s=`<svg viewBox="0 0 ${M.W} ${M.H}" role="img" aria-label="Mapa do estoque: vá até a rua ${l.r}, lado ${l.l}, coluna ${l.c}, nível ${l.n}">`;
  s+=`<rect class="m-floor" x="0" y="0" width="${M.W}" height="${M.H}" rx="12"/>`;
  // corredor de destino destacado
  if(t.kind==="v") s+=`<rect class="m-lane" x="${M.aisleX(t.aisle)-M.aisle/2}" y="${t.aisle===4?M.H2.y:M.vTop}" width="${M.aisle}" height="${(t.aisle===4?M.vBot-M.H2.y:M.vBot-M.vTop)}"/>`;
  if(t.kind==="A"||t.kind==="B") s+=`<rect class="m-lane" x="${M.x0}" y="${(t.kind==="A"?M.H1.y+M.H1.h:M.H2.y+M.H2.h)}" width="${M.H1.w}" height="${t.kind==="A"?M.vTop-M.H1.y-M.H1.h:M.H1.y-M.H2.y-M.H2.h}"/>`;
  // paredes

  // estantes
  for(let k=1;k<=4;k++) s+=R({x:M.vx(k),y:M.vTop,w:M.rackW,h:M.vBot-M.vTop},"m-rack");
  s+=R(M.H1,"m-rack")+R(M.H2,"m-rack")+R(M.small,"m-rack");

  s+=`<text class="m-rua" x="${M.x0+6}" y="${M.ruaA+4}">RUA A</text><text class="m-rua" x="${M.x0+6}" y="${M.ruaB+4}">RUA B</text>`;
  s+=`<rect class="m-dock" x="${M.mesa.x}" y="${M.mesa.y}" width="${M.mesa.w}" height="${M.mesa.h}" rx="6"/><text class="m-dock-t" x="${M.mesa.x+M.mesa.w/2}" y="${M.mesa.y+18}" text-anchor="middle">MESA DE SEPARAÇÃO</text>`;
  if(pv) s+=`<circle class="m-prev" cx="${from.x}" cy="${from.y}" r="4"/>`;
  s+=`<path id="route" class="m-route" d="${d}"/><circle class="m-ring" cx="${t.x}" cy="${t.y}" r="9"/><circle class="m-pin" cx="${t.x}" cy="${t.y}" r="6.5"/><circle id="op" class="m-op" cx="${from.x}" cy="${from.y}" r="6"/>`;
  return s+`</svg>`;
}
function animateRoute(force){
  const card = document.getElementById("map"); if(!card) return;
  const path = document.getElementById("route"), op = document.getElementById("op");
  card.classList.remove("arrived");
  const len = path.getTotalLength(), tok = ++animToken, key = state.oid+":"+state.idx;
  const finish = () => { path.style.strokeDasharray=""; path.style.strokeDashoffset=0; const p=path.getPointAtLength(len); op.setAttribute("cx",p.x); op.setAttribute("cy",p.y); card.classList.add("arrived"); };
  if(matchMedia("(prefers-reduced-motion: reduce)").matches || (!force && lastAnimKey===key)) return finish();
  lastAnimKey = key;
  path.style.strokeDasharray = len; path.style.strokeDashoffset = len;
  const dur = Math.min(2400, Math.max(1000, len*4.2)), t0 = performance.now();
  const ease = x => x<.5 ? 2*x*x : 1-Math.pow(-2*x+2,2)/2;
  (function step(now){
    if(tok!==animToken) return;
    const k = Math.min(1,(now-t0)/dur), e = ease(k);
    path.style.strokeDashoffset = len*(1-e);
    const p = path.getPointAtLength(e*len); op.setAttribute("cx",p.x); op.setAttribute("cy",p.y);
    k<1 ? requestAnimationFrame(step) : finish();
  })(t0);
}
function elevSVG(l){
  const nMax = Math.max(l.n, ...Object.values(BLOCKS).filter(b=>b.r===l.r && b.l===l.l).map(b=>b.n2));

  for(let k=1;k<=nMax;k++){ const y=74-k*h; s+=`<rect class="e-lvl${k===l.n?" on":""}" x="14" y="${y+1}" width="34" height="${Math.max(1.5,h-2)}" rx="${Math.min(2,h/4)}"/>`;

    <div class="tvgrid">${TV_CANAIS.map(([c,t])=>tvColumn(c,t)).join("")}</div>`;
  fillNames(app); tvFit();
  const snd=document.getElementById("tvSound"); if(snd) snd.onclick=()=>{ unlockAudio(); chime(true); setTimeout(render, 300); };

  // a cada minuto: busca tudo de novo (garante a fila mesmo se o tempo real cair) e redesenha
  if(!tvRefreshT) tvRefreshT=setInterval(()=>{ if(state.view!=="tv" && myRole()!=="painel"){ clearInterval(tvRefreshT); tvRefreshT=null; return; }
    (window.psRefresh?window.psRefresh():Promise.resolve()).then(()=>{ synced=true; }, ()=>{}).finally(()=>rerender()); }, 60000);
}
/* Mostra só as linhas da fila que cabem na tela e conta o resto em "+ N pedidos" */
function tvFit(){
  // números dos indicadores: diminuem só o necessário para caber no quadrinho
  document.querySelectorAll(".tvkpis b").forEach(b=>{ b.style.fontSize=""; let f=parseFloat(getComputedStyle(b).fontSize), n=0;
    while(b.scrollWidth>b.clientWidth+1 && n++<25){ f*=.94; b.style.fontSize=f+"px"; } });
  document.querySelectorAll(".tvlist.fit").forEach(l=>{
  const col=l.closest(".tvcol"), rows=[...l.querySelectorAll(".tvrow")], box=col&&col.querySelector(".tvdone"), done=box?[...box.querySelectorAll(".tvrow")]:[];
  rows.forEach(r=>r.hidden=false); done.forEach(r=>r.hidden=false); if(box) box.hidden=false; let hid=0;
  const fitN=()=>{ const lb=l.getBoundingClientRect().bottom+1; let n=0; for(const r of rows){ if(r.getBoundingClientRect().bottom<=lb) n++; else break; } return n; };
  // a fila tem prioridade: se não couberem ao menos 4 pedidos, "Últimos separados" encolhe para 1 linha (e só some se nem 2 couberem)
  for(let k=done.length-1; k>=1 && fitN()<Math.min(rows.length,4); k--) done[k].hidden=true;
  if(box && done.length && fitN()<Math.min(rows.length,2)) box.hidden=true;
  for(let k=rows.length-1; k>=0 && l.scrollHeight>l.clientHeight+1; k--){ rows[k].hidden=true; hid++; }
  const total=+l.dataset.total||0, shown=rows.length-hid, more=l.nextElementSibling;
  if(more && more.hasAttribute("data-more")) more.textContent = total>shown ? `+ ${total-shown} pedido${total-shown===1?"":"s"} na fila` : "";
}); }
window.addEventListener("resize", ()=>{ if(document.querySelector(".tvgrid")) tvFit(); });
setInterval(()=>{ const c=document.getElementById("tvClock"); if(c) c.textContent=new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}); }, 5000);

/* ================== Separação em lote (e-commerce) ==================
   O separador escolhe "por canal" ou "por transportadora" e marca quais; o sistema abre
   o pedido mais antigo do grupo e, ao concluir na mesa, oferece o próximo até acabar. */
const LOTE_KEY="ps-lote";
state.lote = (()=>{ try{ return JSON.parse(localStorage.getItem(LOTE_KEY)||"null"); }catch(e){ return null; } })();
const saveLote = () => { try{ state.lote ? localStorage.setItem(LOTE_KEY, JSON.stringify(state.lote)) : localStorage.removeItem(LOTE_KEY); }catch(e){} };
const LOTE_BY = { canal:{t:"Canal", f:"origem"}, transportadora:{t:"Transportadora", f:"transportadora"} };
const loteVal = (o, by) => o[LOTE_BY[by].f] || (by==="canal" ? "Site" : "Sem transportadora");
const loteMatch = (o, L=state.lote) => !!L && isEco(o) && L.vals.includes(loteVal(o, L.by));
function lotePending(L=state.lote){ // pedidos do lote ainda por separar (os meus em andamento primeiro)
  return ORDERS.filter(o=>loteMatch(o,L) && pickList(o).length && !o.mzCancelado && !o.mzMudou &&
      (o.status==="aguardando" || (o.status==="separando" && (!o.startedBy || o.startedBy===ME.id))))
    .sort((a,b)=>((b.status==="separando")-(a.status==="separando")) || (a.createdAt||0)-(b.createdAt||0));
}
function loteNext(){
  const nx=lotePending()[0];
  if(nx){ openOrder(nx.id); return true; }
  toast(`Lote concluído · ${state.lote?.done||0} pedido(s) separados`); state.lote=null; saveLote(); state.view="orders"; render(); return false;
}
function loteBoxHTML(){
  const L=state.lote;
  if(L){ const n=lotePending().length;
    return `<div class="lotebox on"><div><div class="eyebrow">Separação em lote · ${esc(LOTE_BY[L.by].t)}</div><b>${L.vals.map(esc).join(" · ")}</b><small>${L.done||0} separado(s) · ${n} restante(s)</small></div>
      <div class="lotebtns"><button class="btn primary sm" id="loteGo" ${n?"":"disabled"}>${n?"Continuar":"Sem pedidos"}</button><button class="btn ghost sm" id="loteEnd">Encerrar</button></div></div>`; }

}
function bindLote(){
  const nw=document.getElementById("loteNew"); if(nw) nw.onclick=openLoteModal;
  const go=document.getElementById("loteGo"); if(go) go.onclick=()=>loteNext();
  const en=document.getElementById("loteEnd"); if(en) en.onclick=()=>{ state.lote=null; saveLote(); toast("Lote encerrado"); render(); };

function openLoteModal(){
  const avail = ORDERS.filter(o=>isEco(o) && ecoOk(o) && pickList(o).length && !o.mzCancelado && !o.mzMudou && (o.status==="aguardando" || (o.status==="separando" && o.startedBy===ME.id)));
  let by="transportadora", sel=new Set();
  const ov=document.createElement("div"); ov.className="modal"; document.body.appendChild(ov); scanbar.hidden=true;
  const close=()=>{ ov.remove(); render(); };
  const draw=()=>{
    const groups={}; avail.forEach(o=>{ const v=loteVal(o,by); groups[v]=(groups[v]||0)+1; });
    const list=Object.entries(groups).sort((a,b)=>b[1]-a[1]);
    ov.innerHTML=`<div class="mbox lotem" role="dialog" aria-modal="true" aria-label="Separação em lote"><h2>Separação em lote</h2>
      <p>Separar por:</p>
      <div class="seg lotetype">${Object.entries(LOTE_BY).map(([k,v])=>`<button data-by="${k}" aria-pressed="${by===k}">${v.t}</button>`).join("")}</div>
      <p style="margin-top:12px">Marque ${by==="canal"?"os canais":"as transportadoras"}:</p>
      <div class="lotelist">${list.map(([v,n])=>`<label class="loteopt"><input type="checkbox" value="${esc(v)}" ${sel.has(v)?"checked":""}><span>${by==="transportadora"&&TRANSP[v]?.logo?`<img class="tlogo" src="${TRANSP[v].logo}" alt="${esc(v)}" title="${esc(v)}">`:esc(v)}</span><b class="tnum">${n}</b></label>`).join("") || `<div class="empty">Nenhum pedido do e-commerce para separar.</div>`}</div>
      <div class="mact"><button class="btn ghost" id="lmNo">Cancelar</button><button class="btn primary" id="lmGo" ${sel.size?"":"disabled"}>Iniciar ${sel.size?`· ${list.filter(([v])=>sel.has(v)).reduce((a,[,n])=>a+n,0)} pedido(s)`:""}</button></div></div>`;
    ov.querySelectorAll("[data-by]").forEach(b=>b.onclick=()=>{ if(by!==b.dataset.by){ by=b.dataset.by; sel=new Set(); draw(); } });
    ov.querySelectorAll(".loteopt input").forEach(c=>c.onchange=()=>{ c.checked?sel.add(c.value):sel.delete(c.value); draw(); });
    ov.querySelector("#lmNo").onclick=close;

  };
  ov.onclick=e=>{ if(e.target===ov) close(); };
  draw();
}

/* Botão "Atualizar" da fila: busca os pedidos de novo no servidor */
let refreshing=false;
async function refreshQueue(){
  if(refreshing) return; refreshing=true;
  const b=document.getElementById("refreshQ"); if(b){ b.classList.add("spin"); b.disabled=true; }
  try{
    if(!window.psRefresh){ location.reload(); return; }
    await Promise.race([window.psRefresh(), new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),15000))]);
    synced=true; checkNewOrders();
    const q=ORDERS.filter(o=>(o.status==="aguardando"||o.status==="separando") && pickList(o).length).length;
    render(); toast(`Fila atualizada · ${q} pedido${q===1?"":"s"} para separar`);
  }catch(e){ toast("Não foi possível atualizar. Verifique a internet."); render(); }
  finally{ refreshing=false; }
}
async function restartOrder(id, reopen){
  const o=ORDERS.find(x=>x.id===id); if(!o) return;
  const r=res(o), pl=pickList(o), done=pl.filter(x=>r[x.i].status!=="pend").length;
  const ok=await askModal({title:`Reiniciar a separação #${o.num}?`, okText:"Reiniciar",
    text:`O que já foi coletado (${done} de ${pl.length} itens) volta a zero e o tempo de picking recomeça.${o.tray&&o.trayStatus==="separando"?` A ${esc(trayLabel(o.tray))} é liberada; bipe a bandeja de novo.`:""} Devolva as peças já coletadas aos locais.`});
  if(!ok) return;
  patchOrder(o.id, {status:"aguardando", res:o.items.map(()=>({status:"pend",got:0})), startedAt:null, startedBy:"",
    ...(o.tray&&o.trayStatus==="separando"?{tray:"", trayStatus:""}:{}),
    restarts:[...(o.restarts||[]), {at:Date.now(), by:ME.id||"", done}]});
  toast(`Separação #${o.num} reiniciada`);
  if(reopen) openOrder(o.id); else { state.view="orders"; render(); }
}
async function deleteOrder(id){
  const o=ORDERS.find(x=>x.id===id); if(!o) return;
  const reason=await askModal({title:`Excluir a separação #${o.num}?`, okText:"Excluir separação", danger:true,
    text:`O pedido de <b>${esc(o.client)}</b> sai da fila de separação. Escreva o motivo da exclusão:`,
    input:{placeholder:"Ex.: pedido cancelado pelo cliente, pré-venda duplicada…", min:5, minMsg:"Escreva o motivo (pelo menos 5 letras)."}});
  if(!reason) return;
  patchOrder(o.id, {status:"excluido", deletedAt:Date.now(), deletedBy:ME.id||"", deleteReason:reason,
    ...(o.tray&&["separando","mesa"].includes(o.trayStatus)?{trayStatus:"livre"}:{})});
  ORDERS=ORDERS.filter(x=>x.id!==o.id); DELETED=[...DELETED, o];
  toast(`Separação #${o.num} excluída`);
  state.view="orders"; render(); scrollTo(0,0);
}

function renderPick(){

const scanbar=document.getElementById("scanbar"), scanIn=document.getElementById("scan"), scanMsg=document.getElementById("scanmsg");

function feedback(ok){

  clearTimeout(msgT); msgT=setTimeout(()=>scanbar.classList.remove("good","bad"),700);

  try{ if(on && !wakeLock && navigator.wakeLock){ wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener?.("release", ()=>{ wakeLock=null; }); }
       if(!on && wakeLock){ await wakeLock.release(); wakeLock=null; } }catch(e){ wakeLock=null; }
}
