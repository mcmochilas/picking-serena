<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Picking Serena</title>
<meta name="theme-color" content="#0F151C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Picking Serena">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
/* Login */
#lgOverlay{position:fixed;inset:0;z-index:50;background:var(--bg,#EDF0F3);display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));overflow:auto}
.lg-card{width:100%;max-width:380px;background:var(--surface,#fff);border:1px solid var(--line,#D4DBE3);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:14px;color:var(--ink,#15202B)}
.lg-brand{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:18px;letter-spacing:.04em;text-transform:uppercase}
.lg-brand span{color:var(--muted,#5A6978)}
.lg-card h1{margin:0;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:30px}
#lgForm{display:flex;flex-direction:column;gap:12px}
#lgForm label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted,#5A6978)}
#lgForm input{height:46px;border:1px solid var(--line,#D4DBE3);border-radius:10px;padding:0 12px;font:16px system-ui,sans-serif;background:var(--bg,#EDF0F3);color:var(--ink,#15202B);text-transform:none;letter-spacing:0}
#lgForm input:focus{outline:2px solid var(--route,#2A5BC8);outline-offset:0}
.lg-btn{height:50px;border:0;border-radius:12px;background:var(--accent,#F2A900);color:#1A1405;font:600 16px system-ui,sans-serif;cursor:pointer}
.lg-btn:disabled{opacity:.6}
.lg-links{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.lg-links button{border:0;background:none;color:var(--route,#2A5BC8);font:600 14px system-ui,sans-serif;cursor:pointer;padding:4px 0;text-decoration:underline;text-underline-offset:3px}
.lg-err{background:var(--bad-soft,#FBE3E0);color:var(--bad,#C0392B);border-radius:10px;padding:10px 12px;font-weight:600;font-size:14px}
.lg-ok{background:var(--ok-soft,#DDF2E8);color:var(--ok,#1D845A);border-radius:10px;padding:10px 12px;font-weight:600;font-size:14px}
.lg-hint{margin:0;font-size:13px;color:var(--muted,#5A6978)}
.me .logout{color:var(--route,#2A5BC8)}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script src="/js/config.js"></script>
<script src="/js/backend.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: single phone-width column; sticky task bar; map card is the hero of the picking screen. */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --ink:#15202B; --muted:#5A6978; --line:#D4DBE3;
  --accent:#F2A900; --accent-soft:#FFF1C7; --accent-ink:#7A5300;
  --floor:#E2E7ED; --rack:#B6C2CE; --route:#2A5BC8; --ok:#1D845A; --ok-soft:#DDF2E8; --bad:#C0392B; --bad-soft:#FBE3E0;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F151C; --surface:#18212B; --ink:#E6ECF2; --muted:#93A2B2; --line:#2A3542;
  --accent:#F5B71A; --accent-soft:#3A2F12; --accent-ink:#F5C449;
  --floor:#1B2530; --rack:#3A4858; --route:#6F9BFF; --ok:#3CC488; --ok-soft:#163327; --bad:#F06A5B; --bad-soft:#3A1D1A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F151C; --surface:#18212B; --ink:#E6ECF2; --muted:#93A2B2; --line:#2A3542;
  --accent:#F5B71A; --accent-soft:#3A2F12; --accent-ink:#F5C449;
  --floor:#1B2530; --rack:#3A4858; --route:#6F9BFF; --ok:#3CC488; --ok-soft:#163327; --bad:#F06A5B; --bad-soft:#3A1D1A; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.app{max-width:520px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--route);outline-offset:2px}
.tnum{font-variant-numeric:tabular-nums}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.bar h1{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.01em;margin:0;line-height:1.1;text-wrap:balance}
.bar .sub{color:var(--muted);font-size:13px}
.back{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.grow{flex:1;min-width:0}
.badge{font-family:var(--mono);font-size:12px;font-weight:700;padding:4px 8px;border-radius:6px;background:var(--surface);border:1px solid var(--line);white-space:nowrap}

.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.section{display:flex;flex-direction:column;gap:10px;margin-top:18px}

/* Orders */
.shift{display:flex;gap:10px;margin-top:16px}
.shift > div{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.shift b{display:block;font-family:var(--display);font-size:26px;line-height:1}
.order{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;position:relative;overflow:hidden}
.order:focus-visible{outline:3px solid var(--route);outline-offset:2px}
.order.urgent{border-left:5px solid var(--accent)}
.order .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.order .num{font-family:var(--mono);font-weight:700;font-size:15px}
.order .client{font-weight:600;font-size:16px}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:13px}
.chip{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:99px;white-space:nowrap}
.chip.urg{background:var(--accent-soft);color:var(--accent-ink)}
.chip.norm{background:var(--floor);color:var(--muted)}
.chip.done{background:var(--ok-soft);color:var(--ok)}
.chip.prog{background:var(--floor);color:var(--route)}
.prog-bar{height:5px;border-radius:3px;background:var(--floor);overflow:hidden}
.prog-bar i{display:block;height:100%;background:var(--ok);border-radius:3px;transition:width .4s}

/* Picking */
.steps{display:flex;gap:4px;margin-top:12px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.steps i.ok{background:var(--ok)} .steps i.miss{background:var(--bad)} .steps i.cur{background:var(--accent)}

.loc{display:flex;align-items:center;gap:14px;margin-top:14px}
.loc-code{font-family:var(--mono);font-weight:700;font-size:clamp(22px,7vw,36px);letter-spacing:.02em;line-height:1}
.loc-code span{color:var(--muted);font-weight:500}
.noloc .loc-code{font-family:var(--display);font-size:clamp(20px,6vw,28px);color:var(--warn,#C27C0E)}
.spotbtn{width:100%;margin-top:8px}
.ordwrap{position:relative;display:flex;flex-direction:column}
.ordwrap.acts1 .order .meta{padding-right:48px}
.ordwrap.acts2 .order .meta{padding-right:96px}
.ord-acts{position:absolute;right:12px;bottom:12px;display:flex;gap:8px;z-index:1}
.icbtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg,var(--surface));color:var(--muted);display:grid;place-items:center;cursor:pointer;padding:0}
.icbtn:active{transform:scale(.95)}
.icbtn.del{color:var(--bad)}
.icbtn svg{width:18px;height:18px}
.back.del{color:var(--bad)}
.modal{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:16px}
.mbox{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:18px;width:min(440px,100%);box-shadow:0 12px 40px rgba(0,0,0,.4)}
.mbox h2{margin:0 0 8px;font-size:20px}
.mbox p{margin:0 0 10px;font-size:14px;color:var(--muted);line-height:1.45}
.mbox textarea{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:10px;background:var(--bg,transparent);color:var(--ink);padding:10px;font:inherit;font-size:15px;resize:vertical}
.mbox .merr{color:var(--bad);font-size:13px;min-height:18px;margin-top:4px}
.mbox .mact{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.delnote{font-size:12px;color:var(--bad);line-height:1.4}
.newuser{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.newuser .tin{width:100%}
@media (min-width:900px){ .newuser{grid-template-columns:1.2fr 1.4fr 1fr 1fr auto} }
.okbox{background:var(--ok-soft);color:var(--ink);border-radius:8px;padding:8px 10px;font-size:13px;margin:6px 0}
.pwbox{display:inline-flex;gap:6px;align-items:center}
.mono{font-family:var(--mono)}
.alerts{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;margin:10px 0 4px}
.alerts .al-h{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.alerts .al-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px;font-size:13px}
.alerts .al-ok{color:var(--ok);font-weight:600}
.alerts .al-bad{color:var(--bad);line-height:1.4}
.alerts .al-mute{color:var(--muted)}
.alerts.compact{padding:6px 12px}
.alerts.compact .al-h{display:none}
.alerts.compact .al-row{margin-top:0}
.spotline{margin-top:8px;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spotline.on{color:var(--ink);background:var(--accent-soft);border-radius:8px;padding:8px 10px}
.noloc-t{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.4}
.loc-parts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.loc-parts div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 8px}
.loc-parts small{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.loc-parts b{font-family:var(--display);font-size:20px;line-height:1.1}

.map-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px;margin-top:12px;position:relative}
.map-card svg{display:block;width:100%;height:auto;max-width:100%}
.map-tools{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:2px 4px 8px}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.replay{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 10px;font-size:13px;font-weight:600;white-space:nowrap}

.m-floor{fill:var(--floor)}
.m-cell{fill:var(--rack)}
.m-cell.target{fill:var(--accent)}
.m-lane{fill:var(--accent);opacity:0}
.m-txt{fill:var(--muted);font-family:var(--mono);font-size:10px}
.m-ais{fill:var(--ink);font-family:var(--display);font-weight:700;font-size:16px}
.m-dock{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.m-dock-t{fill:var(--muted);font-family:var(--body);font-weight:600;font-size:9px;letter-spacing:.1em}
.m-route{fill:none;stroke:var(--route);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.m-op{fill:var(--route);stroke:var(--surface);stroke-width:2.5}
.m-pin{fill:var(--accent);stroke:var(--ink);stroke-width:2}
.m-ring{fill:none;stroke:var(--accent);stroke-width:2.5;opacity:0;transform-box:fill-box;transform-origin:center}
.m-prev{fill:var(--surface);stroke:var(--route);stroke-width:2}
.arrived .m-lane{opacity:.16;transition:opacity .5s}
.arrived .m-ring{animation:ring 1.6s ease-out infinite}
.arrived .m-cell.target{animation:blink 1.6s ease-in-out infinite}
@keyframes ring{0%{opacity:.9;transform:scale(.6)}100%{opacity:0;transform:scale(2.6)}}
@keyframes blink{50%{opacity:.55}}

.elev{flex:none}
.e-lvl{fill:var(--floor);stroke:var(--rack);stroke-width:1.5}
.e-lvl.on{fill:var(--accent);stroke:var(--ink)}
.e-post{fill:var(--rack)}
.e-t{fill:var(--muted);font-family:var(--mono);font-size:8px}

.product{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px;display:flex;flex-direction:column;gap:12px}
.product .name{font-weight:600;font-size:18px;line-height:1.25}
.product .ids{font-family:var(--mono);font-size:12px;color:var(--muted)}
.qty-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stepper button{width:48px;height:48px;border:0;background:var(--bg);font-size:22px;font-weight:600}
.stepper output{min-width:64px;text-align:center;font-family:var(--display);font-size:28px;font-weight:700}
.want{color:var(--muted);font-size:14px}
.want b{color:var(--ink);font-family:var(--display);font-size:22px}
.actions{display:flex;gap:8px}
.btn{border:0;border-radius:12px;padding:15px 16px;font-weight:600;font-size:16px;min-height:52px}
.btn.primary{flex:1;background:var(--accent);color:#1A1405}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--bad)}

.list{margin-top:18px;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.li{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line);cursor:pointer}
.li:first-child{border-top:0}
.li:focus-visible{outline:3px solid var(--route);outline-offset:-3px}
.li.cur{background:var(--accent-soft)}
.li .lc{font-family:var(--mono);font-size:13px;font-weight:700;width:86px;flex:none}
.li .ln{flex:1;min-width:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12px;font-weight:700;border:2px solid var(--line)}
.st.ok{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.st.miss{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.st.part{background:var(--accent);border-color:var(--accent);color:#1A1405}

/* Done */
.done:not(.chip){text-align:center;padding-block:36px 8px;display:flex;flex-direction:column;align-items:center;gap:10px}
.done .big{width:76px;height:76px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center}
.done h2{font-family:var(--display);font-size:30px;margin:0}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;margin-top:8px}
.summary div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 6px}
.summary b{display:block;font-family:var(--display);font-size:28px;line-height:1}
.summary small{color:var(--muted);font-size:12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.note{font-size:12px;color:var(--muted);margin-top:16px;text-align:center}

/* Scan flow */
.app.picking{padding-bottom:92px}
.phases{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px}
.phase{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;color:var(--muted)}
.phase .n{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;background:var(--floor);flex:none}
.phase.on{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.phase.on .n{background:var(--accent);color:#1A1405}
.phase.ok{color:var(--ok)} .phase.ok .n{background:var(--ok);color:var(--surface)}
.instr{display:flex;gap:12px;align-items:center;padding:12px;border-radius:12px;background:var(--bg);border:1px dashed var(--line)}
.instr svg{flex:none;color:var(--accent-ink)}
.instr b{font-family:var(--mono)}
.counter{display:flex;align-items:baseline;gap:6px;font-family:var(--display);font-weight:700;line-height:1}
.counter .c{font-size:56px} .counter .t{font-size:28px;color:var(--muted)}
.cbar{height:8px;border-radius:4px;background:var(--floor);overflow:hidden}
.cbar i{display:block;height:100%;background:var(--ok);transition:width .25s}
.locok{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ok);font-weight:600}
.locok b{font-family:var(--mono)}
.demo{border:0;background:none;color:var(--route);font-weight:600;font-size:13px;padding:4px 0;text-decoration:underline;text-underline-offset:3px;align-self:flex-start}
.undo{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600}

.scanbar{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));transition:background .2s}
.scanbar .in{max-width:520px;margin:0 auto;display:flex;gap:8px;align-items:center}
.scanbar.good{background:var(--ok-soft)} .scanbar.bad{background:var(--bad-soft)}
.cam{display:flex;align-items:center;gap:6px;border:0;border-radius:12px;background:var(--ink);color:var(--bg);padding:0 14px;height:48px;font-weight:600;flex:none}
.scanfield{flex:1;min-width:0;position:relative}
.scanfield input{width:100%;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 44px 0 12px;font-family:var(--mono);font-size:15px}
.scanfield input:focus{outline:2px solid var(--route);outline-offset:0}
.scanfield .kbd{position:absolute;right:4px;top:4px;width:40px;height:40px;border:0;background:none;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.scanfield .kbd.on{color:var(--route)}
.scanmsg{max-width:520px;margin:0 auto 6px;font-size:13px;font-weight:600;min-height:18px}
.scanmsg.good{color:var(--ok)} .scanmsg.bad{color:var(--bad)} .scanmsg.info{color:var(--muted)}

/* Estoque */
.phases.three{grid-template-columns:repeat(3,1fr)}
.subtabs{margin-top:12px;width:max-content;max-width:100%;overflow-x:auto}
.tin{height:40px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);padding:0 10px;font:inherit;width:100%;min-width:0}
.tin:focus{outline:2px solid var(--route);outline-offset:0}
.tin.mono{font-family:var(--mono);font-size:13px}
.tin.sm{height:34px;width:150px}
select.tin{width:auto}
.hint{color:var(--muted);font-size:13px;margin:0}
.ruas{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
@media (max-width:700px){.ruas{grid-template-columns:repeat(3,1fr)}}

.qcard ul{margin:6px 0 0;padding-left:18px}
.mini{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;font-size:12px;font-weight:600}
.hive{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.slot{aspect-ratio:1;max-width:100%;border-radius:6px;border:1px solid var(--line);background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--mono);font-size:10px;color:var(--muted);line-height:1.1;text-align:center;min-width:0}
.slot b{font-size:9px;color:var(--ink)}
.slot.res{background:var(--floor);border-style:dashed}
.slot.envio{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.slot.enc{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.slot.target{background:var(--accent);border-color:var(--ink);color:#1A1405;animation:blink 1.4s ease-in-out infinite}
.slot.target b{color:#1A1405}
.legend2{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.legend2 i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}
.chip.enc{background:var(--accent-soft);color:var(--accent-ink)}
.chip.sent{background:var(--floor);color:var(--muted)}
.empty{color:var(--muted);font-size:14px;padding:8px 0}
.banner{margin-top:12px;background:var(--accent-soft);color:var(--accent-ink);border-radius:10px;padding:10px 12px;font-size:13px;font-weight:600}
.hivebig{margin-top:14px}
.store-code{font-family:var(--mono);font-weight:700;font-size:48px;line-height:1}

@media (prefers-reduced-motion: reduce){
  .arrived .m-ring,.arrived .m-cell.target{animation:none}
  .arrived .m-ring{opacity:.6;transform:scale(1.6)}
}
</style>

<body>
<div class="app" id="app"></div>
<div class="toast" id="toast" hidden></div>
<div class="alertbar" id="alertbar" role="alert" hidden></div>
<div class="scanbar" id="scanbar" hidden>
  <div class="scanmsg info" id="scanmsg" aria-live="polite"></div>
  <div class="in">
    <button class="cam" id="cam" aria-label="Ler código com a câmera"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h3l2-2.5h6L17 7h3v12H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Câmera</button>
    <div class="scanfield">
      <input id="scan" inputmode="none" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Leitor pronto: bipe o código" aria-label="Código lido">
      <button class="kbd" id="kbd" aria-label="Digitar código manualmente"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h.01M11 10h.01M15 10h.01M7 14h10"/></svg></button>
    </div>
  </div>
</div>
<input type="file" id="camfile" accept="image/*" capture="environment" hidden>

<script>
function brNum(s){ return parseFloat(String(s).replace(/[^\d,.-]/g,"").replace(/\./g,"").replace(",", ".")) || 0; }
function parsePresale(raw){
  const cells = raw.filter(c=>c.s && c.s.trim()).map(c=>({s:c.s.trim(), x:c.x, y:c.y, w:c.w, cx:c.x+c.w/2}));
  const lines=[];
  [...cells].sort((a,b)=>b.y-a.y||a.x-b.x).forEach(c=>{ let L=lines.find(l=>Math.abs(l.y-c.y)<2.5); if(!L){ L={y:c.y,cells:[]}; lines.push(L); } L.cells.push(c); });
  const all = lines.map(l=>l.cells.sort((a,b)=>a.x-b.x).map(c=>c.s).join(" ")).join("\n");
  const m = re => { const r=all.match(re); return r ? r.slice(1).map(x=>x && x.trim()) : null; };
  // número: "Pré-venda - 123" ou "Orçamento - 123" (também aceita "Orçamento nº 123", "ORÇAMENTO: 123")
  const num = m(/(?:Pr[ée]\s*-?\s*venda|Or[çc]amento)\s*(?:n[º°o.]*\s*)?[-–:#]?\s*(\d+)/i)?.[0];
  const dt = m(/Data:\s*([\d/]+)\s*Hora:\s*([\d:]+)/) || [];
  const cli = m(/Cliente:\s*(\d+)\s*-\s*(.+?)(?:\s+CPF\/CNPJ:.*)?$/m) || [];
  const end = m(/Endere[çc]o:\s*(.+)$/m)?.[0] || "";
  const cm = end.match(/([^,]+?)\s+-\s+([A-Z]{2})\s*(?:,\s*[\d.-]+)?\s*$/);
  const seller = m(/Vendedor:\s*(.+?)(?:\s+Tabela:.*)?$/m)?.[0] || "";
  const obs = m(/Observa[çc][õo]es:\s*(.+)$/m)?.[0] || "";
  const total = brNum(m(/VALOR TOTAL:\s*R\$\s*([\d.,]+)/)?.[0] || 0);

  const hCod = cells.find(c=>/^C[óo]d/.test(c.s));
  if(!num || !hCod) throw new Error("formato");
  const yH = hCod.y;
  const hdr = cells.filter(c=>Math.abs(c.y-yH)<3);
  const H = re => hdr.find(c=>re.test(c.s));
  const cols = [["code",hCod],["desc",H(/^Descri/)],["un",H(/^UN$/)],["qty",H(/^Quant/)],["vb",H(/^Valor Bruto/)],["dp",H(/^Desconto/)],["vl",H(/^Valor L/)],["vt",H(/^Valor Total/)]].filter(c=>c[1]);
  const ends = cells.filter(c=>/^(SUBTOTAL|QTD\. TOTAL|REFER)/.test(c.s)).map(c=>c.y);
  const yE = ends.length ? Math.max(...ends) : -Infinity;
  const region = cells.filter(c=>c.y<yH-2 && c.y>yE+2).map(c=>{
    let best=null,d=1e9; for(const [k,h] of cols){ const dd=Math.abs(c.cx-(h.x+h.w/2)); if(dd<d){d=dd;best=k;} } return {...c,col:best};
  });
  const rows = region.filter(c=>c.col==="code" && /^\d{2,12}$/.test(c.s)).sort((a,b)=>b.y-a.y).map(c=>({y:c.y, code:c.s, cells:[]}));
  if(!rows.length) throw new Error("sem itens");
  region.filter(c=>!(c.col==="code" && rows.some(r=>r.code===c.s && r.y===c.y))).forEach(c=>{
    let best=rows[0]; for(const r of rows) if(Math.abs(r.y-c.y)<Math.abs(best.y-c.y)) best=r; best.cells.push(c);
  });
  const items = rows.map(r=>{
    const desc = r.cells.filter(c=>c.col==="desc").sort((a,b)=>b.y-a.y||a.x-b.x);
    const ean = desc.find(c=>/^\d{8,14}$/.test(c.s))?.s || "";
    const name = desc.filter(c=>c.s!==ean).map(c=>c.s).join(" ");
    const g = k => r.cells.find(c=>c.col===k)?.s;
    return {code:r.code, name, ean, un:g("un")||"UN", qty:Math.round(brNum(g("qty"))), price:brNum(g("vl")||g("vb")), lineTotal:brNum(g("vt"))};
  });
  return { num, date:dt[0]||"", time:dt[1]||"", clientCode:cli[0]||"", client:cli[1]||"", city: cm ? `${cm[1].trim()} - ${cm[2]}` : "", seller, obs, total, items };
}

/* ================== Dados e utilidades ================== */
const HIVE = Array.from({length:24},(_,i)=>"CM-"+String(i+1).padStart(2,"0"));
const MODES = { total:{t:"Envio total", c:"norm"}, parcial:{t:"Envio parcial", c:"prog"}, aguarda:{t:"Aguarda encomenda", c:"urg"} };
function statusInfo(o){
  switch(o.status){
    case "aguardando": return {t:"Aguardando separação", c:"norm"};
    case "separando": return {t:"Em separação", c:"prog"};
    case "pronto_envio": return {t: o.mode==="aguarda" ? `Encomenda chegou · retirar da colmeia ${o.colmeia||""}` : o.remessa===2 ? "Encomenda chegou" : "Finalizado · na mesa", c:"done"};
    case "enc_pendente": return {t:"1º envio feito · aguardando encomenda", c:"enc"};
    case "na_colmeia": return {t:"Na colmeia · aguardando encomenda", c:"enc"};
    case "na_mesa": return {t:`Na mesa · guardar na colmeia ${o.colmeia||""}`, c:"prog"};
    case "lavagem": return o.trayStatus==="lavagem" ? {t:`A caminho da mesa · bandeja ${o.tray||""}`, c:"prog"} : {t:"A caminho da mesa", c:"prog"};
    case "excluido": return {t:"Excluído", c:"bad"};
    default: return {t:"Finalizado", c:"sent"};
  }
}
const usesHive = o => o.mode==="aguarda" && o.status!=="enviado" && !!o.colmeia;
function normalize(o){ // compatibilidade com pedidos gravados na versão anterior
  if(o.status==="aguardando_envio") o.status="pronto_envio";
  if(o.status==="aguardando_encomenda") o.status="na_colmeia";
  if(o.mode==="parcial" && o.colmeia && !o.v2) o.mode="aguarda";
  if(o.mode!=="aguarda") delete o.colmeia;
  return o;
}
// Cadastro de endereços de estoque (no sistema real vem do ERP/WMS)
const TRAYS = Array.from({length:30},(_,i)=>"BJ-"+String(i+1).padStart(2,"0"));
/* Mesa-001: local compartilhado para itens grandes que não cabem na bandeja, ou para o pedido inteiro quando não há bandeja livre */
const MESA_SPOT = "MESA-001";
const normSpot = v => /^MESA-?0*1$/.test(v) ? MESA_SPOT : v;
const isTrayCode = v => /^BJ-\d{2}$/.test(v) || v===MESA_SPOT;
const bigOnMesa = o => (o.res||[]).some(x=>x && x.spot===MESA_SPOT) && o.tray!==MESA_SPOT;
function spotsTxt(o){ const a=[]; if(o.tray) a.push(o.tray===MESA_SPOT?"Mesa-001":"Bandeja "+o.tray); if(bigOnMesa(o)) a.push("Mesa-001"); return a.join(" + "); }
let PRODUCTS = {}; // cadastro: código -> {code, name, ean, loc}
const LOC_TYPES = { GAV:"Gaveta", COL:"Colmeia", BIN:"Bin" };
let BLOCKS = {}, blockCol = null; // estruturas: {r, l, t, n1, n2, c1, c2} geram os locais
const colIdx = c => c.length===1 ? c.charCodeAt(0)-65 : (c.charCodeAt(0)-64)*26 + (c.charCodeAt(1)-65);
const colName = i => i<26 ? String.fromCharCode(65+i) : String.fromCharCode(64+Math.floor(i/26)) + String.fromCharCode(65+i%26);
const LOC_RE = /^R(\d{1,2})-L([A-Z])-(GAV|COL|BIN)-(\d{1,2})\.([A-Z]{1,2})$/;
function parseCode(s){ const m=String(s||"").toUpperCase().match(LOC_RE); return m ? {r:+m[1], l:m[2], t:m[3], n:+m[4], c:m[5], ci:colIdx(m[5])} : null; }
const inBlock = (b,x) => b.r===x.r && b.l===x.l && b.t===x.t && x.n>=b.n1 && x.n<=b.n2 && x.ci>=colIdx(b.c1) && x.ci<=colIdx(b.c2);
function parseLoc(s){ const x=parseCode(s); return x && Object.values(BLOCKS).some(b=>inBlock(b,x)) ? x : null; } // válido e cadastrado
function blockLocs(b){ const out=[]; for(let n=b.n1;n<=b.n2;n++) for(let ci=colIdx(b.c1);ci<=colIdx(b.c2);ci++) out.push(`R${b.r}-L${b.l}-${b.t}-${n}.${colName(ci)}`); return out; }
function allLocs(){ return Object.values(BLOCKS).flatMap(blockLocs).sort((a,b)=>{ const x=parseCode(a), y=parseCode(b); return x.r-y.r || x.l.localeCompare(y.l) || x.n-y.n || x.ci-y.ci; }); }
const ruas = () => [...new Set(Object.values(BLOCKS).map(b=>b.r))].sort((a,b)=>a-b);
const locType = lc => parseCode(lc)?.t || "";
const fullLoc = lc => lc;
function normLoc(s){ s=String(s||"").trim().toUpperCase().replace(/\s+/g,"-"); const m=s.match(/^R?(\d{1,2})-?L?([A-Z])-?(GAV|COL|BIN)-?(\d{1,2})[.\-]?([A-Z]{1,2})$/); return m ? `R${+m[1]}-L${m[2]}-${m[3]}-${+m[4]}.${m[5]}` : s; }
function locFor(c){ return parseLoc(PRODUCTS[c]?.loc); }
const liveLoc = it => locFor(it.code) || (typeof it.loc==="string" ? parseLoc(it.loc) : null);
const liveEan = it => PRODUCTS[it.code]?.ean || it.ean || "";
const ean13 = b => { const d=String(b).slice(0,12); let s=0; [...d].forEach((c,i)=>s+=(+c)*(i%2?3:1)); return d+((10-s%10)%10); };
const validEan = e => /^\d{13}$/.test(e) && ean13(e)===e;
const pad = n => String(n).padStart(2,"0");
const code = l => `R${l.r}-L${l.l}-${l.t}-${l.n}.${l.c}`;
const money = v => (v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate = iso => iso ? iso.split("-").reverse().join("/") : "";
const app = document.getElementById("app");

/* Tempos: integração → início da separação → fim da separação → mesa → envio */
function fmtDur(ms){
  if(ms==null || isNaN(ms)) return "—"; ms=Math.max(0,ms);
  const s=Math.floor(ms/1000), m=Math.floor(s/60), h=Math.floor(m/60), d=Math.floor(h/24);
  if(s<60) return s+"s"; if(m<60) return m+" min "+pad(s%60)+"s"; if(h<24) return h+"h "+pad(m%60)+"min"; return d+"d "+(h%24)+"h";
}
function fmtClock(ts){ if(!ts) return "—"; const d=new Date(ts), t=d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
  return d.toDateString()===new Date().toDateString() ? t : d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"})+" "+t; }
const since = ts => ts ? `<span class="tick tnum" data-since="${ts}">${fmtDur(Date.now()-ts)}</span>` : "—";
function stages(o){
  const mesa = o.atMesaAt || o.storedAt;
  return [
    {k:"Integrado pelo comercial", t:o.createdAt},
    {k:"Início da separação", t:o.startedAt, d:"Espera na fila", from:o.createdAt},
    ...(o.tray && o.atMesaAt && o.pickedAt && o.atMesaAt!==o.pickedAt ? [
      {k:"Fim da separação", t:o.pickedAt, d:"Separação", from:o.startedAt},
      ...(o.semPecas?[]:[{k: o.mode==="aguarda"?"Guardado na colmeia":"Mesa de expedição", t:mesa, d:"Até a mesa", from:o.pickedAt}]) ]
    : [ {k:"Chegada na mesa · fim do picking", t:o.pickedAt, d:"Tempo de picking", from:o.startedAt},
      ...(o.mode==="aguarda" && !o.semPecas ? [{k:"Guardado na colmeia", t:o.storedAt, d:"Mesa até a colmeia", from:o.pickedAt}] : []) ]),
    ...(hasEnc(o) ? [{k:"Encomenda chegou", t:o.arrivedAt, d:"Espera da encomenda", from:o.pickedAt}] : []),
    ...(o.mode==="aguarda" ? [{k:"Retirado da colmeia", t:o.sentAt, d:"Total desde a integração", from:o.createdAt}] : []),
  ];
}
const hasEnc = o => (o.items||[]).some(i=>i.qtyEnc>0);
function timelineHTML(o){
  const st=stages(o); let nowMarked=false;
  const end = o.atMesaAt || o.pickedAt; // o picking termina na mesa
  const total = end && o.createdAt && o.mode!=="aguarda" ? `<div class="tl-total">Total do picking (integração → mesa): <b class="tnum">${fmtDur(end-o.createdAt)}</b></div>` : "";
  return `<ol class="tl">${st.map(x=>{
    let cls=""; if(x.t) cls="on"; else if(!nowMarked){ cls="now"; nowMarked=true; }
    const dur = x.t && x.from ? fmtDur(x.t-x.from) : (!x.t && cls==="now" && x.from ? `em andamento · ${since(x.from)}` : "");
    return `<li class="${cls}"><span>${esc(x.k)}</span><span class="t">${x.t?fmtClock(x.t):""}</span>${x.d&&dur?`<span class="d">${esc(x.d)}: ${dur}</span>`:""}</li>`; }).join("")}</ol>${total}`;
}
function avg(list){ return list.length ? list.reduce((a,b)=>a+b,0)/list.length : null; }
function kpisHTML(){
  const today=new Date().toDateString(), isToday=t=>t && new Date(t).toDateString()===today;
  const picked=ORDERS.filter(o=>isToday(o.pickedAt) && o.startedAt);
  const wait=avg(picked.map(o=>o.startedAt-o.createdAt).filter(x=>x>=0)), pick=avg(picked.map(o=>o.pickedAt-o.startedAt).filter(x=>x>=0));
  return `<div class="kpis"><div><small>Separados hoje</small><b class="tnum">${picked.length}</b></div><div><small>Espera média</small><b class="tnum">${wait==null?"—":fmtDur(wait).replace(/ \d+s$/,"")}</b></div><div><small>Separação média</small><b class="tnum">${pick==null?"—":fmtDur(pick).replace(/ \d+s$/,"")}</b></div></div>`;
}
setInterval(()=>{ const n=Date.now(); document.querySelectorAll("[data-since]").forEach(e=>{ e.textContent=fmtDur(n-(+e.dataset.since)); }); }, 1000);

/* ================== Armazenamento compartilhado ================== */
let ORDERS = [], DELETED = [], db = null, col = null, synced = false;
const writeQ = {};
function queueWrite(id, fn){
  writeQ[id] = (writeQ[id]||Promise.resolve()).then(fn).catch(e=>{ console.warn(e); toast(e?.code==="quota_exceeded" ? "Limite de armazenamento atingido" : "Não foi possível salvar. Verifique a conexão."); });
  return writeQ[id];
}
function saveOrder(o){
  const i = ORDERS.findIndex(x=>x.id===o.id); i<0 ? ORDERS.push(o) : (ORDERS[i]=o);
  if(col) queueWrite(o.id, ()=>col.doc(o.id).set(JSON.parse(JSON.stringify(o))));
  rerender();
}
let prodCol = null;
function saveProduct(p){
  const clean = {code:p.code, name:p.name, ean:p.ean||"", loc:p.loc||""};
  PRODUCTS[p.code] = clean;
  if(prodCol) queueWrite("p:"+p.code, ()=>prodCol.doc(p.code).set(clean));
  rerender();
}
function patchOrder(id, patch){
  const o = ORDERS.find(x=>x.id===id); if(!o) return; Object.assign(o, patch);
  if(col) queueWrite(id, ()=>col.doc(id).update(JSON.parse(JSON.stringify(patch))));
}

/* ================== Estado da interface ================== */
/* Paginação: pageOf(lista, "chave", tamanho) -> {items, pager, top} */
function pageOf(list, key, size){
  state.pg ||= {};
  const pages = Math.max(1, Math.ceil(list.length/size));
  const p = Math.min(Math.max(1, state.pg[key]||1), pages); state.pg[key] = p;
  const a = (p-1)*size;
  const pager = pages<=1 ? "" : `<div class="pager" data-pgbox="${key}">
    <button class="mini" data-pg="${key}:${p-1}" ${p===1?"disabled":""} aria-label="Página anterior">‹ Anterior</button>
    <span class="pg-info tnum">${a+1}–${Math.min(a+size, list.length)} de ${list.length} · pág. ${p}/${pages}</span>
    <button class="mini" data-pg="${key}:${p+1}" ${p===pages?"disabled":""} aria-label="Próxima página">Próxima ›</button></div>`;
  return { items: list.slice(a, a+size), pager, top: `<span id="pgtop-${key}"></span>` };
}
const resetPage = key => { state.pg ||= {}; state.pg[key] = 1; };
document.addEventListener("click", e => {
  const b = e.target.closest && e.target.closest("[data-pg]"); if(!b || b.disabled) return;
  const [key, n] = b.dataset.pg.split(":"); state.pg ||= {}; state.pg[key] = +n;
  if(key==="aside" && state.sector==="comercial" && state.draft) rerender(); else render(); // na edição da pré-venda, só a lateral
  const t = document.getElementById("pgtop-"+key);
  if(t){ const y = t.getBoundingClientRect().top; if(y < 0 || y > innerHeight*0.6) t.scrollIntoView({block:"start"}); }
});
const state = { sector:null, view:"orders", oid:null, idx:0, phase:"loc", count:0, draft:null, draftErr:"", parsing:false, etab:"enderecos", rua:1, lado:"A", selLoc:null, mesaLast:null };
function initialSector(){ const h=location.hash.slice(1); if(["comercial","expedicao","estoque","usuarios"].includes(h)) return h; return innerWidth>=900 ? "comercial" : "expedicao"; }
state.sector = initialSector();

function pickList(o){
  return o.items.map((it,i)=>({...it, i, need: it.qty-(it.qtyEnc||0), loc: liveLoc(it), ean: liveEan(it)})).filter(x=>x.need>0)
    .sort((x,y)=> !x.loc || !y.loc ? (!x.loc) - (!y.loc) : x.loc.r-y.loc.r || x.loc.ci-y.loc.ci || x.loc.l.localeCompare(y.loc.l) || x.loc.n-y.loc.n);
}
const locTxt = it => it.loc ? code(it.loc) : "sem local";
function res(o){ if(!o.res || o.res.length!==o.items.length) o.res = o.items.map(()=>({status:"pend",got:0})); return o.res; }

/* ================== Navegação ================== */
function topnav(){
  const names = {comercial:"Comercial", expedicao:"Separação", estoque:"Locais", usuarios:"Usuários"};
  return `<nav class="topnav" aria-label="Setores">
    <div class="brand">Picking <span>Serena</span></div>
    <div class="sync ${synced?"":"local"}" title="${synced?"Dados sincronizados entre os setores":"Sem sincronização: os dados ficam só nesta tela"}"><i></i>${synced?"Sincronizado":"Modo local"}</div>
    <div class="seg mainnav" role="group">${allowedSectors().flatMap(k=> k==="expedicao"
      ? [["fila","Separação"],["historico","Separados"],["colmeias","Encomendas"]].map(([t,n])=>`<button data-sec="expedicao" data-tab="${t}" aria-pressed="${state.sector==="expedicao" && (state.sepTab||"fila")===t}">${n}</button>`)
      : [`<button data-sec="${k}" aria-pressed="${state.sector===k}">${names[k]}</button>`]).join("")}</div>

let pdfReady=null;
function loadPdfJs(){
  if(pdfReady) return pdfReady;
  const add = src => new Promise((ok,ko)=>{ const s=document.createElement("script"); s.src=src; s.onload=ok; s.onerror=ko; document.head.appendChild(s); });
  const base="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
  pdfReady = add(base+"pdf.min.js").then(()=>add(base+"pdf.worker.min.js")).catch(e=>{ pdfReady=null; throw e; });
  return pdfReady;
}
async function importPdf(file){
  if(!/pdf$/i.test(file.type) && !/\.pdf$/i.test(file.name)){ state.draftErr="Escolha um arquivo PDF."; return render(); }
  state.parsing=true; state.draftErr=""; render();
  try{
    await loadPdfJs();
    const pdf = await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
    const pg = await pdf.getPage(1); const tc = await pg.getTextContent();
    const raw = tc.items.map(i=>({s:i.str, x:i.transform[4], y:i.transform[5], w:i.width}));
    const p = parsePresale(raw);
    state.parsing=false; startDraft(p);
  }catch(e){
    console.warn(e); state.parsing=false;
    state.draftErr = e?.message==="formato"||e?.message==="sem itens" ? "Não reconheci este PDF como uma pré-venda ou orçamento (não achei o número ou a tabela de itens)." : "Não foi possível ler o PDF. Tente de novo ou use outro arquivo.";
    render();
  }
}

function sendDraft(){
  const d = state.draft, m = d.mode, enc = m!=="total";
  const items = d.items.map(it=>({code:it.code, name:it.name, ean:it.ean, un:it.un, qty:it.qty, price:it.price, loc:it.loc?code(it.loc):"", qtyEnc: enc?(it.qtyEnc||0):0, eta: enc&&it.qtyEnc?it.eta:""}));
  const hasEnc = items.some(it=>it.qtyEnc>0), hasPick = items.some(it=>it.qty-it.qtyEnc>0);
  if(enc && !hasEnc){ state.draftErr="Informe pelo menos um item sob encomenda, ou escolha Envio total."; return render(); }
  if(m==="parcial" && !hasPick){ state.draftErr="No envio parcial precisa haver peças em estoque para o 1º envio. Se tudo é sob encomenda, use Aguarda encomenda."; return render(); }
  const missing = items.map((it,i)=>it.qtyEnc>0 && !it.eta ? i : -1).filter(i=>i>=0);
  if(missing.length){ missing.forEach(i=>document.getElementById("eta-"+i)?.classList.add("invalid")); state.draftErr=""; toast("Informe a previsão de chegada dos itens sob encomenda."); return; }
  const noLoc = items.filter(it=>it.qty-it.qtyEnc>0 && !it.loc);
  items.forEach(it=>{ const p=PRODUCTS[it.code]; if(!p) saveProduct({code:it.code, name:it.name, ean:it.ean, loc:it.loc?code(it.loc):""}); else if(!p.ean && it.ean && !validateProduct({...p, ean:it.ean})) saveProduct({...p, ean:it.ean}); });
  const prev = ORDERS.find(o=>o.id===d.id);
  const slot = m==="aguarda" ? ((prev && usesHive(prev) && prev.colmeia) || freeSlot()) : null;
  if(m==="aguarda" && !slot){ state.draftErr="Todas as colmeias estão ocupadas. Libere uma colmeia antes de integrar este pedido."; return render(); }
  const o = { id:d.id, num:d.num, date:d.date, time:d.time, clientCode:d.clientCode, client:d.client, city:d.city, seller:d.seller, obs:d.obs, total:d.total,
    mode:m, v2:true, items, remessa:1, status: hasPick ? "aguardando" : "na_colmeia", createdAt: Date.now(), createdBy: ME.id||"" };
  if(slot) o.colmeia = slot;
  res(o);
  state.draft=null; state.draftErr="";
  saveOrder(o);
  toast((noLoc.length ? `${noLoc.length} item(ns) sem local · o separador procura no estoque · ` : "") + (m==="aguarda" ? (hasPick ? `Pré-venda ${o.num} enviada para separação · colmeia ${slot}` : `Pré-venda ${o.num} toda sob encomenda · colmeia ${slot} reservada`) : `Pré-venda ${o.num} enviada para separação · ${MODES[m].t.toLowerCase()}`));
}

const isSeparated = o => trayTied(o) && !["aguardando","separando"].includes(o.status);
const inHistory = o => !!o.pickedAt && !isSeparated(o) && !inHive(o) && !["aguardando","separando"].includes(o.status);

  const hist = [...ORDERS.filter(inHistory), ...DELETED].sort((a,b)=>(b.deletedAt||b.pickedAt||0)-(a.deletedAt||a.pickedAt||0));
  const units = queue.reduce((s,o)=>s+pickList(o).reduce((a,x)=>a+x.need,0),0);
  const tabs = [["fila","Separação",queue.length+parked.length],["colmeias","Colmeias · encomenda",hive.length],["historico","Histórico",hist.length]];
  let body = "";
  const pgQ = pageOf(queue, "fila", 20), pgP = pageOf(parked, "mesa", 20), pgH = pageOf(hist, "hist", 25);
  if(tab==="fila"){
    body = (can("coleta") ? alertsHTML() : "") + `

      <div><b class="tnum">${queue.length}</b><span class="eyebrow">Pedidos</span></div>

/* ================== Mapa do estoque ================== */
let animToken = 0, lastAnimKey = null;
function mapGeom(){
  const rs = ruas(); const n = Math.max(1, rs.length);
  const rows = Math.max(6, ...Object.values(BLOCKS).map(b=>colIdx(b.c2)+1));
  const W = 360, unit = Math.min(120, 316/n), x0 = (W - n*unit)/2 + 8;
  const rw = Math.max(9, Math.min(26, unit*0.22)), cw = Math.min(46, unit*0.38), rh = 240/rows;
  const laneX = r => x0 + rs.indexOf(r)*unit + unit/2;
  return { rs, W, rows, rh, rw, cw, laneX, rackX: (r,l) => l==="A" ? laneX(r) - cw/2 - rw : laneX(r) + cw/2, rowY: ci => 300 - (ci+0.5)*rh };
}
const CROSS_Y = 325;
function routePts(g, from, l){
  const to = {x:g.laneX(l.r), y:g.rowY(l.ci)};
  if(from.lane!==undefined && from.x===to.x) return [from,to];
  const pts=[from,{x:from.x,y:CROSS_Y},{x:to.x,y:CROSS_Y},to];
  return pts.filter((p,i)=>!i || p.x!==pts[i-1].x || p.y!==pts[i-1].y);
}
function mapSVG(item, prevItem){
  const g = mapGeom(), l = item.loc, W = g.W;
  const from = prevItem?.loc ? {x:g.laneX(prevItem.loc.r), y:g.rowY(prevItem.loc.ci), lane:1} : {x:W/2, y:372};
  const pts = routePts(g, from, l), t = {x:g.laneX(l.r), y:g.rowY(l.ci)};
  const d = "M"+pts.map(p=>`${p.x} ${p.y}`).join(" L");
  let s = `<svg viewBox="0 0 ${W} 410" role="img" aria-label="Mapa do estoque: vá até a rua ${l.r}, lado ${l.l}, coluna ${l.c}, nível ${l.n}">`;
  s += `<rect class="m-floor" x="0" y="0" width="${W}" height="410" rx="12"/>`;
  s += `<rect class="m-lane" x="${g.laneX(l.r)-g.cw/2}" y="60" width="${g.cw}" height="240" rx="3"/>`;
  for(const r of g.rs) for(const side of ["A","B"]){
    const bl = Object.values(BLOCKS).filter(b=>b.r===r && b.l===side);
    for(let ci=0; ci<g.rows; ci++){
      const has = bl.some(b=>ci>=colIdx(b.c1) && ci<=colIdx(b.c2)), tgt = r===l.r && side===l.l && ci===l.ci;
      if(has) s += `<rect class="m-cell${tgt?" target":""}" x="${g.rackX(r,side)}" y="${300-(ci+1)*g.rh+1}" width="${g.rw}" height="${Math.max(2,g.rh-2)}" rx="1.5"/>`;
    }
    s += `<text class="m-txt" x="${g.rackX(r,side)+g.rw/2}" y="316" text-anchor="middle">${side}</text>`;
  }
  for(const r of g.rs) s += `<text class="m-ais" x="${g.laneX(r)}" y="52" text-anchor="middle">R${r}</text>`;
  const step = g.rows>16 ? 2 : 1;
  for(let ci=0; ci<g.rows; ci+=step) s += `<text class="m-txt" x="10" y="${g.rowY(ci)+3}" text-anchor="middle">${colName(ci)}</text>`;
  s += `<rect class="m-dock" x="${W/2-110}" y="362" width="220" height="34" rx="6"/><text class="m-dock-t" x="${W/2}" y="383" text-anchor="middle">MESA DE EXPEDIÇÃO · COLMEIAS</text>`;
  if(prevItem) s += `<circle class="m-prev" cx="${from.x}" cy="${from.y}" r="4"/>`;
  s += `<path id="route" class="m-route" d="${d}"/><circle class="m-ring" cx="${t.x}" cy="${t.y}" r="9"/><circle class="m-pin" cx="${t.x}" cy="${t.y}" r="6.5"/><circle id="op" class="m-op" cx="${from.x}" cy="${from.y}" r="6"/>`;
  return s + `</svg>`;
}
function animateRoute(force){
  const card = document.getElementById("map"); if(!card) return;
  const path = document.getElementById("route"), op = document.getElementById("op");
  card.classList.remove("arrived");
  const len = path.getTotalLength(), tok = ++animToken, key = state.oid+":"+state.idx;
  const finish = () => { path.style.strokeDasharray=""; path.style.strokeDashoffset=0; const p=path.getPointAtLength(len); op.setAttribute("cx",p.x); op.setAttribute("cy",p.y); card.classList.add("arrived"); };
  if(matchMedia("(prefers-reduced-motion: reduce)").matches || (!force && lastAnimKey===key)) return finish();
  lastAnimKey = key;
  path.style.strokeDasharray = len; path.style.strokeDashoffset = len;
  const dur = Math.min(2400, Math.max(1000, len*4.2)), t0 = performance.now();
  const ease = x => x<.5 ? 2*x*x : 1-Math.pow(-2*x+2,2)/2;
  (function step(now){
    if(tok!==animToken) return;
    const k = Math.min(1,(now-t0)/dur), e = ease(k);
    path.style.strokeDashoffset = len*(1-e);
    const p = path.getPointAtLength(e*len); op.setAttribute("cx",p.x); op.setAttribute("cy",p.y);
    k<1 ? requestAnimationFrame(step) : finish();
  })(t0);
}
function elevSVG(l){
  const nMax = Math.max(l.n, ...Object.values(BLOCKS).filter(b=>b.r===l.r && b.l===l.l).map(b=>b.n2));
  const H = 72, h = H/nMax;
  let s=`<svg class="elev" width="54" height="78" viewBox="0 0 54 78" aria-label="Nível ${l.n} de ${nMax}">`;
  s+=`<rect class="e-post" x="10" y="2" width="3" height="72"/><rect class="e-post" x="49" y="2" width="3" height="72"/>`;
  for(let k=1;k<=nMax;k++){ const y=74-k*h; s+=`<rect class="e-lvl${k===l.n?" on":""}" x="14" y="${y+1}" width="34" height="${Math.max(1.5,h-2)}" rx="${Math.min(2,h/4)}"/>`;
    if(k===l.n || nMax<=8) s+=`<text class="e-t" x="4" y="${y+h/2+3}" text-anchor="middle"${k===l.n?' style="font-weight:700"':""}>${k}</text>`; }
  return s+`</svg>`;
}

async function keepAwake(on){

       if(!on && wakeLock){ await wakeLock.release(); wakeLock=null; } }catch(e){ wakeLock=null; }

function handleScan(raw){
  const v = normSpot(String(raw||"").trim().toUpperCase().replace(/\s+/g,""));
  if(state.view==="pick" && state.phase==="qty"){
    const ok=document.getElementById("okQty");
    if(!v && ok){ ok.click(); return; }
    if(/^\d{1,3}$/.test(v)){ const c=cur(); if(c){ state.count=Math.min(c.it.need, +v); const q=document.getElementById("q"); if(q) q.value=state.count; if(ok){ ok.textContent=`Confirmar ${state.count} pç`; ok.click(); } } return; }

    const o=ORDERS.find(x=>x.id===state.oid); if(!o) return;
    if(v===o.colmeia){ feedback(true); setMsg(`Colmeia ${v} confirmada`,"good"); return finishStore(o); }
    feedback(false); return setMsg(/^CM-\d{2}$/.test(v) ? `Colmeia errada: ${v}. Este pedido vai na ${o.colmeia}.` : `Código ${v} não é uma colmeia.`, "bad");
  }
  if(state.view!=="pick") return;
  const c = cur(); if(!c) return; const {o, it} = c;
  const isLoc = LOC_RE.test(v), isProd = (!!it.ean && v===it.ean) || v===it.code;
  if(state.phase==="loc" && !it.loc) state.phase = startPhase(o);
  if(state.phase==="loc"){
    if(v===code(it.loc)){ feedback(true); state.count=0;
      if(hasTray(o)){ state.phase="prod"; render(); setMsg(`Endereço ${v} confirmado. Bipe as peças.`,"good"); }
      else { state.phase="tray"; render(); setMsg(`Endereço ${v} confirmado. Agora bipe a bandeja.`,"good"); }
      return; }
    feedback(false);
    if(isProd) return setMsg("Bipe primeiro a etiqueta do endereço.","bad");
    return setMsg(isLoc ? `Endereço errado: ${v}. Vá para ${code(it.loc)}.` : `Código ${v} não é um endereço.`, "bad");
  }
  if(isLoc && !it.loc){ feedback(false); return setMsg(`Este produto não tem local cadastrado. Bipe a peça.`,"bad"); }
  if(isLoc){
    if(v===code(it.loc)){ feedback(true); return setMsg(state.phase==="tray" ? "Local certo. Agora bipe a bandeja." : "Local certo. Agora bipe o produto.","good"); }
    feedback(false); return setMsg(`Local errado: ${v}. O produto está em ${code(it.loc)}.`,"bad");
  }
  if(state.phase==="tray"){
    if(!isTrayCode(v)){ feedback(false); return setMsg(isProd ? "Bipe primeiro a bandeja (ou a Mesa-001), depois as peças." : `Código ${v} não é uma bandeja.`,"bad"); }
    const other = trayBusy(v, o.id);
    if(other){ feedback(false); return setMsg(other.trayStatus==="separando" ? `Bandeja ${v} está em uso no pedido ${other.num}. Pegue outra.` : `Bandeja ${v} ainda está vinculada ao pedido ${other.num}. Desvincule antes em Bandejas.`,"bad"); }
    feedback(true); patchOrder(o.id, {tray:v, trayStatus:"separando"});
    state.phase="prod"; state.count=0; render(); setMsg(v===MESA_SPOT ? "Pedido vai na Mesa-001. Bipe o produto." : `Bandeja ${v} vinculada. Bipe o produto.`,"good"); return;
  }
  if(v===MESA_SPOT){
    if(o.tray===MESA_SPOT){ feedback(true); return setMsg("Este pedido já está todo na Mesa-001. Bipe o produto.","info"); }
    feedback(true); state.bigItem=true; render(); setMsg("Este item vai na Mesa-001. "+(state.phase==="qty"?"Conte e confirme.":"Bipe o produto."),"good"); return;
  }
  if(isProd){
    if(state.phase==="qty"){ feedback(true); return setMsg("Produto já confirmado. Conte e confirme a quantidade.","info"); }
    feedback(true); state.phase="qty"; state.count=it.need; render(); setMsg(`Produto certo. Conte ${it.need} pç e confirme.`,"good");
    return;
  }
  feedback(false);
  if(isLoc) return setMsg(`Você já está em ${code(it.loc)}. Agora bipe a peça.`,"bad");
  const enc = o.items.find(x=>(x.ean===v||x.code===v) && x.qtyEnc>=x.qty);
  const other = o.items.find(x=>x.ean===v||x.code===v);
  setMsg(enc ? `${enc.name} é sob encomenda. Não separar.` : other ? `Produto de outro item: ${other.name}. Este item ${it.loc?"está em "+code(it.loc):"é o "+it.code}.` : `Código ${v} não é deste produto.`, "bad");
}

async function openLiveScanner(){
  if(!navigator.mediaDevices?.getUserMedia) return false;
  let stream;
  try{ stream = await navigator.mediaDevices.getUserMedia({audio:false, video:{facingMode:{ideal:"environment"}, width:{ideal:1280}, height:{ideal:720}}}); }
  catch(e){ return false; }
  const ov=document.createElement("div"); ov.className="camov"; ov.setAttribute("role","dialog"); ov.setAttribute("aria-label","Leitor por câmera");
  ov.innerHTML=`<video playsinline muted autoplay></video><div class="camframe"><i></i></div><div class="camhint">Aponte para o código de barras</div><button class="btn" id="camClose">Fechar</button>`;
  document.body.appendChild(ov);
  const v=ov.querySelector("video"); v.srcObject=stream;
  try{ await v.play(); }catch(e){}
  try{ const t=stream.getVideoTracks()[0], c=t.getCapabilities?.(); if(c?.focusMode?.includes("continuous")) await t.applyConstraints({advanced:[{focusMode:"continuous"}]}); }catch(e){}
  let stop=false;
  const close=()=>{ stop=true; stream.getTracks().forEach(t=>t.stop()); ov.remove(); focusScan(); };
  ov.querySelector("#camClose").onclick=close;
  let det=null; try{ if("BarcodeDetector" in window){ const f=await BarcodeDetector.getSupportedFormats(); if(f.includes("ean_13")) det=new BarcodeDetector({formats:["ean_13","ean_8","code_128"].filter(x=>f.includes(x))}); } }catch(e){}
  let reader=null;
  if(!det){ try{ await ensureZXing(); const h=new Map(); h.set(ZXing.DecodeHintType.TRY_HARDER,true); h.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.EAN_13,ZXing.BarcodeFormat.EAN_8,ZXing.BarcodeFormat.CODE_128]); reader=new ZXing.MultiFormatReader(); reader.setHints(h); }catch(e){ close(); return false; } }
  const cv=document.createElement("canvas"), g=cv.getContext("2d",{willReadFrequently:true});
  const tick = async ()=>{
    if(stop) return;
    let txt=null;
    try{
      if(det){ const r=await det.detect(v); if(r[0]) txt=r[0].rawValue; }
      else if(v.videoWidth){
        const w=v.videoWidth, h=v.videoHeight, bw=w*0.9, bh=h*0.4;
        cv.width=Math.min(1280,Math.round(bw)); cv.height=Math.round(cv.width*bh/bw);
        g.drawImage(v,(w-bw)/2,(h-bh)/2,bw,bh,0,0,cv.width,cv.height);
        try{ txt=reader.decode(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.HTMLCanvasElementLuminanceSource(cv)))).getText(); }catch(e){}
      }
    }catch(e){}
    if(txt){ close(); handleScan(txt); return; }
    setTimeout(tick, det ? 80 : 120);
  };
  tick();
  return true;
}
camFile.onchange = async ()=>{

async function loadPhoto(file){
  try{ return await createImageBitmap(file, {imageOrientation:"from-image"}); }catch(e){}
  return await new Promise((ok,ko)=>{ const u=URL.createObjectURL(file), im=new Image(); im.onload=()=>{ ok(im); setTimeout(()=>URL.revokeObjectURL(u),1000); }; im.onerror=()=>ko(new Error("imagem")); im.src=u; });
}
function cropCanvas(img, max, band, rot){
  const W=img.width||img.naturalWidth, H=img.height||img.naturalHeight;
  // recorte: imagem inteira ou faixa central (onde costuma estar o código)
  const sx = band ? W*0.05 : 0, sw = band ? W*0.9 : W, sy = band ? H*(0.5-band/2) : 0, sh = band ? H*band : H;
  const sc = Math.min(1, max/Math.max(sw,sh)), cw=Math.max(1,Math.round(sw*sc)), ch=Math.max(1,Math.round(sh*sc));
  const cv=document.createElement("canvas"); cv.width = rot? ch:cw; cv.height = rot? cw:ch;
  const g=cv.getContext("2d", {willReadFrequently:true});
  if(rot){ g.translate(ch,0); g.rotate(Math.PI/2); }
  g.drawImage(img, sx, sy, sw, sh, 0, 0, cw, ch);
  return cv;
}
async function decodePhoto(file){
  const img = await loadPhoto(file);
  if("BarcodeDetector" in window){ try{ const r = await new BarcodeDetector({formats:["ean_13","ean_8","code_128"]}).detect(img); if(r[0]) return {text:r[0].rawValue, via:"barcode"}; }catch(e){} }
  try{
    await ensureZXing();
    const hints=new Map(); hints.set(ZXing.DecodeHintType.TRY_HARDER,true);
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.EAN_13,ZXing.BarcodeFormat.EAN_8,ZXing.BarcodeFormat.CODE_128]);
    const reader=new ZXing.MultiFormatReader(); reader.setHints(hints);
    const tries=[[1800,.3,0],[2400,.25,0],[1280,0,0],[1800,.3,1],[2400,.25,1],[1280,.45,0],[900,0,0],[3000,.2,0]];
    for(const [max,band,rot] of tries){
      const cv=cropCanvas(img,max,band,rot);
      for(const Bin of [ZXing.HybridBinarizer, ZXing.GlobalHistogramBinarizer]){
        try{ const r=reader.decode(new ZXing.BinaryBitmap(new Bin(new ZXing.HTMLCanvasElementLuminanceSource(cv)))); if(r) return {text:r.getText(), via:"barcode"}; }catch(e){}
      }
      await new Promise(r=>setTimeout(r,0)); // não travar a tela
    }
  }catch(e){ console.warn(e); }
  throw new Error("não lido");
}

  const blocksHere = Object.entries(BLOCKS).filter(([,b])=>b.r===r && b.l===lado);
  const nMax = Math.max(0, ...blocksHere.map(([,b])=>b.n2)), cMax = Math.max(-1, ...blocksHere.map(([,b])=>colIdx(b.c2)));
  const cellAt = (n,ci) => { const hit = blocksHere.find(([,b])=>n>=b.n1 && n<=b.n2 && ci>=colIdx(b.c1) && ci<=colIdx(b.c2)); return hit ? hit[1].t : null; };
  const countR = rr => { const all=allLocs().filter(lc=>parseCode(lc).r===rr); return `${all.filter(lc=>used[lc]).length}/${all.length}`; };
  const grid = nMax ? `<div class="rackgrid" style="grid-template-columns:30px repeat(${cMax+1},minmax(54px,1fr))">

    </div>` : `<div class="empty">Nenhum local cadastrado no lado ${lado} da rua R${r}. Crie a estrutura ao lado.</div>`;
  return `<div class="cgrid">
    <section class="panel">
      <div class="filters" style="justify-content:space-between">
        <div class="ruas" style="grid-template-columns:repeat(${Math.max(1,Math.min(6,rs.length))},minmax(90px,1fr));flex:1">${rs.map(x=>`<button class="ruabtn" data-rua="${x}" aria-pressed="${x===r}"><b>Rua R${x}</b><small class="tnum">${countR(x)} ocupados</small></button>`).join("") || `<div class="empty">Nenhuma rua cadastrada.</div>`}</div>
        <div class="seg">${["A","B"].map(x=>`<button data-lado="${x}" aria-pressed="${x===lado}">Lado ${x}</button>`).join("")}</div>
      </div>
      <div class="rackwrap"><div class="rack" style="min-width:${Math.max(320,(cMax+2)*58)}px"><div class="eyebrow">R${r} · lado ${lado} · níveis de baixo (1) para cima, colunas da esquerda (A) para a direita</div>${grid}</div></div>
      ${blocksHere.length?`<div><h3>Estruturas deste lado</h3><div class="qlist" style="margin-top:6px">${blocksHere.map(([id,b])=>{ const locs=blockLocs(b), occ=locs.filter(lc=>used[lc]).length;
        return `<div class="urow" style="border:1px solid var(--line);border-radius:10px"><span class="ttag" style="font-size:12px">${b.t}</span><div class="grow"><b>${LOC_TYPES[b.t]} · níveis ${b.n1}–${b.n2} · colunas ${b.c1}–${b.c2}</b><small>${locs.length} locais · ${occ} com produto</small></div><button class="mini" data-delblock="${esc(id)}" ${occ?"disabled title=\"Retire os produtos antes de remover\"":""}>Remover</button></div>`; }).join("")}</div></div>`:""}
      <p class="hint">Endereço = Rua-Lado-Tipo-Nível.Coluna, ex.: <b>R1-LB-BIN-8.M</b> (rua 1, lado B, bin, nível 8, coluna M). Tipos: GAV gaveta, COL colmeia, BIN bin.</p>
    </section>
    <aside class="panel" id="locpanel">${state.selLoc && parseLoc(state.selLoc) ? locPanelHTML() : blockFormHTML()}</aside>
  </div>`;
}

function blockPreview(f){
  const b = {r:+f.r, l:String(f.l).toUpperCase(), t:f.t, n1:+f.n1, n2:+f.n2, c1:String(f.c1||"").toUpperCase(), c2:String(f.c2||"").toUpperCase()};
  if(!(b.r>=1 && b.r<=99)) return {err:"Informe a rua (1 a 99)."};
  if(!(b.n1>=1 && b.n2>=b.n1 && b.n2<=99)) return {err:"Faixa de níveis inválida."};
  if(!/^[A-Z]{1,2}$/.test(b.c1) || !/^[A-Z]{1,2}$/.test(b.c2) || colIdx(b.c2)<colIdx(b.c1)) return {err:"Faixa de colunas inválida (letras, ex.: A até M)."};
  const locs = blockLocs(b);
  if(locs.length>600) return {err:`São ${locs.length} locais de uma vez. Divida em blocos menores (até 600).`};
  const clash = allLocs().map(parseCode).find(x=>x.r===b.r && x.l===b.l && x.n>=b.n1 && x.n<=b.n2 && x.ci>=colIdx(b.c1) && x.ci<=colIdx(b.c2));
  if(clash) return {err:`Essa faixa já tem locais cadastrados (ex.: ${code(clash)}).`};
  return {b, count:locs.length, first:locs[0], last:locs[locs.length-1]};
}

/* ---- Importação de produtos por CSV ---- */
function parseCSV(text){
  text = text.replace(/^﻿/, "");
  const first = text.split(/\r?\n/)[0] || "";
  const sep = (first.match(/;/g)||[]).length >= (first.match(/,/g)||[]).length ? ";" : ((first.match(/\t/g)||[]).length > (first.match(/,/g)||[]).length ? "\t" : ",");
  const rows=[]; let row=[], cell="", q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else q=false; } else cell+=ch; continue; }
    if(ch==='"') q=true;
    else if(ch===sep){ row.push(cell); cell=""; }
    else if(ch==="\n"||ch==="\r"){ if(ch==="\r" && text[i+1]==="\n") i++; row.push(cell); rows.push(row); row=[]; cell=""; }
    else cell+=ch;
  }
  if(cell!=="" || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.some(c=>String(c).trim()!==""));
}
const normH = h => String(h||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z]/g,"");
const CSV_COLS = {
  code:["codigo","cod","codproduto","codigoproduto","sku","referencia","ref"],
  name:["descricao","produto","nome","descricaoproduto","desc"],
  ean:["ean","codigodebarras","codbarras","gtin","ean13","barras"],
  loc:["local","localizacao","endereco","posicao","locacao"],
};
async function readCsvFile(file){
  const buf = await file.arrayBuffer();
  try{ return new TextDecoder("utf-8",{fatal:true}).decode(buf); }catch(e){ return new TextDecoder("windows-1252").decode(buf); }
}
function analyzeCsv(rows, update){
  if(rows.length<2) return {err:"O arquivo está vazio ou só tem o cabeçalho."};
  const head=rows[0].map(normH), idx={};
  for(const [k,names] of Object.entries(CSV_COLS)){ const i=head.findIndex(h=>names.includes(h)); if(i>=0) idx[k]=i; }
  if(idx.code===undefined) return {err:"Não encontrei a coluna de código. Use o modelo: codigo; descricao; ean; local."};
  const seenCode=new Set(), eanInFile={}, locInFile={}, out=[];
  rows.slice(1).forEach((r,n)=>{
    const g=k=> idx[k]===undefined ? "" : String(r[idx[k]]??"").trim();
    const line=n+2, code=g("code").toUpperCase(), name=g("name").toUpperCase(), ean=g("ean").replace(/\D/g,""), locRaw=g("loc");
    const loc = locRaw ? normLoc(locRaw) : "";
    const ex = PRODUCTS[code], msgs=[]; let status = ex ? "upd" : "new";
    if(!code){ out.push({line, status:"err", msgs:["sem código"]}); return; }
    if(!/^[A-Z0-9._-]{1,40}$/.test(code)){ out.push({line, code, status:"err", msgs:["código com caracteres inválidos"]}); return; }
    if(seenCode.has(code)){ out.push({line, code, status:"err", msgs:["código repetido no arquivo"]}); return; }
    seenCode.add(code);
    if(ex && !update){ out.push({line, code, name:ex.name, status:"skip", msgs:["já cadastrado"]}); return; }
    if(!ex && !name){ out.push({line, code, status:"err", msgs:["sem descrição"]}); return; }
    const p = {code, name: name || ex?.name || "", ean: ex?.ean || "", loc: ex?.loc || ""};
    if(ean){
      const st=eanState(ean), dup=Object.values(PRODUCTS).find(x=>x.code!==code && x.ean===ean) || (eanInFile[ean] && eanInFile[ean]!==code);
      if(st.c==="bad") msgs.push(`EAN ${ean} inválido (ignorado)`);
      else if(dup) msgs.push(`EAN ${ean} já usado em outro produto (ignorado)`);
      else { p.ean=ean; eanInFile[ean]=code; }
    }
    if(loc){
      const occ = locProduct(loc), occFile = locInFile[loc];
      if(!parseCode(loc)) msgs.push(`local "${locRaw}" inválido (ignorado)`);
      else if(!parseLoc(loc)) msgs.push(`local ${loc} não cadastrado em Endereços (ignorado)`);
      else if((occ && occ.code!==code) || (occFile && occFile!==code)) msgs.push(`local ${loc} já ocupado (ignorado)`);
      else { p.loc=loc; locInFile[loc]=code; }
    }
    if(ex && p.name===ex.name && p.ean===(ex.ean||"") && p.loc===(ex.loc||"")) status="same";
    out.push({line, code, name:p.name, ean:p.ean, loc:p.loc, p, status, msgs});
  });
  const c = s => out.filter(x=>x.status===s).length;
  return {rows:out, cols:Object.keys(idx), n:{new:c("new"), upd:c("upd"), same:c("same"), skip:c("skip"), err:c("err"), warn:out.filter(x=>x.msgs?.length && x.p).length}};
}

async function importCsv(){
  const c=state.csv; if(!c?.res || c.busy) return;
  const list=c.res.rows.filter(x=>x.status==="new"||x.status==="upd").map(x=>x.p);
  c.busy=true; c.done=0; render();
  list.forEach(p=>{ PRODUCTS[p.code]={code:p.code, name:p.name, ean:p.ean||"", loc:p.loc||""}; });
  let fail=0;
  if(prodCol){
    let i=0; const worker=async()=>{ while(i<list.length){ const p=list[i++];
      try{ await prodCol.doc(p.code).set({code:p.code, name:p.name, ean:p.ean||"", loc:p.loc||""}); }
      catch(e){ if(e?.code==="unavailable"){ await new Promise(r=>setTimeout(r,400+Math.random()*400)); try{ await prodCol.doc(p.code).set({code:p.code, name:p.name, ean:p.ean||"", loc:p.loc||""}); }catch(e2){ fail++; } } else fail++; }
      c.done++; const b=document.getElementById("csvGo"); if(b) b.textContent=`Importando ${c.done} de ${list.length}…`; } };
    await Promise.all([worker(),worker(),worker()]);
  }
  state.csv=null; toast(fail ? `${list.length-fail} produtos importados · ${fail} falharam (tente de novo)` : `${list.length} produtos importados`); render();
}

let jspdfReady=null, downloadsCap;
function loadJsPdf(){ if(jspdfReady) return jspdfReady;
  jspdfReady=new Promise((ok,ko)=>{ const s=document.createElement("script"); s.src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"; s.onload=ok; s.onerror=()=>{ jspdfReady=null; ko(new Error("lib")); }; document.head.appendChild(s); });
  return jspdfReady; }
function bcPng(l){ const c=document.createElement("canvas"); JsBarcode(c, l.value, {format:l.fmt, width:3, height:110, margin:0, displayValue:/^EAN/.test(l.fmt), fontSize:30, background:"#FFFFFF", lineColor:"#000000"}); return {url:c.toDataURL("image/png"), r:c.height/c.width}; }
async function makePdf(labels, fmt, filename){
  if(!labels.length) return;
  toast("Gerando PDF…");
  try{
    if(downloadsCap===undefined) downloadsCap = window.claude?.use ? await window.claude.use("downloads") : null;
    if(!downloadsCap){ toast("Não foi possível baixar o arquivo neste navegador."); return; }
    await Promise.all([loadJsPdf(), ensureBarcode()]); const { jsPDF } = window.jspdf;
    const fit = (doc, txt, size, maxW) => { let s=size; doc.setFontSize(s); while(s>6 && doc.getTextWidth(txt)>maxW){ s-=.5; doc.setFontSize(s); } return s; };
    let doc;
    if(fmt==="loc3" || fmt==="loca4"){
      const a4 = fmt==="loca4", per = a4 ? 10 : 3;
      doc = a4 ? new jsPDF({unit:"mm", format:"a4"}) : new jsPDF({unit:"mm", format:[100,150], orientation:"portrait"});
      labels.forEach((l,i)=>{
        if(i && i%per===0) a4 ? doc.addPage() : doc.addPage([100,150],"portrait");
        const k=i%per, x = a4 ? 5+(k%2)*100 : 0, y = a4 ? 23.5+Math.floor(k/2)*50 : k*50;
        let bc=null; if(l.value){ const c=document.createElement("canvas"); JsBarcode(c, l.value, {format:l.bcf||"CODE128", width:3, height:110, margin:0, displayValue:false, flat:true, background:"#FFFFFF", lineColor:"#000000"}); bc=c.toDataURL("image/png"); }
        drawLocLabel(doc, x, y, l, bc);
        // linhas de corte
        doc.setDrawColor(170); doc.setLineWidth(.15); doc.setLineDashPattern([1.5,1.5],0);
        if(a4) doc.rect(x, y, 100, 50); else if(k<2 && i<labels.length-1) doc.line(0, y+50, 100, y+50);
        doc.setLineDashPattern([],0);
      });
    } else if(fmt==="a4"){
      doc=new jsPDF({unit:"mm", format:"a4"}); const W=70, H=297/8;
      labels.forEach((l,i)=>{ if(i && i%24===0) doc.addPage(); const k=i%24, x=(k%3)*W, y=Math.floor(k/3)*H;
        doc.setFont("helvetica","bold"); fit(doc,l.big,15,W-8); doc.text(l.big, x+4, y+8);
        doc.setFont("helvetica","normal"); fit(doc,l.small,7,W-8); doc.text(l.small, x+4, y+12);
        if(l.sub){ fit(doc,l.sub,6,W-8); doc.text(l.sub, x+4, y+15.5); }
        const b=bcPng(l), bw=W-8, bh=Math.min(17, bw*b.r); doc.addImage(b.url,"PNG",x+4,y+H-bh-3,bw,bh); });
    } else {
      doc=new jsPDF({unit:"mm", format:[100,50], orientation:"landscape"});
      labels.forEach((l,i)=>{ if(i) doc.addPage([100,50],"landscape");
        doc.setFont("helvetica","bold"); fit(doc,l.big,24,90); doc.text(l.big, 5, 11);
        doc.setFont("helvetica","normal"); fit(doc,l.small,9,90); doc.text(l.small, 5, 16.5);
        if(l.sub){ fit(doc,l.sub,8,90); doc.text(l.sub, 5, 21); }
        const b=bcPng(l), bh=Math.min(22, 90*b.r); doc.addImage(b.url,"PNG",5,47-bh,90,bh); });
    }
    await downloadsCap.save({filename, data:doc.output("arraybuffer")});
    toast(`PDF com ${labels.length} etiqueta(s) salvo`);
  }catch(e){
    if(e?.code==="declined") return toast("Download cancelado.");
    console.warn(e); toast(e?.message==="lib" ? "Não foi possível carregar o gerador de PDF. Verifique a conexão." : "Não foi possível gerar o PDF.");
  }
}

let seenOrders = null, newIds = new Set(), alertQueue = [];
let SOUND = true; try{ SOUND = localStorage.getItem("ps-sound")!=="0"; }catch(e){}
const unlockAudio = () => { try{ audioCtx ||= new (window.AudioContext||window.webkitAudioContext)(); audioCtx.resume?.(); }catch(e){} };
document.addEventListener("pointerdown", unlockAudio, {once:true}); document.addEventListener("keydown", unlockAudio, {once:true});
function chime(){
  if(!SOUND) return;
  try{ unlockAudio(); const c=audioCtx, t0=c.currentTime;
    [[880,0],[1175,.16],[1568,.32],[880,.9],[1175,1.06],[1568,1.22]].forEach(([f,dt])=>{ const o=c.createOscillator(), g=c.createGain(); o.type="triangle"; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t0+dt); g.gain.exponentialRampToValueAtTime(.45,t0+dt+.02); g.gain.exponentialRampToValueAtTime(.0001,t0+dt+.28);
      o.connect(g); g.connect(c.destination); o.start(t0+dt); o.stop(t0+dt+.3); }); }catch(e){}
}
function checkNewOrders(){
  const open = ORDERS.filter(o=>o.status==="aguardando" && pickList(o).length);
  if(seenOrders===null){ seenOrders = new Set(ORDERS.map(o=>o.id+":"+(o.createdAt||0))); return; } // carga inicial: sem alerta
  const fresh = open.filter(o=>!seenOrders.has(o.id+":"+(o.createdAt||0)));
  ORDERS.forEach(o=>seenOrders.add(o.id+":"+(o.createdAt||0)));
  const forMe = fresh.filter(o=>!(ME.id && o.createdBy===ME.id));
  if(!forMe.length || !myRole() || !can("coleta")) return;
  forMe.forEach(o=>{ newIds.add(o.id); alertQueue.push(o.id); });
  showAlert();
  chime(); try{ navigator.vibrate && navigator.vibrate([200,100,200,100,300]); }catch(e){}
}
function showAlert(){
  const bar=document.getElementById("alertbar");

  bar.innerHTML = `<div class="ab-in"><span class="ab-ic" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></span>

let tt; function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.hidden=false; clearTimeout(tt); tt=setTimeout(()=>t.hidden=true,2400); }
let pendingRender=false;

  if(document.querySelector(".modal")){ pendingRender=true; return; } // janela aberta: atualiza depois

  if(state.sector==="expedicao"){
    if(["pick","tray","done","tomesa"].includes(state.view) && !can("coleta")) state.view="orders";
    if(state.view==="store" && !can("mesa") && !can("coleta")) state.view="orders";
    if(state.view==="mesa" && !can("mesa")) state.view="orders";
    if(state.view==="orders" && !can("coleta") && can("mesa") && !state.mesaListOk) state.view="mesa";
  }

  if(state.view==="labels") return renderLabels();

}

  cfgDoc.onSnapshot(snap=>{ const d=snap.exists?snap.data():null; CONFIG = {requireLoc:false, useTray: d?.useTray ?? true}; rerender(); }, ()=>{ cfgDoc=null; });
  usersCol = db.collection("users");
  usersCol.onSnapshot(snap=>{ USERS = Object.fromEntries(snap.docs.map(d=>[d.id, JSON.parse(JSON.stringify(d.data()))])); authReady=true; rerender(); }, e=>{ usersCol=null; authReady=true; rerender(); });
  blockCol = db.collection("blocks");
  blockCol.onSnapshot(snap=>{ BLOCKS = Object.fromEntries(snap.docs.map(d=>[d.id, JSON.parse(JSON.stringify(d.data()))])); rerender(); }, e=>{ blockCol=null; });
  prodCol = db.collection("products");
  prodCol.onSnapshot(snap=>{ PRODUCTS = Object.fromEntries(snap.docs.map(d=>[d.id, JSON.parse(JSON.stringify(d.data()))])); rerender(); }, e=>{ prodCol=null; });
  col = db.collection("orders");
  col.onSnapshot(snap=>{
    const allOrders = snap.docs.map(d=>normalize(JSON.parse(JSON.stringify(d.data()))));
    ORDERS = allOrders.filter(o=>o.status!=="excluido"); DELETED = allOrders.filter(o=>o.status==="excluido");
    if(authReady) checkNewOrders(); else seenOrders = null;
    synced = true; rerender();
  }, e=>{ col=null; synced=false; rerender(); });
})();
</script>

</body>
</html>
